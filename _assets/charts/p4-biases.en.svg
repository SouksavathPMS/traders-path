<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Six biases that cost traders money</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Everyone has them. The goal is not to remove them, but to build rules that catch them.</tspan></text><rect x="28.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#ef4444" fill-opacity="1"/><text x="46.0" y="132.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">Loss aversion</tspan></text><text x="46.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">A loss hurts ~2× more than an</tspan><tspan x="46.0" dy="18.9">equal gain feels good.</tspan></text><text x="46.0" y="262.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="46.0" dy="0.0">Fix: think in R, accept −1R in advance</tspan></text><rect x="336.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#f59e0b" fill-opacity="1"/><text x="354.0" y="132.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="354.0" dy="0.0">Confirmation bias</tspan></text><text x="354.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="354.0" dy="0.0">You see only the evidence that</tspan><tspan x="354.0" dy="18.9">agrees with your position.</tspan></text><text x="354.0" y="262.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="354.0" dy="0.0">Fix: write what would prove you wrong</tspan></text><rect x="644.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#3b82f6" fill-opacity="1"/><text x="662.0" y="132.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">Recency bias</tspan></text><text x="662.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">The last 3 trades feel like</tspan><tspan x="662.0" dy="18.9">the whole truth.</tspan></text><text x="662.0" y="262.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="600"><tspan x="662.0" dy="0.0">Fix: judge on 100+ trades (3.4)</tspan></text><rect x="28.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#a855f7" fill-opacity="1"/><text x="46.0" y="360.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">Overconfidence</tspan></text><text x="46.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">After a win streak, you size up</tspan><tspan x="46.0" dy="18.9">and loosen the rules.</tspan></text><text x="46.0" y="490.0" font-size="13" fill="#a855f7" text-anchor="start" font-weight="600"><tspan x="46.0" dy="0.0">Fix: risk is fixed, never &#x27;earned&#x27;</tspan></text><rect x="336.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#14b8a6" fill-opacity="1"/><text x="354.0" y="360.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="354.0" dy="0.0">Anchoring</tspan></text><text x="354.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="354.0" dy="0.0">&quot;It was 120 last month, so 95</tspan><tspan x="354.0" dy="18.9">is cheap.&quot;</tspan></text><text x="354.0" y="490.0" font-size="13" fill="#14b8a6" text-anchor="start" font-weight="600"><tspan x="354.0" dy="0.0">Fix: structure, not old prices</tspan></text><rect x="644.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#ec4899" fill-opacity="1"/><text x="662.0" y="360.0" font-size="17" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">Sunk cost / disposition</tspan></text><text x="662.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">Sell winners fast, hold losers</tspan><tspan x="662.0" dy="18.9">because &#x27;I&#x27;ve lost too much to sell&#x27;.</tspan></text><text x="662.0" y="490.0" font-size="13" fill="#ec4899" text-anchor="start" font-weight="600"><tspan x="662.0" dy="0.0">Fix: stop and target set before entry</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Power of Three: accumulate → manipulate → distribute</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">One way ICT reads a bullish day. A model to test, not a law.</tspan></text><rect x="28.0" y="90.0" width="620.0" height="390.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="60.0" y="110.0" width="180.0" height="340.0" rx="0" fill="#a855f7" fill-opacity="0.08"/><text x="150.0" y="128.0" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">A · Asia</tspan></text><text x="150.0" y="400.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0.0">accumulation:</tspan><tspan x="150.0" dy="14.9">tight range</tspan></text><rect x="240.0" y="110.0" width="120.0" height="340.0" rx="0" fill="#ef4444" fill-opacity="0.08"/><text x="300.0" y="128.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">M · London</tspan></text><text x="300.0" y="400.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="300.0" dy="0.0">manipulation:</tspan><tspan x="300.0" dy="14.9">false move down</tspan><tspan x="300.0" dy="14.9">(Judas swing)</tspan></text><rect x="360.0" y="110.0" width="270.0" height="340.0" rx="0" fill="#22c55e" fill-opacity="0.08"/><text x="495.0" y="128.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">D · New York</tspan></text><text x="495.0" y="400.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="495.0" dy="0.0">distribution:</tspan><tspan x="495.0" dy="14.9">real move up</tspan></text><line x1="60.0" y1="330.0" x2="630.0" y2="330.0" stroke="#5b6b88" stroke-width="1" stroke-opacity="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="64.0" y="324.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="64.0" dy="0.0">daily open</tspan></text><polyline points="60.0,330.0 90.0,314.0 120.0,342.0 150.0,318.0 180.0,338.0 210.0,322.0 240.0,346.0 270.0,374.0 300.0,398.0 330.0,386.0 360.0,354.0 390.0,306.0 420.0,258.0 450.0,278.0 480.0,226.0 510.0,178.0 540.0,202.0 570.0,166.0 600.0,186.0 630.0,190.0" fill="none" stroke="#e5ecf6" stroke-width="2.5" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="670.0" y="90.0" width="262.0" height="390.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="790.0" y="118.0" font-size="15" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">The daily candle</tspan></text><line x1="790.0" y1="166.0" x2="790.0" y2="398.0" stroke="#22c55e" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><rect x="760.0" y="190.0" width="60.0" height="140.0" rx="4" fill="#22c55e" fill-opacity="1"/><text x="832.0" y="334.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">open</tspan></text><text x="832.0" y="402.0" font-size="12" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="832.0" dy="0.0">low = Judas</tspan></text><text x="832.0" y="194.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">close</tspan></text><text x="790.0" y="455.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Buy below the open,</tspan><tspan x="790.0" dy="17.6">not above it.</tspan></text></svg>
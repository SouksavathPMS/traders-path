<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="400" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ขนาดล็อตและมูลค่าต่อ Pip (คู่เงินที่ลงท้ายด้วย USD)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">มูลค่าต่อ pip = จำนวนหน่วย × 0.0001  ความเสี่ยง = ระยะ pip ถึง Stop × มูลค่าต่อ pip</tspan></text><text x="48.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ชื่อ</tspan></text><text x="280.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">ล็อต</tspan></text><text x="420.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="420.0" dy="0.0">จำนวนยูโร</tspan></text><text x="610.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="610.0" dy="0.0">1 pip =</tspan></text><text x="780.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="780.0" dy="0.0">Stop 20 pip =</tspan></text><rect x="28.0" y="136.0" width="904.0" height="58.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="172.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ล็อตมาตรฐาน</tspan></text><text x="280.0" y="172.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">1.00</tspan></text><text x="420.0" y="172.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="420.0" dy="0.0">100,000</tspan></text><text x="610.0" y="172.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="610.0" dy="0.0">10.00 USD</tspan></text><text x="780.0" y="172.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="780.0" dy="0.0">200.00 USD</tspan></text><rect x="28.0" y="206.0" width="904.0" height="58.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="242.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">มินิล็อต</tspan></text><text x="280.0" y="242.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">0.10</tspan></text><text x="420.0" y="242.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="420.0" dy="0.0">10,000</tspan></text><text x="610.0" y="242.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="610.0" dy="0.0">1.00 USD</tspan></text><text x="780.0" y="242.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="780.0" dy="0.0">20.00 USD</tspan></text><rect x="28.0" y="276.0" width="904.0" height="58.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="312.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ไมโครล็อต</tspan></text><text x="280.0" y="312.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">0.01</tspan></text><text x="420.0" y="312.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="420.0" dy="0.0">1,000</tspan></text><text x="610.0" y="312.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="610.0" dy="0.0">0.10 USD</tspan></text><text x="780.0" y="312.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="780.0" dy="0.0">2.00 USD</tspan></text><text x="48.0" y="370.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ทองคำ (
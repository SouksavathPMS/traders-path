<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">เช็กลิสต์สัญญาณอันตราย: หยุดทันทีถ้าเจอแม้แต่ ข้อเดียว</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">พิมพ์ แคปหน้าจอ ส่งให้ครอบครัว</tspan></text><rect x="28.0" y="96.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="120.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="140.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="134.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">รับประกันผลตอบแทน หรือผลตอบแทนคงที่</tspan></text><text x="88.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">&#x27;เดือนละ 10% ไม่มีความเสี่ยง&#x27;</tspan></text><rect x="486.0" y="96.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="120.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="140.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="134.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">เร่งรีบ</tspan></text><text x="546.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">&#x27;วันนี้วันเดียว&#x27; &#x27;เหลือ 3 ที่สุดท้าย&#x27;</tspan></text><rect x="28.0" y="196.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="220.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="240.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="234.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">ให้เก็บเป็นความลับ</tspan></text><text x="88.0" y="260.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">&#x27;อย่าบอกครอบครัว / ธนาคาร&#x27;</tspan></text><rect x="486.0" y="196.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="220.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="240.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="234.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">ได้รางวัลเมื่อชวนคนอื่น</tspan></text><text x="546.0" y="260.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">โบนัสทุกครั้งที่ชวนเพื่อนเข้า</tspan></text><rect x="28.0" y="296.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="320.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="340.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="334.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">ไม่มีใบอนุญาต</tspan></text><text x="88.0" y="360.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">ไม่อยู่ในทะเบียนของผู้กำกับดูแล</tspan></text><rect x="486.0" y="296.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="320.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="340.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="334.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">ถอนเงินมีปัญหา</tspan></text><text x="546.0" y="360.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">ค่าธรรมเนียม &#x27;ภาษี&#x27; ถ่วงเวลาก่อนถอน</tspan></text><rect x="28.0" y="396.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="420.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="440.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="434.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">โฆษณาคนดัง หรือ &#x27;เมนเทอร์&#x27;</tspan></text><text x="88.0" y="460.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">หน้าคนดัง รถหรู ภาพกำไร</tspan></text><rect x="486.0" y="396.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="420.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="440.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="434.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">เขาเป็นฝ่ายทักมาก่อน</tspan></text><text x="546.0" y="460.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">ข้อความจากคนไม่รู้จัก โทรจาก &#x27;ผู้จัดการบัญชี&#x27;</tspan></text></svg>
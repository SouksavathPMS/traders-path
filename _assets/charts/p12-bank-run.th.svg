<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ดอกเบี้ยขาขึ้นและเงินฝากที่ไม่ได้รับการคุ้มครองทำให้ SVB พังได้อย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">คณิตศาสตร์พันธบัตร (คำนวณจริง) และงบดุลที่รายงานของ SVB (Wikipedia)</tspan></text><rect x="30.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="30.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="50.0" y="130.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">1 · เงินฝากไหลเข้า (2020–21)</tspan></text><text x="50.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">สตาร์ตอัปเทคฝากเงินที่ SVB</tspan><tspan x="50.0" dy="17.6">~89% ของเงินฝากเกินวงเงิน</tspan><tspan x="50.0" dy="17.6">คุ้มครอง 250,000 ดอลลาร์</tspan></text><rect x="340.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="340.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="360.0" y="130.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">2 · ซื้อพันธบัตรยาวตอนดอกเบี้ยต่ำ</tspan></text><text x="360.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="360.0" dy="0.0">พันธบัตร 10 ปี คูปอง 1.5% มีค่า</tspan><tspan x="360.0" dy="17.6">79.72 เมื่อผลตอบแทนเป็น 4%</tspan><tspan x="360.0" dy="17.6">(−20%) ขาดทุนที่ยังไม่รับรู้ใน</tspan><tspan x="360.0" dy="17.6">พันธบัตรถือจนครบกำหนด &gt; 15 พันล้านดอลลาร์</tspan></text><rect x="650.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="650.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="670.0" y="130.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">3 · ถูกบังคับขาย เกิดการแห่ถอน</tspan></text><text x="670.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">8 มี.ค.: ขายพันธบัตรขาดทุน 1.8 พันล้าน</tspan><tspan x="670.0" dy="17.6">9 มี.ค.: ลูกค้าพยายามถอน</tspan><tspan x="670.0" dy="17.6">42 พันล้านดอลลาร์ในวันเดียว</tspan><tspan x="670.0" dy="17.6">10 มี.ค.: ถูกทางการปิด</tspan></text><text x="40.0" y="392.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">วงเงินคุ้มครองเงินฝาก: FDIC สหรัฐ 250,000 ดอลลาร์ต่อผู้ฝากต่อธนาคาร ไทย สคฝ. 1,000,000 บาทต่อผู้ฝากต่อสถาบัน (ตั้งแต่ 11 ส.ค. 2021)</tspan></text><text x="40.0" y="414.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">วันที่ 12 มีนาคม 2023 ทางการค้ำประกันเงินฝากทั้งหมดของ SVB โดยใช้ข้อยกเว้นความเสี่ยงเชิงระบบ: การช่วยเหลือที่คุณนับเป็นหลักประกันไม่ได้</tspan></text></svg>
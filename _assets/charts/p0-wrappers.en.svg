ract on an</tspan><tspan x="412.0" dy="17.6">EXCHANGE (CME)</tspan><tspan x="412.0" dy="17.6">Has an expiry</tspan><tspan x="412.0" dy="17.6">Margin, leverage</tspan></text><line x1="480.0" y1="204.0" x2="658.0" y2="258.0" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#a14b8a6)"/><rect x="574.0" y="262.0" width="170.0" height="168.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="574.0" y="262.0" width="5.0" height="168.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="594.0" y="292.0" font-size="18" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="594.0" dy="0.0">ETF</tspan></text><text x="594.0" y="322.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="594.0" dy="0.0">A SHARE of a fund</tspan><tspan x="594.0" dy="17.6">that holds gold</tspan><tspan x="594.0" dy="17.6">No expiry</tspan><tspan x="594.0" dy="17.6">Yearly fee</tspan></text><line x1="480.0" y1="204.0" x2="840.0" y2="258.0" stroke="#a855f7" stroke-width="1.6" marker-end="url(#aa855f7)"/><rect x="756.0" y="262.0" width="170.0" height="168.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="756.0" y="262.0" width="5.0" height="168.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="776.0" y="292.0" font-size="18" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="776.0" dy="0.0">Option</tspan></text><text x="776.0" y="322.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="776.0" dy="0.0">The RIGHT to buy</tspan><tspan x="776.0" dy="17.6">or sell later</tspan><tspan x="776.0" dy="17.6">Has an expiry</tspan><tspan x="776.0" dy="17.6">see 8.1</tspan></text><rect x="28.0" y="452.0" width="904.0" height="86.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="482.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Ask three questions about any product:</ts
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="534" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">กองทุนลดหย่อนภาษีไทย (กฎ ณ ต.ค. 2026)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">การลดหย่อนลดเงินได้สุทธิ สิ่งที่ประหยัดได้ขึ้นกับอัตราภาษีขั้นสูงสุดของคุณ ระยะถือขั้นต่ำคือราคาที่ต้องจ่าย</tspan></text><rect x="28.0" y="92.0" width="440.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="196.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="122.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ThaiESG</tspan></text><text x="48.0" y="151.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">• ลดหย่อนได้ถึง 30% ของเงินได้</tspan><tspan x="48.0" dy="18.9">  สูงสุด 300,000 บาทต่อปี</tspan><tspan x="48.0" dy="18.9">• ถือขั้นต่ำ 5 ปีนับจากวันซื้อ</tspan><tspan x="48.0" dy="18.9">• หุ้น/ตราสารหนี้ไทยตามเกณฑ์ ESG</tspan><tspan x="48.0" dy="18.9">• มาตรการครอบคลุมการซื้อปี 2024–2026</tspan></text><rect x="492.0" y="92.0" width="440.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="92.0" width="5.0" height="196.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="512.0" y="122.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">RMF</tspan></text><text x="512.0" y="151.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">• ลดหย่อนได้ถึง 30% ของเงินได้</tspan><tspan x="512.0" dy="18.9">  สูงสุด 500,000 บาท (รวมกับกองทุน</tspan><tspan x="512.0" dy="18.9">  สำรองเลี้ยงชีพ ประกันบำนาญ ฯลฯ)</tspan><tspan x="512.0" dy="18.9">• ถือ 5 ปีขึ้นไป และ จนอายุ 55</tspan><tspan x="512.0" dy="18.9">• สำหรับการออมเพื่อเกษียณ</tspan></text><rect x="28.0" y="304.0" width="904.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="334.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ภาษีที่ประหยัดเมื่อซื้อกองทุนลดหย่อน 100,000 บาท (อัตราภาษีเงินได้บุคคลธรรมดาไทย)</tspan></text><rect x="60.0" y="433.3" width="120.0" height="36.7" rx="4" fill="#14b8a6" fill-opacity="0.85"/><text x="120.0" y="425.3" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">10,000</tspan></text><text x="190.0" y="420.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="190.0" dy="0.0">เงินได้สุทธิ</tspan><tspan x="190.0" dy="16.2">400,000</tspan></text><rect x="280.0" y="396.7" width="120.0" height="73.3" rx="4" fill="#14b8a6" fill-opacity="0.85"/><text x="340.0" y="388.7" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">20,000</tspan></text><text x="410.0" y="420.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="410.0" dy="0.0">เงินได้สุทธิ</tspan><tspan x="410.0" dy="16.2">900,000</tspan></text><rect x="500.0" y="378.3" width="120.0" height="91.7" rx="4" fill="#14b8a6" fill-opacity="0.85"/><text x="560.0" y="370.3" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">25,000</tspan></text><text x="630.0" y="420.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="630.0" dy="0.0">เงินได้สุทธิ</tspan><tspan x="630.0" dy="16.2">1,500,000</tspan></text><rect x="720.0" y="360.0" width="120.0" height="110.0" rx="4" fill="#14b8a6" fill-opacity="0.85"/><text x="780.0" y="352.0" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">30,000</tspan></text><text x="850.0" y="420.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="850.0" dy="0.0">เงินได้สุทธิ</tspan><tspan x="850.0" dy="16.2">3,000,000</tspan></text><text x="48.0" y="515.0" font-size="11" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">SSF: ไม่มีสิทธิลดหย่อนใหม่สำหรับการซื้อหลังปี 2024 ThaiESGX: ช่วงพิเศษ พ.ค.–มิ.ย. 2025 เท่านั้น</tspan></text></svg>
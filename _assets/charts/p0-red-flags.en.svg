<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Red-flag checklist: stop if you see even ONE</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Print it, screenshot it, send it to your family.</tspan></text><rect x="28.0" y="96.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="120.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="140.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="134.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">Guaranteed or fixed returns</tspan></text><text x="88.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">&#x27;10% a month, no risk&#x27;</tspan></text><rect x="486.0" y="96.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="120.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="140.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="134.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">Urgency</tspan></text><text x="546.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">&#x27;Only today&#x27;, &#x27;last 3 seats&#x27;</tspan></text><rect x="28.0" y="196.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="220.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="240.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="234.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">Secrecy</tspan></text><text x="88.0" y="260.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">&#x27;Don&#x27;t tell your family / bank&#x27;</tspan></text><rect x="486.0" y="196.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="220.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="240.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="234.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">Rewards for recruiting</tspan></text><text x="546.0" y="260.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">bonus for every friend who joins</tspan></text><rect x="28.0" y="296.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="320.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="340.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="334.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">Not licensed</tspan></text><text x="88.0" y="360.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">not on the regulator&#x27;s own register</tspan></text><rect x="486.0" y="296.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="320.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="340.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="334.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">Withdrawal problems</tspan></text><text x="546.0" y="360.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">fees, &#x27;taxes&#x27;, delays before you can withdraw</tspan></text><rect x="28.0" y="396.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="46.0" y="420.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="59.0" y="440.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="59.0" dy="0.0">✗</tspan></text><text x="88.0" y="434.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="88.0" dy="0.0">Celebrity or &#x27;mentor&#x27; ads</tspan></text><text x="88.0" y="460.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="88.0" dy="0.0">famous faces, Lamborghinis, screenshots of profits</tspan></text><rect x="486.0" y="396.0" width="446.0" height="88.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><rect x="504.0" y="420.0" width="26.0" height="26.0" rx="5" fill="none" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="517.0" y="440.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="517.0" dy="0.0">✗</tspan></text><text x="546.0" y="434.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="546.0" dy="0.0">Contact starts with them</tspan></text><text x="546.0" y="460.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="546.0" dy="0.0">unknown message, &#x27;account manager&#x27; call</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Phase 10 on one page</tspan></text><line x1="480.0" y1="310.0" x2="170.0" y2="140.0" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="790.0" y2="140.0" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="150.0" y2="320.0" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="810.0" y2="320.0" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="250.0" y2="480.0" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="710.0" y2="480.0" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><circle cx="480.0" cy="310.0" r="74" fill="#111a2e" stroke="#e5ecf6" stroke-width="2"/><text x="480.0" y="306.0" font-size="20" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">PHASE 10</tspan></text><text x="480.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Macro &amp; Investing</tspan></text><rect x="30.0" y="98.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="170.0" y="126.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">10.1–10.2 Cycle &amp; policy</tspan></text><text x="170.0" y="150.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0.0">Where are we in the cycle?</tspan><tspan x="170.0" dy="16.2">What is the central bank doing?</tspan></text><rect x="650.0" y="98.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="790.0" y="126.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">10.3 Data &amp; events</tspan></text><text x="790.0" y="150.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="790.0" dy="0.0">Surprise vs expectation.</tspan><tspan x="790.0" dy="16.2">No new trades into big news.</tspan></text><rect x="10.0" y="278.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="150.0" y="306.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">10.4 Intermarket</tspan></text><text x="150.0" y="330.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0.0">Dollar, yields, oil, gold.</tspan><tspan x="150.0" dy="16.2">Relationships shift.</tspan></text><rect x="670.0" y="278.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="810.0" y="306.0" font-size="15" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">10.5 Wall Street</tspan></text><text x="810.0" y="330.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="810.0" dy="0.0">Sell side vs buy side.</tspan><tspan x="810.0" dy="16.2">Follow the incentives.</tspan></text><rect x="110.0" y="438.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="250.0" y="466.0" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">10.6 Valuation</tspan></text><text x="250.0" y="490.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="250.0" dy="0.0">Cash flows, discounted.</tspan><tspan x="250.0" dy="16.2">Rates drive multiples.</tspan></text><rect x="570.0" y="438.0" width="280.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ec4899" stroke-width="1.5"/><text x="710.0" y="466.0" font-size="15" fill="#ec4899" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">10.7 Portfolio</tspan></text><text x="710.0" y="490.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="710.0" dy="0.0">Diversify, keep costs low,</tspan><tspan x="710.0" dy="16.2">hold through drawdowns.</tspan></text></svg>
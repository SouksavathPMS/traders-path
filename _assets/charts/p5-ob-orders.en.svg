<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Order block as unfilled orders (illustrative)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">A fund wants to buy 1,000 contracts around 101.8–102.4. Price runs away before it&#x27;s finished.</tspan></text><rect x="28.0" y="100.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="136.0" y="130.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">1 · The last red candle</tspan></text><rect x="106.0" y="160.0" width="60.0" height="160.0" rx="4" fill="none" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="106.0" y="224.0" width="60.0" height="96.0" rx="4" fill="#22c55e" fill-opacity="0.6"/><text x="136.0" y="340.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="136.0" dy="0.0">filled 600 / 1,000</tspan></text><text x="136.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">Fund absorbs sellers:</tspan><tspan x="136.0" dy="16.2">600 of 1,000 filled</tspan></text><rect x="258.0" y="100.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="366.0" y="130.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">2 · Displacement + BOS</tspan></text><rect x="336.0" y="160.0" width="60.0" height="160.0" rx="4" fill="none" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="224.0" width="60.0" height="96.0" rx="4" fill="#22c55e" fill-opacity="0.6"/><text x="366.0" y="340.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="366.0" dy="0.0">filled 600 / 1,000</tspan></text><text x="366.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">Price runs to 106+.</tspan><tspan x="366.0" dy="16.2">400 still wanted</tspan></text><rect x="488.0" y="100.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="596.0" y="130.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">3 · First return</tspan></text><rect x="566.0" y="160.0" width="60.0" height="160.0" rx="4" fill="none" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="566.0" y="224.0" width="60.0" height="96.0" rx="4" fill="#22c55e" fill-opacity="0.6"/><rect x="566.0" y="160.0" width="60.0" height="64.0" rx="4" fill="#3b82f6" fill-opacity="0.85"/><text x="596.0" y="340.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="596.0" dy="0.0">filled 1,000 / 1,000</tspan></text><text x="596.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">400 resting buys meet</tspan><tspan x="596.0" dy="16.2">price → support</tspan></text><rect x="718.0" y="100.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#8ea0bd" stroke-width="1.5"/><text x="826.0" y="130.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">4 · Mitigated</tspan></text><rect x="796.0" y="160.0" width="60.0" height="160.0" rx="4" fill="none" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="796.0" y="160.0" width="60.0" height="160.0" rx="4" fill="#8ea0bd" fill-opacity="0.6"/><text x="826.0" y="340.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="826.0" dy="0.0">filled 1,000 / 1,000</tspan></text><text x="826.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">All 1,000 filled. A 2nd</tspan><tspan x="826.0" dy="16.2">return finds no buyers</tspan></text></svg>
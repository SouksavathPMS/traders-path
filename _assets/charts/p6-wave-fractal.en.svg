<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Waves are fractal: each wave is made of smaller waves</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Motive waves subdivide into 5; corrective waves into 3. Same pattern, every timeframe.</tspan></text><rect x="28.0" y="90.0" width="904.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><polyline points="70.0,389.3 252.2,285.6 361.6,349.6 616.7,181.9 726.0,245.9 890.0,142.2" fill="none" stroke="#5b6b88" stroke-width="7" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><polyline points="70.0,389.3 106.4,356.1 124.7,368.5 183.0,308.4 204.8,322.9 252.2,285.6 296.0,325.3 317.8,309.9 361.6,349.6 412.6,296.0 438.1,316.1 519.7,218.8 550.3,242.3 616.7,181.9 660.4,221.6 682.3,206.2 726.0,245.9 758.8,212.8 775.2,225.2 827.7,165.1 847.4,179.6 890.0,142.2" fill="none" stroke="#e5ecf6" stroke-width="2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="252.2" cy="285.6" r="4" fill="#22c55e"/><text x="252.2" y="273.6" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="252.2" dy="0.0">(1)</tspan></text><circle cx="361.6" cy="349.6" r="4" fill="#ef4444"/><text x="361.6" y="373.6" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="361.6" dy="0.0">(2)</tspan></text><circle cx="616.7" cy="181.9" r="4" fill="#22c55e"/><text x="616.7" y="169.9" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="616.7" dy="0.0">(3)</tspan></text><circle cx="726.0" cy="245.9" r="4" fill="#ef4444"/><text x="726.0" y="269.9" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="726.0" dy="0.0">(4)</tspan></text><circle cx="890.0" cy="142.2" r="4" fill="#22c55e"/><text x="890.0" y="130.2" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">(5)</tspan></text><text x="422.6" y="292.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="422.6" dy="0.0">i</tspan></text><text x="448.1" y="330.1" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="448.1" dy="0.0">ii</tspan></text><text x="529.7" y="214.8" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="529.7" dy="0.0">iii</tspan></text><text x="560.3" y="256.3" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="560.3" dy="0.0">iv</tspan></text><text x="626.7" y="177.9" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="626.7" dy="0.0">v</tspan></text><text x="70.0" y="432.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="70.0" dy="0.0">Thick grey = one larger-degree impulse (1)-(5). Thin white = its smaller waves. Wave (3) shown with sub-waves i-v.</tspan></text></svg>
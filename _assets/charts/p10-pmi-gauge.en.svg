<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How a PMI number is made</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Purchasing managers answer: better, same or worse than last month? PMI = % better + ½ × % same.</tspan></text><text x="48.0" y="142.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Month A</tspan></text><rect x="160.0" y="120.0" width="132.0" height="36.0" rx="0" fill="#22c55e" fill-opacity="0.8"/><text x="226.0" y="144.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="226.0" dy="0.0">30%</tspan></text><rect x="292.0" y="120.0" width="176.0" height="36.0" rx="0" fill="#8ea0bd" fill-opacity="0.8"/><text x="380.0" y="144.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">40%</tspan></text><rect x="468.0" y="120.0" width="132.0" height="36.0" rx="0" fill="#ef4444" fill-opacity="0.8"/><text x="534.0" y="144.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="534.0" dy="0.0">30%</tspan></text><text x="640.0" y="144.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="640.0" dy="0.0">30 + ½ × 40 =</tspan></text><text x="800.0" y="146.0" font-size="26" fill="#f59e0b" text-anchor="start" font-weight="800"><tspan x="800.0" dy="0.0">50</tspan></text><text x="48.0" y="232.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Month B</tspan></text><rect x="160.0" y="210.0" width="110.0" height="36.0" rx="0" fill="#22c55e" fill-opacity="0.8"/><text x="215.0" y="234.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">25%</tspan></text><rect x="270.0" y="210.0" width="176.0" height="36.0" rx="0" fill="#8ea0bd" fill-opacity="0.8"/><text x="358.0" y="234.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="358.0" dy="0.0">40%</tspan></text><rect x="446.0" y="210.0" width="154.0" height="36.0" rx="0" fill="#ef4444" fill-opacity="0.8"/><text x="523.0" y="234.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="523.0" dy="0.0">35%</tspan></text><text x="640.0" y="234.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="640.0" dy="0.0">25 + ½ × 40 =</tspan></text><text x="800.0" y="236.0" font-size="26" fill="#ef4444" text-anchor="start" font-weight="800"><tspan x="800.0" dy="0.0">45</tspan></text><text x="48.0" y="322.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Month C</tspan></text><rect x="160.0" y="300.0" width="154.0" height="36.0" rx="0" fill="#22c55e" fill-opacity="0.8"/><text x="237.0" y="324.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">35%</tspan></text><rect x="314.0" y="300.0" width="198.0" height="36.0" rx="0" fill="#8ea0bd" fill-opacity="0.8"/><text x="413.0" y="324.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="413.0" dy="0.0">45%</tspan></text><rect x="512.0" y="300.0" width="88.0" height="36.0" rx="0" fill="#ef4444" fill-opacity="0.8"/><text x="556.0" y="324.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="556.0" dy="0.0">20%</tspan></text><text x="640.0" y="324.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="640.0" dy="0.0">35 + ½ × 45 =</tspan></text><text x="800.0" y="326.0" font-size="26" fill="#22c55e" text-anchor="start" font-weight="800"><tspan x="800.0" dy="0.0">57.5</tspan></text><text x="160.0" y="104.0" font-size="12" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="160.0" dy="0.0">better</tspan></text><text x="300.0" y="104.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="300.0" dy="0.0">same</tspan></text><text x="470.0" y="104.0" font-size="12" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="470.0" dy="0.0">worse</tspan></text><rect x="28.0" y="380.0" width="904.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="408.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Above 50 = more firms say business is improving (expansion). Below 50 = contraction. The direction matters too.</tspan></text></svg>
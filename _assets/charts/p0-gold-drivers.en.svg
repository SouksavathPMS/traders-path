<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="400" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Gold&#x27;s dashboard: four main drivers</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Typical relationships, not laws. They can break for months (see section 3).</tspan></text><rect x="28.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="136.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">Real interest rates</tspan></text><text x="88.0" y="196.0" font-size="44" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="88.0" dy="0.0">↑</tspan></text><text x="184.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="184.0" dy="0.0">↓</tspan></text><text x="88.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="88.0" dy="0.0">driver</tspan></text><text x="184.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="184.0" dy="0.0">gold</tspan></text><line x1="114.0" y1="182.0" x2="156.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="44.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="44.0" dy="0.0">Gold pays no interest. When safe</tspan><tspan x="44.0" dy="16.2">bonds pay more after inflation,</tspan><tspan x="44.0" dy="16.2">holding gold costs more.</tspan></text><rect x="258.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="258.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="366.0" y="130.0" font-size="16" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">US dollar</tspan></text><text x="318.0" y="196.0" font-size="44" fill="#14b8a6" text-anchor="middle" font-weight="800"><tspan x="318.0" dy="0.0">↑</tspan></text><text x="414.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="414.0" dy="0.0">↓</tspan></text><text x="318.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="318.0" dy="0.0">driver</tspan></text><text x="414.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="414.0" dy="0.0">gold</tspan></text><line x1="344.0" y1="182.0" x2="386.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="274.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="274.0" dy="0.0">Gold is priced in USD. A stronger</tspan><tspan x="274.0" dy="16.2">dollar makes gold dearer for</tspan><tspan x="274.0" dy="16.2">everyone else.</tspan></text><rect x="488.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="596.0" y="130.0" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">Fear &amp; crisis</tspan></text><text x="548.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="548.0" dy="0.0">↑</tspan></text><text x="644.0" y="196.0" font-size="44" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="644.0" dy="0.0">↑</tspan></text><text x="548.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="548.0" dy="0.0">driver</tspan></text><text x="644.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="644.0" dy="0.0">gold</tspan></text><line x1="574.0" y1="182.0" x2="616.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="504.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="504.0" dy="0.0">Wars, bank failures, market</tspan><tspan x="504.0" dy="16.2">crashes → people want an asset</tspan><tspan x="504.0" dy="16.2">with no issuer that can fail.</tspan></text><rect x="718.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="718.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="826.0" y="130.0" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">Central-bank buying</tspan></text><text x="778.0" y="196.0" font-size="44" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="778.0" dy="0.0">↑</tspan></text><text x="874.0" y="196.0" font-size="44" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="874.0" dy="0.0">↑</tspan></text><text x="778.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="778.0" dy="0.0">driver</tspan></text><text x="874.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="874.0" dy="0.0">gold</tspan></text><line x1="804.0" y1="182.0" x2="846.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="734.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="734.0" dy="0.0">Steady, price-insensitive buyers</tspan><tspan x="734.0" dy="16.2">that diversify reserves away</tspan><tspan x="734.0" dy="16.2">from the dollar.</tspan></text><text x="28.0" y="378.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="28.0" dy="0.0">Also watch: inflation expectations, Indian &amp; Chinese jewellery demand, ETF flows (e.g. GLD holdings).</tspan></text></svg>
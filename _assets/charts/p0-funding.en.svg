<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="af59e0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Perpetual futures: the funding rate</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">No expiry, so a small payment between longs and shorts (often every 8 hours) keeps the price near spot.</tspan></text><rect x="28.0" y="96.0" width="442.0" height="230.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="249.0" y="126.0" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="249.0" dy="0.0">Funding POSITIVE</tspan></text><text x="249.0" y="152.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="249.0" dy="0.0">perp price above spot</tspan><tspan x="249.0" dy="17.6">(too many longs)</tspan></text><rect x="58.0" y="200.0" width="130.0" height="60.0" rx="10" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/><text x="123.0" y="236.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="123.0" dy="0.0">Longs</tspan></text><rect x="310.0" y="200.0" width="130.0" height="60.0" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/><text x="375.0" y="236.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">Shorts</tspan></text><line x1="192.0" y1="230.0" x2="306.0" y2="230.0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)"/><text x="249.0" y="220.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="249.0" dy="0.0">pay</tspan></text><text x="249.0" y="300.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="249.0" dy="0.0">→ discourages new longs</tspan></text><rect x="490.0" y="96.0" width="442.0" height="230.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="711.0" y="126.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="711.0" dy="0.0">Funding NEGATIVE</tspan></text><text x="711.0" y="152.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="711.0" dy="0.0">perp price below spot</tspan><tspan x="711.0" dy="17.6">(too many shorts)</tspan></text><rect x="520.0" y="200.0" width="130.0" height="60.0" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="585.0" y="236.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">Shorts</tspan></text><rect x="772.0" y="200.0" width="130.0" height="60.0" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/><text x="837.0" y="236.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="837.0" dy="0.0">Longs</tspan></text><line x1="654.0" y1="230.0" x2="768.0" y2="230.0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)"/><text x="711.0" y="220.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="711.0" dy="0.0">pay</tspan></text><text x="711.0" y="300.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="711.0" dy="0.0">→ discourages new shorts</tspan></text><text x="48.0" y="362.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Example: +0.01% per 8 h on a 10,000 USD long = 1 USD each time, 3 USD a day, about 11% a year.</tspan></text><text x="48.0" y="390.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Very high positive funding = crowded longs: a warning sign, not a buy signal.</tspan></text></svg>
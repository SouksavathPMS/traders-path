<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Chase the breakout or wait for the retest?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Same breakout, same stop below the old zone (108.9), same target 117, risk 100 USD each (illustrative).</tspan></text><line x1="348.0" y1="110.0" x2="348.0" y2="330.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="348.0" y="350.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="348.0" dy="0.0">108</tspan></text><line x1="444.0" y1="110.0" x2="444.0" y2="330.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="444.0" y="350.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="444.0" dy="0.0">110</tspan></text><line x1="540.0" y1="110.0" x2="540.0" y2="330.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="540.0" y="350.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="540.0" dy="0.0">112</tspan></text><line x1="636.0" y1="110.0" x2="636.0" y2="330.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="636.0" y="350.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="636.0" dy="0.0">114</tspan></text><line x1="732.0" y1="110.0" x2="732.0" y2="330.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="732.0" y="350.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="732.0" dy="0.0">116</tspan></text><line x1="828
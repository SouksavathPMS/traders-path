<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ผลของค่าเงินต่อนักลงทุนไทยในหุ้นสหรัฐ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">หุ้นสหรัฐขึ้น 10% เป็นดอลลาร์ สิ่งที่คุณได้เป็นบาทขึ้นกับ USD/THB (อัตราตัวอย่าง)</tspan></text><line x1="480.0" y1="100.0" x2="480.0" y2="340.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><text x="48.0" y="142.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">บาทคงที่</tspan></text><text x="48.0" y="164.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">USD/THB 36.0 → 36.0</tspan></text><rect x="480.0" y="126.0" width="160.0" height="40.0" rx="4" fill="#3b82f6" fill-opacity="0.85"/><text x="650.0" y="152.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="650.0" dy="0.0">+10% เป็นบาท</tspan></text><text x="48.0" y="214.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">บาทแข็ง 10%</tspan></text><text x="48.0" y="236.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">USD/THB 36.0 → 32.4</tspan></text><rect x="464.0" y="198.0" width="16.0" height="40.0" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="454.0" y="224.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="454.0" dy="0.0">-1% เป็นบาท</tspan></text><text x="48.0" y="286.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">บาทอ่อน 10%</tspan></text><text x="48.0" y="308.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">USD/THB 36.0 → 39.6</tspan></text><rect x="480.0" y="270.0" width="336.0" height="40.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="826.0" y="296.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="826.0" dy="0.0">+21% เป็นบาท</tspan></text><text x="48.0" y="380.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">สูตร: ผลตอบแทนเป็นบาท = (1 + ผลตอบแทนหุ้น) × (อัตราใหม่ ÷ อัตราเดิม) − 1</tspan></text></svg>
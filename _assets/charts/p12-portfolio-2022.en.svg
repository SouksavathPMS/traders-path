<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">2022 calendar-year returns: no place to hide</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Index returns as reported; the 60/40 line is a simple weighted mix (illustrative, no rebalancing).</tspan></text><rect x="150.0" y="140.0" width="140.0" height="213.4" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="220.0" y="375.4" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">-19.4%</tspan></text><text x="220.0" y="116.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="220.0" dy="0.0">S&amp;P 500</tspan><tspan x="220.0" dy="16.2">(price)</tspan></text><rect x="400.0" y="140.0" width="140.0" height="143.0" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="470.0" y="305.0" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">-13.0%</tspan></text><text x="470.0" y="116.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="470.0" dy="0.0">US bonds</tspan><tspan x="470.0" dy="16.2">(Bloomberg Agg)</tspan></text><rect x="650.0" y="140.0" width="140.0" height="184.8" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="720.0" y="346.8" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">-16.8%</tspan></text><text x="720.0" y="116.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="720.0" dy="0.0">60/40 mix</tspan></text><text x="40.0" y="412.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">0.6 × (−19.4%) + 0.4 × (−13.0%) = −16.8%. The bond index had its worst year since its start in 1976.</tspan></text><text x="40.0" y="432.0" font-size="11" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">Sources: Yahoo Finance year-end report (S&amp;P 500 −19.4%); A Wealth of Common Sense, Jan 2023 (Agg −13%).</tspan></text></svg>
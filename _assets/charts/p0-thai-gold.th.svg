<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">จาก XAU/USD สู่ราคาทองไทย</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวเลขตัวอย่าง: ทอง 4,000 ดอลลาร์/ออนซ์ USD/THB 33.00 ทองแท่ง 1 บาท = 15.244 กรัม ความบริสุทธิ์ 96.5%</tspan></text><rect x="28.0" y="100.0" width="208.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="132.0" y="130.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">ราคาโลก</tspan></text><text x="132.0" y="186.0" font-size="30" fill="#e5ecf6" text-anchor="middle" font-weight="800"><tspan x="132.0" dy="0.0">4,000</tspan></text><text x="132.0" y="226.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="132.0" dy="0.0">ดอลลาร์ต่อทรอยออนซ์</tspan><tspan x="132.0" dy="16.2">(ทองบริสุทธิ์ 31.1035 กรัม)</tspan></text><text x="248.0" y="196.0" font-size="26" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="248.0" dy="0.0">×</tspan></text><rect x="260.0" y="100.0" width="208.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="364.0" y="130.0" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">ทองบริสุทธิ์ใน 1 บาท</tspan></text><text x="364.0" y="186.0" font-size="30" fill="#e5ecf6" text-anchor="middle" font-weight="800"><tspan x="364.0" dy="0.0">0.47295</tspan></text><text x="364.0" y="226.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="364.0" dy="0.0">ออนซ์ = 15.244 × 0.965</tspan><tspan x="364.0" dy="16.2">÷ 31.1035</tspan></text><text x="480.0" y="196.0" font-size="26" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">×</tspan></text><rect x="492.0" y="100.0" width="208.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="596.0" y="130.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">อัตราแลกเปลี่ยน</tspan></text><text x="596.0" y="186.0" font-size="30" fill="#e5ecf6" text-anchor="middle" font-weight="800"><tspan x="596.0" dy="0.0">33.00</tspan></text><text x="596.0" y="226.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">บาทต่อดอลลาร์</tspan></text><text x="712.0" y="196.0" font-size="26" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">=</tspan></text><rect x="724.0" y="100.0" width="208.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="828.0" y="130.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">ราคาทองแท่งไทย</tspan></text><text x="828.0" y="186.0" font-size="30" fill="#e5ecf6" text-anchor="middle" font-weight="800"><tspan x="828.0" dy="0.0">≈ 62,430</tspan></text><text x="828.0" y="226.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="828.0" dy="0.0">บาทต่อทอง 1 บาท</tspan><tspan x="828.0" dy="16.2">(ก่อนส่วนต่างร้านทอง)</tspan></text><rect x="28.0" y="312.0" width="904.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="342.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ราคาทองไทย ≈ XAU/USD × USD/THB × 0.47295</tspan></text><text x="48.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ทอง +10 ดอลลาร์ (ค่าเงินคงที่)  →  +156 บาท ต่อทอง 1 บาท</tspan></text><text x="48.0" y="400.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">บาทอ่อน 33.00 → 33.10 (ทองคงที่)  →  +189 บาท ต่อทอง 1 บาท</tspan></text><text x="48.0" y="428.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ทองไทยจึงขึ้นได้ในวันที่ทองโลกไม่ขยับ — เพราะเงินบาทอ่อนลง</tspan></text></svg>
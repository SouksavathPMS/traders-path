<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">กฎ 3 ข้อที่ห้ามละเมิด</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ละเมิดข้อเดียว การนับก็ผิด นับใหม่ อย่าเถียงกับตลาด</tspan></text><rect x="28.0" y="92.0" width="904.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="122.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">1 · คลื่น 2 ไม่ต่ำกว่าจุดเริ่มคลื่น 1</tspan></text><line x1="514.0" y1="192.1" x2="696.0" y2="192.1" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="520.0,192.1 576.7,159.3 633.3,179.7 690.0,126.4" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="712.0" y="156.0" font-size="20" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="712.0" dy="0.0">✓</tspan></text><line x1="724.0" y1="192.1" x2="906.0" y2="192.1" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="730.0,192.1 786.7,159.3 843.3,197.1 900.0,152.7" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="922.0" y="156.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="922.0" dy="0.0">✗</tspan></text><text x="46.0" y="156.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">ถ้าต่ำกว่า มันไม่ใช่คลื่น 2: &#x27;แรงส่ง&#x27; ล้มเหลว</t
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">สูตรเดียว สี่ตลาด (1R = 100 ดอลลาร์)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ขนาด = 1R ÷ ขาดทุนต่อหน่วยเมื่อโดน Stop เปลี่ยนแค่ &#x27;หน่วย&#x27;</tspan></text><rect x="28.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="136.0" y="128.0" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">หุ้น</tspan></text><text x="136.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">เข้า 50.00</tspan><tspan x="136.0" dy="18.9">Stop 48.00</tspan></text><text x="136.0" y="248.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">ขาดทุนต่อหน่วย</tspan></text><text x="136.0" y="272.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">2.00 ต่อหุ้น</tspan></text><text x="136.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">100 ÷ 2.00</tspan></text><text x="136.0" y="380.0" font-size="20" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="136.0" dy="0.0">= 50 หุ้น</tspan></text><rect x="258.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="366.0" y="128.0" font-size="17" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">คริปโต</tspan></text><text x="366.0" y="168.0" font-size="14" fill="#e5ecf6" text-
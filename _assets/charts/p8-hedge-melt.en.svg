<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The hedge &#x27;melts&#x27;: a put&#x27;s delta from −0.30 to −0.20</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Index 5,000, put strike 4,885. Dealers are short 10,000 puts and short futures to hedge.</tspan></text><text x="48.0" y="136.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Start: 20 days, IV 20%</tspan></text><text x="48.0" y="158.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">put delta -0.30</tspan></text><rect x="400.0" y="120.0" width="361.7" height="34.0" rx="5" fill="#ef4444" fill-opacity="0.75"/><text x="771.7" y="143.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="771.7" dy="0.0">short 3,014 futures</tspan></text><text x="48.0" y="214.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Charm only: 8 days left, IV 20%</tspan></text><text x="48.0" y="236.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">put delta -0.21</tspan></text><rect x="400.0" y="198.0" width="254.0" height="34.0" rx="5" fill="#ef4444" fill-opacity="0.75"/><text x="664.0" y="221.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="664.0" dy="0.0">short 2,117 futures</tspan></text><text x="880.0" y="221.0" font-size="14" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="880.0" dy="0.0">buy back 897</tspan></text><text x="48.0" y="292.0" font-size="14" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Vanna only: 20 days, IV falls to 12%</tspan></text><text x="48.0" y="314.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">put delta -0.20</tspan></text><rect x="400.0" y="276.0" width="239.8" height="34.0" rx="5" fill="#ef4444" fill-opacity="0.75"/><text x="649.8" y="299.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="649.8" dy="0.0">short 1,998 futures</tspan></text><text x="880.0" y="299.0" font-size="14" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="880.0" dy="0.0">buy back 1,016</tspan></text><text x="48.0" y="370.0" font-size="14" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Both: 15 days left, IV 14%</tspan></text><text x="48.0" y="392.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">put delta -0.20</tspan></text><rect x="400.0" y="354.0" width="242.5" height="34.0" rx="5" fill="#ef4444" fill-opacity="0.75"/><text x="652.5" y="377.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="652.5" dy="0.0">short 2,021 futures</tspan></text><text x="880.0" y="377.0" font-size="14" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="880.0" dy="0.0">buy back 993</tspan></text><rect x="28.0" y="420.0" width="904.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="448.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">No one decided to buy: the hedge shrank because time passed (charm) or fear faded (vanna).</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ความสัมพันธ์ระหว่างตลาด (ทั่วไป ไม่ตายตัว)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ความสัมพันธ์เปลี่ยนตามสภาวะ โดยเฉพาะเงินเฟ้อ ตรวจสอบเสมอ อย่าสมมติเอา</tspan></text><rect x="28.0" y="92.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="120.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ดอลลาร์สหรัฐแข็งค่า</tspan></text><text x="48.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ สินค้าโภคภัณฑ์มักอ่อน (ราคาเป็น $)</tspan><tspan x="48.0" dy="17.6">→ กดดันตลาดเกิดใหม่ รวมถึงไทย</tspan></text><rect x="488.0" y="92.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="120.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="508.0" y="122.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">ผลตอบแทนพันธบัตรแท้จริงสูงขึ้น</tspan></text><text x="508.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ มูลค่าหุ้นลดลง โดยเฉพาะหุ้นเติบโต</tspan><tspan x="508.0" dy="17.6">→ ดอลลาร์มักแข็งขึ้น</tspan></text><rect x="28.0" y="224.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="224.0" width="5.0" height="120.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="254.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">น้ำมัน / โภคภัณฑ์ขึ้น</tspan></text><text x="48.0" y="282.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ คาดการณ์เงินเฟ้อขึ้น → ผลตอบแทนขึ้น</tspan><tspan x="48.0" dy="17.6">→ หนุนหุ้นพลังงาน กระทบผู้นำเข้า</tspan></text><rect x="488.0" y="224.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="224.0" width="5.0" height="120.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="508.0" y="254.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">ทองคำ</tspan></text><text x="508.0" y="282.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ มักขึ้นเมื่อผลตอบแทนแท้จริงและ $ ลดลง</tspan><tspan x="508.0" dy="17.6">→ เครื่องป้องกันความกลัว / ค่าเงินเสื่อม</tspan></text><rect x="28.0" y="356.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="356.0" width="5.0" height="120.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="386.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">หุ้น vs พันธบัตร</tspan></text><text x="48.0" y="414.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ เงินเฟ้อต่ำ: มักเคลื่อนสวนกัน (พันธบัตรป้องกัน)</tspan><tspan x="48.0" dy="17.6">→ เงินเฟ้อสูง: ลงพร้อมกันได้ (เช่น ปี 2022)</tspan></text><rect x="488.0" y="356.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="356.0" width="5.0" height="120.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="508.0" y="386.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">ภาวะหนีความเสี่ยง</tspan></text><text x="508.0" y="414.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ หุ้น ตลาดเกิดใหม่ คริปโต ลง $ เยน พันธบัตรสหรัฐฯ</tspan><tspan x="508.0" dy="17.6">   มักมีแรงซื้อ (หนีไปหาที่ปลอดภัย)</tspan></text></svg>
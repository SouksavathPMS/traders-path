<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="370" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ก่อนซื้อ REIT: หกคำถาม</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">อัตราจ่ายผลตอบแทนสูงไม่มีความหมาย ถ้าค่าเช่าเบื้องหลังกำลังหดตัว</tspan></text><rect x="28.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">อัตราการเช่า</tspan></text><text x="48.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">เช่าไปกี่ % ของพื้นที่?</tspan><tspan x="48.0" dy="18.9">ลดลง = สัญญาณเตือน</tspan></text><rect x="332.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="352.0" y="126.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">อายุสัญญาเช่า</tspan></text><text x="352.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">สัญญาใหญ่หมดเมื่อไร?</tspan><tspan x="352.0" dy="18.9">สิทธิการเช่าที่ดินหมดเมื่อไร?</tspan></text><rect x="636.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="656.0" y="126.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">หนี้ (Gearing)</tspan></text><text x="656.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">หนี้ ÷ สินทรัพย์ หนี้สูง</tspan><tspan x="656.0" dy="18.9">เจ็บเมื่อดอกเบี้ยขึ้น</tspan></text><rect x="28.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="260.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ผลตอบแทน vs พันธบัตร</tspan></text><text x="48.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ผลตอบแทนส่วนเกินเหนือ</tspan><tspan x="48.0" dy="18.9">พันธบัตรรัฐบาลคือค่าความเสี่ยง</tspan></text><rect x="332.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="352.0" y="260.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">ราคา vs NAV</tspan></text><text x="352.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">ราคาต่ำกว่ามูลค่าทรัพย์สินสุทธิ</tspan><tspan x="352.0" dy="18.9">= ส่วนลด สูงกว่า = ส่วนเกิน</tspan></text><rect x="636.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="656.0" y="260.0" font-size="17" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">ผู้สนับสนุน &amp; ค่าธรรมเนียม</tspan></text><text x="656.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">ใครบริหาร และค่าธรรมเนียม</tspan><tspan x="656.0" dy="18.9">ไปที่ใคร?</tspan></text></svg>
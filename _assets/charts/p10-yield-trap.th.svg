<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ปันผลสูงอาจเป็นสัญญาณเตือน และภาษีหักส่วนหนึ่ง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">อัตราปันผล = ปันผลต่อปี ÷ ราคา มันสูงขึ้นเมื่อราคาลง ก่อนที่จะประกาศลดปันผล</tspan></text><rect x="28.0" y="92.0" width="440.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="124.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ปันผล 4.00 เท่าเดิม ราคาลดลง</tspan></text><rect x="48.0" y="150.0" width="260.0" height="52.0" rx="6" fill="#3b82f6" fill-opacity="0.35"/><text x="60.0" y="182.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ราคา 100</tspan></text><text x="330.0" y="182.0" font-size="22" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">4%</tspan></text><rect x="48.0" y="230.0" width="208.0" height="52.0" rx="6" fill="#3b82f6" fill-opacity="0.44999999999999996"/><text x="60.0" y="262.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ราคา 80</tspan></text><text x="330.0" y="262.0" font-size="22" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">5%</tspan></text><rect x="48.0" y="310.0" width="130.0" height="52.0" rx="6" fill="#3b82f6" fill-opacity="0.55"/><text x="60.0" y="342.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ราคา 50</tspan></text><text x="330.0" y="342.0" font-size="22" fill="#ef4444" text-anchor="start" fo
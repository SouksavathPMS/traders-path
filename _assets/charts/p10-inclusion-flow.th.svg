<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">การเข้าดัชนี: กระแสเงินที่ถูกบังคับและมีกำหนดการ (ภาพประกอบ)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">กองทุนดัชนีถือราว 15% ของแต่ละสมาชิก บริษัทมูลค่า 10 พันล้านดอลลาร์เข้าดัชนีตอนปิดวันที่ 10</tspan></text><line x1="90.0" y1="350.0" x2="650.0" y2="350.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><line x1="90.0" y1="302.0" x2="650.0" y2="302.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><line x1="90.0" y1="254.0" x2="650.0" y2="254.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><line x1="90.0" y1="206.0" x2="650.0" y2="206.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><line x1="90.0" y1="158.0" x2="650.0" y2="158.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><line x1="90.0" y1="110.0" x2="650.0" y2="110.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><polyline points="90.0,302.0 130.0,298.4 170.0,230.0 210.0,220.4 250.0,215.6 290.0,206.0 330.0,198.8 370.0,188.0 410.0,177.2 450.0,164.0 490.0,146.0 530.0,179.6 570.0,190.4 610.0,195.2 650.0,200.0" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170.0" cy="230.0" r="6" fill="#22c55e"/><text x="170.0" y="214.0" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ประกาศ: +6%</tspan></text><circle cx="490.0" cy="146.0" r="6" fill="#f59e0b"/><text x="490.0" y="114.0" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">ปิดวันเข้าดัชนี:</tspan><tspan x="490.0" dy="16.2">แรงซื้อบังคับสูงสุด</tspan></text><circle cx="610.0" cy="195.2" r="6" fill="#ef4444"/><text x="610.0" y="223.2" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">คืนกำไรหลังจากนั้น</tspan></text><text x="90.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="90.0" dy="0.0">วันที่ 0</tspan></text><text x="290.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="290.0" dy="0.0">วันที่ 5</tspan></text><text x="490.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0.0">วันที่ 10</tspan></text><text x="650.0" y="372.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="650.0" dy="0.0">วันที่ 14</tspan></text><text x="690.0" y="140.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="690.0" dy="0.0">มูลค่าบริษัท</tspan></text><text x="690.0" y="164.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="690.0" dy="0.0">10 bn USD</tspan></text><text x="690.0" y="200.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="690.0" dy="0.0">กองทุนดัชนีต้องถือ</tspan></text><text x="690.0" y="224.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="690.0" dy="0.0">15% = 1.5 bn</tspan></text><text x="690.0" y="260.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="690.0" dy="0.0">วอลุ่มปกติต่อวัน</tspan></text><text x="690.0" y="284.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="690.0" dy="0.0">200 m USD</tspan></text><text x="690.0" y="320.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="690.0" dy="0.0">แรงซื้อบังคับ =</tspan></text><text x="690.0" y="344.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="690.0" dy="0.0">วอลุ่ม 7.5 วัน</tspan></text></svg>
size="12" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="560.0" dy="0.0">Max opportunity: everyone wants out</tspan></text><text x="60.0" y="528.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">Your own P&amp;L goes through the same cycle on every trade. The feeling is data about you, not about the market.</tspan></text></svg>
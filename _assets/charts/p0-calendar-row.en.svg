<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How to read an economic calendar</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">The market moves on the SURPRISE: actual vs forecast — not on whether the number is &#x27;good&#x27;.</tspan></text><rect x="28.0" y="100.0" width="904.0" height="40.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">Time (UTC+7)</tspan></text><text x="170.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="170.0" dy="0.0">Cur.</tspan></text><text x="240.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="240.0" dy="0.0">Impact</tspan></text><text x="330.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">Event</tspan></text><text x="620.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">Actual</tspan></text><text x="730.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="730.0" dy="0.0">Forecast</tspan></text><text x="840.0" y="126.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="840.0" dy="0.0">Previous</tspan></text><rect x="28.0" y="148.0" width="904.0" height="44.0" rx="8" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="176.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="40.0" dy="0.0">19:30</tspan></text><text x="170.0" y="176.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="170.0" dy="0.0">USD</tspan></text><rect x="240.0" y="163.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="256.0" y="163.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="272.0" y="163.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="330.0" y="176.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">Non-Farm Payrolls</tspan></text><text x="620.0" y="176.0" font-size="14" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">+275K</tspan></text><text x="730.0" y="176.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="730.0" dy="0.0">+200K</tspan></text><text x="840.0" y="176.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="840.0" dy="0.0">+229K</tspan></text><rect x="28.0" y="200.0" width="904.0" height="44.0" rx="8" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="40.0" dy="0.0">19:30</tspan></text><text x="170.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="170.0" dy="0.0">USD</tspan></text><rect x="240.0" y="215.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="256.0" y="215.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="272.0" y="215.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="330.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">CPI y/y (inflation)</tspan></text><text x="620.0" y="228.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">3.1%</tspan></text><text x="730.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="730.0" dy="0.0">3.3%</tspan></text><text x="840.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="840.0" dy="0.0">3.4%</tspan></text><rect x="28.0" y="252.0" width="904.0" height="44.0" rx="8" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="40.0" dy="0.0">14:00</tspan></text><text x="170.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="170.0" dy="0.0">GBP</tspan></text><rect x="240.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="256.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="272.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#23314f" fill-opacity="1"/><text x="330.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">GDP m/m</tspan></text><text x="620.0" y="280.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">0.2%</tspan></text><text x="730.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="730.0" dy="0.0">0.2%</tspan></text><text x="840.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="840.0" dy="0.0">-0.1%</tspan></text><text x="40.0" y="330.0" font-size="13" fill="#22c55e" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Row 1: jobs beat forecast by 75K → strong economy → rates may stay high → USD up, gold &amp; stocks often down.</tspan></text><text x="40.0" y="356.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Row 2: inflation BELOW forecast → rate cuts more likely → USD down, gold &amp; stocks often up.</tspan></text><text x="40.0" y="382.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Row 3: in line with forecast → little reaction. Three red bars = can move markets hard; plan around them.</tspan></text></svg>
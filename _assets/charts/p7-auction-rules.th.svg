<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">การประมูลทำงานอย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ราคาเป็นตัวโฆษณา เวลาเป็นตัวควบคุม วอลุ่มเป็นตัวยืนยัน</tspan></text><rect x="28.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="19" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ราคาโฆษณา</tspan></text><text x="48.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ราคาขยับเพื่อดึงอีกฝั่งเข้ามา</tspan><tspan x="48.0" dy="18.9">ขึ้น = หาผู้ขาย</tspan><tspan x="48.0" dy="18.9">ลง = หาผู้ซื้อ</tspan></text><rect x="336.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="356.0" y="122.0" font-size="19" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="356.0" dy="0.0">เวลาควบคุม</tspan></text><text x="356.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="356.0" dy="0.0">ราคาอยู่ที่ระดับไหนนาน</tspan><tspan x="356.0" dy="18.9">ยิ่งถูกยอมรับว่ายุติธรรม</tspan><tspan x="356.0" dy="18.9">ถูกปฏิเสธเร็ว =</tspan><tspan x="356.0" dy="18.9">ราคาไม่ยุติธรรม</tspan></text><rect x="644.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="664.0" y="122.0" font-size="19" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="664.0" dy="0.0">วอลุ่มยืนยัน</tspan></text><text x="664.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="664.0" dy="0.0">วอลุ่มสูงที่ราคาไหน =</tspan><tspan x="664.0" dy="18.9">ยอมรับ (มูลค่า)</tspan><tspan x="664.0" dy="18.9">วอลุ่มต่ำ = ปฏิเสธ</tspan><tspan x="664.0" dy="18.9">(ราคาวิ่งผ่านเร็ว)</tspan></text><rect x="28.0" y="300.0" width="904.0" height="68.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="300.0" width="5.0" height="68.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="48.0" y="328.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">การตอบสนอง (Responsive)</tspan></text><text x="48.0" y="352.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ซื้อใต้มูลค่า / ขายเหนือมูลค่า คาดว่าจะหมุนกลับหามูลค่า → สมดุล</tspan></text><rect x="28.0" y="380.0" width="904.0" height="68.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="380.0" width="5.0" height="68.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="48.0" y="408.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">การริเริ่ม (Initiative)</tspan></text><text x="48.0" y="432.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ซื้อเหนือมูลค่า / ขายใต้มูลค่า คาดว่าจะวิ่งต่อออกจากมูลค่า → ไม่สมดุล</tspan></text></svg>
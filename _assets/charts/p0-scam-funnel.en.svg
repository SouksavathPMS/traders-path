<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How a &#x27;pig-butchering&#x27; scam works</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">It takes weeks. Every step is designed to build trust before the money disappears.</tspan></text><rect x="28.0" y="96.0" width="904.0" height="54.0" rx="10" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/><text x="46.0" y="129.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">1 · Contact</tspan></text><text x="278.0" y="118.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="278.0" dy="0.0">&#x27;Wrong number&#x27; message, dating app,</tspan><tspan x="278.0" dy="17.6">LINE / Facebook friend request</tspan></text><rect x="58.0" y="160.0" width="844.0" height="54.0" rx="10" fill="#14b8a6" fill-opacity="0.14" stroke="#14b8a6" stroke-width="1.5"/><text x="76.0" y="193.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="76.0" dy="0.0">2 · Friendship</tspan></text><text x="308.0" y="182.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="308.0" dy="0.0">Daily chats for weeks. Photos of a</tspan><tspan x="308.0" dy="17.6">successful life. No money talk yet.</tspan></text><rect x="88.0" y="224.0" width="784.0" height="54.0" rx="10" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-width="1.5"/><text x="106.0" y="257.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="106.0" dy="0.0">3 · The &#x27;opportunity&#x27;</tspan></text><text x="338.0" y="246.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="338.0" dy="0.0">&#x27;My uncle has inside info…&#x27; Points you</tspan><tspan x="338.0" dy="17.6">to a trading app or website</tspan></text><rect x="118.0" y="288.0" width="724.0" height="54.0" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="321.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="136.0" dy="0.0">4 · Small win</tspan></text><text x="368.0" y="310.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="368.0" dy="0.0">Deposit a little, withdraw a little.</tspan><tspan x="368.0" dy="17.6">It works! Trust grows.</tspan></text><rect x="148.0" y="352.0" width="664.0" height="54.0" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><text x="166.0" y="385.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="166.0" dy="0.0">5 · Go big</tspan></text><text x="398.0" y="374.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="398.0" dy="0.0">Screen shows huge &#x27;profits&#x27;. Pressure</tspan><tspan x="398.0" dy="17.6">to deposit savings, borrow money</tspan></text><rect x="178.0" y="416.0" width="604.0" height="54.0" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><text x="196.0" y="449.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="196.0" dy="0.0">6 · The trap</tspan></text><text x="428.0" y="438.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="428.0" dy="0.0">Withdrawal &#x27;needs a tax / fee first&#x27;.</tspan><tspan x="428.0" dy="17.6">Pay it → another fee → contact vanishes</tspan></text><text x="480.0" y="488.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">The &#x27;profit&#x27; was only a number on a screen the scammers control. There was never any trading.</tspan></text></svg>
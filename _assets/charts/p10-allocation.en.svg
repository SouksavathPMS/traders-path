<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Stock/bond mixes: return vs risk</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Assumed long-run: stocks 7% return / 16% vol, bonds 3% / 6%, correlation 0.1. Illustrative, not a forecast.</tspan></text><rect x="28.0" y="90.0" width="620.0" height="390.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="90.0" y1="120.0" x2="90.0" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="90.0" y="440.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="90.0" dy="0.0">4%</tspan></text><line x1="238.6" y1="120.0" x2="238.6" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="238.6" y="440.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="238.6" dy="0.0">8%</tspan></text><line x1="387.1" y1="120.0" x2="387.1" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="387.1" y="440.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="387.1" dy="0.0">12%</tspan></text><line x1="535.7" y1="120.0" x2="535.7" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="535.7" y="440.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="535.7" dy="0.0">16%</tspan></text><line x1="90.0" y1="420.0" x2="610.0" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="84.0" y="424.0" font-size=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">What cutting winners early does to a good system</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Plan: 40% wins at +2.5R, losses −1R. Fear closes some winners at +0.3R instead (computed).</tspan></text><rect x="50.0" y="90.0" width="660.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="110.0" y1="362.0" x2="670.0" y2="362.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="100.0" y="366.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="100.0" dy="0.0">-0.4R</tspan></text><line x1="110.0" y1="306.0" x2="670.0" y2="306.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="100.0" y="310.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="100.0" dy="0.0">-0.2R</tspan></text><line x1="110.0" y1="250.0" x2="670.0" y2="250.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><text x="100.0" y="254.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="100.0" dy="0.0">+0.0R</tspan></text><line x1="110.0" y1="194.0" x2="670.0" y2="194.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="100.0" y="198.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="100.0" dy="0.0">+0.2R</tspan></text><line x1="110.0" y1="138.0" x2="670.0" y2="138.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="100.0" y="142.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="100.0" dy="0.0">+0.4R</tspan></text><polyline points="110.0,138.0 138.0,150.3 166.0,162.6 194.0,175.0 222.0,187.3 250.0,199.6 278.0,211.9 306.0,224.2 334.0,236.6 362.0,248.9 390.0,261.2 418.0,273.5 446.0,285.8 474.0,298.2 502.0,310.5 530.0,322.8 558.0,335.1 586.0,347.4 614.0,359.8 642.0,372.1 670.0,384.4" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="110.0" cy="138.0" r="6" fill="#22c55e"/><text x="120.0" y="128.0" font-size="13" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="120.0" dy="0.0">+0.40R</tspan></text><circle cx="250.0" cy="199.6" r="6" fill="#22c55e"/><text x="260.0" y="189.6" font-size="13" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="260.0" dy="0.0">+0.18R</tspan></text><circle cx="364.5" cy="250.0" r="6" fill="#e5ecf6"/><text x="354.5" y="238.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="354.5" dy="0.0">break-even (45%)</tspan></text><circle cx="390.0" cy="261.2" r="6" fill="#ef4444"/><text x="400.0" y="251.2" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="400.0" dy="0.0">-0.04R</tspan></text><circle cx="530.0" cy="322.8" r="6" fill="#ef4444"/><text x="540.0" y="312.8" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="540.0" dy="0.0">-0.26R</tspan></text><text x="110.0" y="412.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="110.0" dy="0.0">0%</tspan></text><text x="250.0" y="412.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="250.0" dy="0.0">25%</tspan></text><text x="390.0" y="412.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="390.0" dy="0.0">50%</tspan></text><text x="530.0" y="412.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="530.0" dy="0.0">75%</tspan></text><text x="670.0" y="412.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="670.0" dy="0.0">100%</tspan></text><text x="390.0" y="432.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="390.0" dy="0.0">share of winners closed early at +0.3R</tspan></text><rect x="740.0" y="90.0" width="190.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="740.0" y="90.0" width="5.0" height="350.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="760.0" y="120.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="760.0" dy="0.0">Read it</tspan></text><text x="760.0" y="148.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">No early exits:</tspan><tspan x="760.0" dy="18.9">+0.40R / trade</tspan><tspan x="760.0" dy="18.9"> </tspan><tspan x="760.0" dy="18.9">Cut 1 in 4:</tspan><tspan x="760.0" dy="18.9">+0.18R</tspan><tspan x="760.0" dy="18.9"> </tspan><tspan x="760.0" dy="18.9">Cut 45%:</tspan><tspan x="760.0" dy="18.9">zero edge</tspan><tspan x="760.0" dy="18.9"> </tspan><tspan x="760.0" dy="18.9">Cut half:</tspan><tspan x="760.0" dy="18.9">−0.04R</tspan><tspan x="760.0" dy="18.9">(a losing system)</tspan></text></svg>
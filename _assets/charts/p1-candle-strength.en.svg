<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Read the fight: body vs wick</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Big body = conviction. Long wick = rejection. Tiny body = indecision.</tspan></text><line x1="90.0" y1="128.0" x2="90.0" y2="332.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="70.0" y="130.0" width="40.0" height="200.0" rx="3" fill="#22c55e" fill-opacity="1"/><text x="90.0" y="368.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Marubozu</tspan></text><text x="90.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="90.0" dy="0.0">Total control</tspan><tspan x="90.0" dy="16.2">by buyers</tspan></text><line x1="220.0" y1="146.0" x2="220.0" y2="330.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="200.0" y="170.0" width="40.0" height="140.0" rx="3" fill="#22c55e" fill-opacity="1"/><text x="220.0" y="368.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Strong body</tspan></text><text x="220.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="220.0" dy="0.0">Buyers in</tspan><tspan x="220.0" dy="16.2">control</tspan></text><line x1="350.0" y1="150.0" x2="350.0" y2="310.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="330.0" y="222.0" width="40.0" height="24.0" rx="3" fill="#22c55e" fill-opacity="1"/><text x="350.0" y="368.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Spinning top</tspan></text><text x="350.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="350.0" dy="0.0">Both sides</tspan><tspan x="350.0" dy="16.2">fought, no winner</tspan></text><line x1="480.0" y1="150.0" x2="480.0" y2="310.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="460.0" y="229.0" width="40.0" height="3.0" rx="3" fill="#22c55e" fill-opacity="1"/><text x="480.0" y="368.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Doji</tspan></text><text x="480.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Perfect</tspan><tspan x="480.0" dy="16.2">indecision</tspan></text><line x1="610.0" y1="152.0" x2="610.0" y2="324.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="590.0" y="158.0" width="40.0" height="12.0" rx="3" fill="#22c55e" fill-opacity="1"/><text x="610.0" y="368.0" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Hammer / Pin bar</tspan></text><text x="610.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="610.0" dy="0.0">Sellers REJECTED</tspan><tspan x="610.0" dy="16.2">(bullish at lows)</tspan></text><line x1="740.0" y1="134.0" x2="740.0" y2="306.0" stroke="#ef4444" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><rect x="720.0" y="290.0" width="40.0" height="18.0" rx="3" fill="#ef4444" fill-opacity="1"/><text x="740.0" y="368.0" font-size="14" fill="#ec4899" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Shooting star</tspan></text><text x="740.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="740.0" dy="0.0">Buyers REJECTED</tspan><tspan x="740.0" dy="16.2">(bearish at highs)</tspan></text><line x1="87
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">กลโกง &#x27;เชือดหมู&#x27; (Pig-butchering) ทำงานอย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ใช้เวลาหลายสัปดาห์ ทุกขั้นถูกออกแบบให้สร้างความไว้ใจก่อนที่เงินจะหายไป</tspan></text><rect x="28.0" y="96.0" width="904.0" height="54.0" rx="10" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.5"/><text x="46.0" y="129.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">1 · ทัก</tspan></text><text x="278.0" y="118.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="278.0" dy="0.0">ข้อความ &#x27;ทักผิดคน&#x27; แอปหาคู่</tspan><tspan x="278.0" dy="17.6">ขอเป็นเพื่อนใน LINE / Facebook</tspan></text><rect x="58.0" y="160.0" width="844.0" height="54.0" rx="10" fill="#14b8a6" fill-opacity="0.14" stroke="#14b8a6" stroke-width="1.5"/><text x="76.0" y="193.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="76.0" dy="0.0">2 · สร้างสัมพันธ์</tspan></text><text x="308.0" y="182.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="308.0" dy="0.0">คุยทุกวันหลายสัปดาห์ รูปชีวิตที่ประสบ</tspan><tspan x="308.0" dy="17.6">ความสำเร็จ ยังไม่พูดเรื่องเงิน</tspan></text><rect x="88.0" y="224.0" width="784.0" height="54.0" rx="10" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-width="1.5"/><text x="106.0" y="257.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="106.0" dy="0.0">3 · &#x27;โอกาส&#x27;</tspan></text><text x="338.0" y="246.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="338.0" dy="0.0">&#x27;ลุงฉันมีข้อมูลวงใน…&#x27; ชี้ไปที่</tspan><tspan x="338.0" dy="17.6">แอปหรือเว็บเทรด</tspan></text><rect x="118.0" y="288.0" width="724.0" height="54.0" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="321.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="136.0" dy="0.0">4 · ชนะเล็กน้อย</tspan></text><text x="368.0" y="310.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="368.0" dy="0.0">ฝากนิดหน่อย ถอนได้นิดหน่อย</tspan><tspan x="368.0" dy="17.6">ได้จริง! ความไว้ใจเพิ่ม</tspan></text><rect x="148.0" y="352.0" width="664.0" height="54.0" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><text x="166.0" y="385.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="166.0" dy="0.0">5 · ลงหนัก</tspan></text><text x="398.0" y="374.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="398.0" dy="0.0">หน้าจอโชว์ &#x27;กำไร&#x27; มหาศาล กดดัน</tspan><tspan x="398.0" dy="17.6">ให้ฝากเงินเก็บ กู้เงินมาเพิ่ม</tspan></text><rect x="178.0" y="416.0" width="604.0" height="54.0" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><text x="196.0" y="449.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="196.0" dy="0.0">6 · กับดัก</tspan></text><text x="428.0" y="438.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="428.0" dy="0.0">ถอนเงิน &#x27;ต้องจ่ายภาษี / ค่าธรรมเนียมก่อน&#x27;</tspan><tspan x="428.0" dy="17.6">จ่าย → มีค่าอื่นอีก → ติดต่อไม่ได้</tspan></text><text x="480.0" y="488.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">&#x27;กำไร&#x27; เป็นแค่ตัวเลขบนหน้าจอที่มิจฉาชีพควบคุม ไม่เคยมีการเทรดจริงเลย</tspan></text></svg>
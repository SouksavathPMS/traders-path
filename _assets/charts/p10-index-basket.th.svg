<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">กองทุนเดียว ได้ทั้งตลาด</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">กองทุนดัชนีลอกรายชื่อบริษัทตามดัชนี แทนที่จะพยายามเลือกหุ้นผู้ชนะ</tspan></text><rect x="28.0" y="96.0" width="430.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">เลือกหุ้นเอง</tspan></text><rect x="60.0" y="150.0" width="60.0" height="60.0" rx="8" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" stroke-width="1.5"/><text x="90.0" y="188.0" font-size="20" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">A</tspan></text><rect x="136.0" y="150.0" width="60.0" height="60.0" rx="8" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5"/><text x="166.0" y="188.0" font-size="20" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">B</tspan></text><rect x="212.0" y="150.0" width="60.0" height="60.0" rx="8" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" stroke-width="1.5"/><text x="242.0" y="188.0" font-size="20" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="242.0" dy="0.0">C</tspan></text><rect x="288.0" y="150.0" width="60.0" height="60.0" rx="8" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5"/><text x="318.0" y="188.0" font-size="20" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="318.0" dy="0.0">D</tspan></text><rect x="364.0" y="150.0" width="60.0" height="60.0"
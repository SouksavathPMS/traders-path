<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="aef4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The count validator: check the rules with numbers</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Example: 0 = 100, 1 = 110, 2 = 103.8, 3 = 120, 4 = 108.5 (instead of 113.8).</tspan></text><rect x="40.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="140.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Rule 1</tspan></text><text x="140.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="140.0" dy="0.0">wave 2 low &gt; wave 1 start?</tspan></text><text x="140.0" y="206.0" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="140.0" dy="0.0">103.8 &gt; 100 ✓</tspan></text><line x1="242.0" y1="170.0" x2="268.0" y2="170.0" stroke="#22c55e" stroke-width="2" marker-end="url(#a22c55e)"/><rect x="270.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="370.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Rule 2</tspan></text><text x="370.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="370.0" dy="0.0">wave 3 not the shortest?</tspan></text><text x="370.0" y="206.0" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="370.0" dy="0.0">16.2 &gt; 10 ✓</tspan></text><line x1="472.0" y1="170.0" x2="498.0" y2="170.0" stroke="#22c55e" stroke-width="2" marker-end="url(#a22c55e)"/><rect x="500.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="600.0" y="140.0" font-size="17" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Rule 3</tspan></text><text x="600.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="600.0" dy="0.0">wave 4 low &gt; wave 1 high?</tspan></text><text x="600.0" y="206.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="600.0" dy="0.0">108.5 &lt; 110 ✗</tspan></text><rect x="730.0" y="110.0" width="202.0" height="120.0" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/><text x="831.0" y="145.0" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="831.0" dy="0.0">Count INVALID</tspan></text><text x="831.0" y="172.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="831.0" dy="0.0">Exit / don&#x27;t enter.</tspan><tspan x="831.0" dy="16.2">Then relabel:</tspan></text><line x1="700.0" y1="170.0" x2="726.0" y2="170.0" stroke="#ef4444" stroke-width="2" marker-end="url(#aef4444)"/><rect x="40.0" y="260.0" width="892.0" height="210.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="60.0" y="292.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Alternatives once rule 3 fails</tspan></text><text x="60.0" y="330.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">A · 103.8 → 120 was only sub-wave (i) of a larger wave 3; 108.5 is (ii). Needs: 108.5 holds above 103.8.</tspan></text><text x="60.0" y="370.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">B · The whole rise 100 → 120 is a correction (A-B-C) in a downtrend. Needs: lower lows to follow.</tspan></text><text x="60.0" y="410.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">C · A leading diagonal (wedge) where overlap is allowed. Rare; needs a wedge shape.</tspan></text><text x="60.0" y="450.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">A long from &#x27;wave 4&#x27; at 113.8 with the rule-3 stop at 109.6 was stopped out for −1R before 108.5 printed.</tspan></text></svg>
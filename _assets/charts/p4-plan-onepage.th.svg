<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">แผนการเทรดหนึ่งหน้า</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ถ้าใส่ในหน้าเดียวไม่ได้ คุณจะไม่ทำตามมันในตอนที่สำคัญ</tspan></text><rect x="28.0" y="92.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="102.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="50.0" y="122.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">1 · ทำไม &amp; เป้าหมาย</tspan></text><text x="50.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">เป้าหมายด้านกระบวนการ ไม่ใช่เงิน</tspan><tspan x="50.0" dy="18.9">&quot;ทำตามแผน 95% ของเทรด&quot;</tspan></text><rect x="488.0" y="92.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="102.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="510.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">2 · ตลาด &amp; ไทม์เฟรม</tspan></text><text x="510.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">เช่น 3 ตลาด · รายวัน / 4H / 1H</tspan><tspan x="510.0" dy="18.9">ช่วงเวลาที่ว่างเทรด</tspan></text><rect x="28.0" y="206.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="206.0" width="5.0" height="102.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="50.0" y="236.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">3 · เซ็ตอัพ (เฉพาะ A+)</tspan></text><text x="50.0" y="264.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">1–2 เซ็ตอัพพร้อมภาพตัวอย่าง:</tspan><tspan x="50.0" dy="18.9">หน้าตาเป็นอย่างไร ต้องมีอะไร</tspan></text><rect x="488.0" y="206.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="206.0" width="5.0" height="102.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="510.0" y="236.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">4 · กฎการเข้า</tspan></text><text x="510.0" y="264.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">เช็กลิสต์จากเฟส 2:</tspan><tspan x="510.0" dy="18.9">ทิศทาง HTF · โซน · CHoCH บน LTF · R:R ≥ 2</tspan></text><rect x="28.0" y="320.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="320.0" width="5.0" height="102.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="50.0" y="350.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">5 · กฎความเสี่ยง</tspan></text><text x="50.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">เสี่ยง 0.5–1% · เปิดรวมไม่เกิน 3R</tspan><tspan x="50.0" dy="18.9">รายวัน −2R · รายสัปดาห์ −5R</tspan></text><rect x="488.0" y="320.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="320.0" width="5.0" height="102.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="510.0" y="350.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">6 · กฎการออก</tspan></text><text x="510.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">Stop เลยโครงสร้าง + ระยะเผื่อ</tspan><tspan x="510.0" dy="18.9">วิธีทำกำไร A / B / C (3.5)</tspan></text><rect x="28.0" y="434.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="434.0" width="5.0" height="102.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="50.0" y="464.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">7 · กิจวัตร</tspan></text><text x="50.0" y="492.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">ก่อน · ระหว่าง · หลัง (4.4)</tspan><tspan x="50.0" dy="18.9">บันทึกทุกเทรด (4.5)</tspan></text><rect x="488.0" y="434.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="434.0" width="5.0" height="102.0" rx="2" fill="#8ea0bd" fill-opacity="1"/><text x="510.0" y="464.0" font-size="16" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">8 · เบรกเกอร์ตัดไฟ</tspan></text><text x="510.0" y="492.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">−5% → ลดครึ่ง · −10% → หยุดและทบทวน</tspan><tspan x="510.0" dy="18.9">สัญญาณ Tilt → ลุกออกไป (4.6)</tspan></text></svg>
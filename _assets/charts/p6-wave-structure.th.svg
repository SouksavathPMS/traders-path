<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Elliott Wave: ห้าคลื่นตามเทรนด์ สามคลื่นสวนเทรนด์</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">คลื่นขับเคลื่อน (1, 3, 5) ดันไปข้างหน้า คลื่นปรับฐาน (2, 4) และ A-B-C พักตัว</tspan></text><rect x="28.0" y="90.0" width="904.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="70.0" y="120.0" width="415.4" height="320.0" rx="6" fill="#22c55e" fill-opacity="0.06"/><rect x="485.4" y="120.0" width="175.4" height="320.0" rx="6" fill="#ef4444" fill-opacity="0.06"/><text x="277.7" y="138.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="277.7" dy="0.0">แรงส่ง (5 คลื่น)</tspan></text><text x="573.1" y="138.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="573.1" dy="0.0">ปรับฐาน (3)</tspan></text><polyline points="70.0,391.0 162.3,294.5 217.7,354.2 346.9,197.9 402.3,257.6 485.4,161.0 545.4,217.2 586.9,186.3 660.8,242.3" fill="none" stroke="#e5ecf6" stroke-width="2.8" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="70.0" cy="391.0" r="4" fill="#8ea0bd"/><text x="70.0" y="415.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">0</tspan></text><circle cx="162.3" cy="294.5" r="4" fill="#22c55e"/><text x="162.3" y="282.5" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="162.3" dy="0.0">1</tspan></text><circle cx="217.7" cy="354.2" r="4" fill="#ef4444"/><text x="217.7" y="378.2" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="217.7" dy="0.0">2</tspan></text><circle cx="346.9" cy="197.9" r="4" fill="#22c55e"/><text x="346.9" y="185.9" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="346.9" dy="0.0">3</tspan></text><circle cx="402.3" cy="257.6" r="4" fill="#ef4444"/><text x="402.3" y="281.6" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="402.3" dy="0.0">4</tspan></text><circle cx="485.4" cy="161.0" r="4" fill="#22c55e"/><text x="485.4" y="149.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="485.4" dy="0.0">5</tspan></text><circle cx="545.4" cy="217.2" r="4" fill="#ef4444"/><text x="545.4" y="241.2" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="545.4" dy="0.0">A</tspan></text><circle cx="586.9" cy="186.3" r="4" fill="#ef4444"/><text x="586.9" y="174.3" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="586.9" dy="0.0">B</tspan></text><circle cx="660.8" cy="242.3" r="4" fill="#ef4444"/><text x="660.8" y="266.3" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="660.8" dy="0.0">C</tspan></text><text x="700.0" y="140.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">1</tspan></text><text x="760.0" y="140.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">ผู้ซื้อกลุ่มแรก ยังไม่ค่อยมีใครเชื่อ</tspan></text><text x="700.0" y="190.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">2</tspan></text><text x="760.0" y="190.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">ความสงสัยลึก มักย่อ 50–61.8%</tspan></text><text x="700.0" y="240.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">3</tspan></text><text x="760.0" y="240.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">ฝูงชนเข้าร่วม มักยาวที่สุด</tspan></text><text x="700.0" y="290.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">4</tspan></text><text x="760.0" y="290.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">พักตัว มักย่อ ~38.2%</tspan></text><text x="700.0" y="340.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">5</tspan></text><text x="760.0" y="340.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">ผู้ซื้อกลุ่มท้าย โมเมนตัมลดลง</tspan></text><text x="700.0" y="390.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">A-B-C</tspan></text><text x="760.0" y="390.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">การปรับฐานของทั้งขา</tspan></text></svg>
ext x="730.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="730.0" dy="0.0">3.3%</tspan></text><text x="840.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="840.0" dy="0.0">3.4%</tspan></text><rect x="28.0" y="252.0" width="904.0" height="44.0" rx="8" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="40.0" dy="0.0">14:00</tspan></text><text x="170.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="170.0" dy="0.0">GBP</tspan></text><rect x="240.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="256.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#ef4444" fill-opacity="1"/><rect x="272.0" y="267.0" width="12.0" height="14.0" rx="2" fill="#23314f" fill-opacity="1"/><text x="330.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="330.0" dy="0.0">GDP m/m</tspan></text><text x="620.0" y="280.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">0.2%</tspan></text><text x="730.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="730.0" dy="0.0">0.2%</tspan></text><text x="840.0" y="280.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="500"><tspan x="840.0" dy="0.0">-0.1%</tspan></text><text x="40.0" y="330.0" font-size="13" fill="#22c55e" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">แถว 1: การจ้างงานดีกว่าคาด 75K → เศรษฐกิจแข็ง → ดอกเบี้ยอาจสูงนาน → USD ขึ้น ทองและหุ้นมักลง</tspan></text><text x="40.0" y="356.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">แถว 2: เงินเฟ้อ ต่ำกว่า คาด → โอกาสลดดอกเบี้ยมากขึ้น → USD ลง ทองและหุ้นมักขึ้น</tspan></text><text x="40.0" y="382.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">แถว 3: ตรงตามคาด → ตลาดตอบสนองน้อย  สามแถบแดง = ขยับตลาดแรงได้ ต้องวางแผนรับมือ</tspan></text></svg>
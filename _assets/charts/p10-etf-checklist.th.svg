<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">การเลือกกองทุนดัชนี: ตรวจห้าข้อ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เทียบกองทุนที่ติดตามดัชนีแบบเดียวกัน กองที่ถูกที่สุดและบริหารดีมักชนะ</tspan></text><rect x="28.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · ดัชนีอะไร?</tspan></text><text x="48.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">โลก สหรัฐฯ ไทย พันธบัตร?</tspan><tspan x="48.0" dy="18.9">แกนหลักควรกว้าง ไม่แคบ</tspan></text><rect x="332.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="352.0" y="126.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">2 · ค่าใช้จ่ายต่อปี (TER)</tspan></text><text x="352.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">ยิ่งต่ำยิ่งดี เทียบในดัชนี</tspan><tspan x="352.0" dy="18.9">เดียวกัน</tspan></text><rect x="636.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="656.0" y="126.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">3 · ส่วนต่างการติดตาม</tspan></text><text x="656.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">ผลตอบแทนกองทุนลบผลตอบแทน</tspan><tspan x="656.0" dy="18.9">ดัชนี ดูหลายปี</tspan></text><rect x="28.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="286.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">4 · ขนาด &amp; การซื้อขาย</tspan></text><text x="48.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">กองใหญ่ที่ส่วนต่างราคา</tspan><tspan x="48.0" dy="18.9">ซื้อ–ขายแคบ เสียต้นทุนน้อยกว่า</tspan></text><rect x="332.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="352.0" y="286.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">5 · จดทะเบียนที่ไหน</tspan></text><text x="352.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">ประเทศของกองทุนเปลี่ยน</tspan><tspan x="352.0" dy="18.9">ภาษีปันผลและกฎมรดก</tspan></text><rect x="636.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="656.0" y="286.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">สะสม vs จ่ายปันผล</tspan></text><text x="656.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">สะสม: นำปันผลไปลงทุนต่อ</tspan><tspan x="656.0" dy="18.9">จ่าย: จ่ายปันผลให้คุณ</tspan><tspan x="656.0" dy="18.9">ดัชนีเดียวกัน ภาษีต่างกัน</tspan></text></svg>
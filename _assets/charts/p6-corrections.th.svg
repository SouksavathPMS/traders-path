<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">รูปแบบการปรับฐาน 3 แบบ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">การปรับฐานยุ่งเหยิงกว่าแรงส่ง การรู้รูปแบบช่วยให้คุณรอแทนการเดา</tspan></text><rect x="28.0" y="90.0" width="290.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="120.0" font-size="18" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">Zigzag  5-3-5</tspan></text><polyline points="58.0,158.9 150.0,234.4 196.0,196.7 288.0,291.1" fill="none" stroke="#e5ecf6" stroke-width="2.5" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="150.0" cy="234.4" r="4" fill="#ef4444"/><text x="150.0" y="258.4" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">A</tspan></text><circle cx="196.0" cy="196.7" r="4" fill="#ef4444"/><text x="196.0" y="184.7" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="196.0" dy="0.0">B</tspan></text><circle cx="288.0" cy="291.1" r="4" fill="#ef4444"/><text x="288.0" y="315.1" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="288.0" dy="0.0">C</tspan></text><text x="46.0" y="360.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">แหลมและลึก B ย่อน้อยกว่า</tspan><tspan x="46.0" dy="17.6">~61.8% ของ A</tspan><tspan x="46.0" dy="17.6">C ยาวประมาณ A</tspan></text><rect x="336.0" y="90.0" width="290.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"
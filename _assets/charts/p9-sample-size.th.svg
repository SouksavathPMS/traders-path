<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">กลุ่มตัวอย่างบอกอะไรได้แค่ไหน?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">คุณวัดอัตราชนะได้ 50% อัตราชนะจริงน่าจะอยู่ในช่วงนี้ (ความเชื่อมั่น 95%)</tspan></text><rect x="28.0" y="90.0" width="904.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="160.0" y1="120.0" x2="160.0" y2="410.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="160.0" y="430.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="160.0" dy="0.0">0%</tspan></text><line x1="335.0" y1="120.0" x2="335.0" y2="410.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="335.0" y="430.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="335.0" dy="0.0">25%</tspan></text><line x1="510.0" y1="120.0" x2="510.0" y2="410.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="510.0" y="430.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="510.0" dy="0.0">50%</tspan></text><line x1="685.0" y1="120.0" x2="685.0" y2="410.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="685.0" y="430.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="685.0" dy="0.0">75%</tspan></text><line x1="860.0" y1="120.0" x2="860.0" y2="410.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="860.0" y="430.0" font-size="12" fill="#8ea0bd" text-ancho
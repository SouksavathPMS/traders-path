600"><tspan x="666.0" dy="0.0">ขายได้อีกครั้ง</tspan></text><rect x="636.0" y="255.5" width="60.0" height="104.5" rx="4" fill="#22c55e" fill-opacity="0.6"/><text x="666.0" y="376.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="666.0" dy="0.0">110 กล่อง</tspan></text><text x="666.0" y="400.0" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="666.0" dy="0.0">กลับสู่มูลค่า = สมดุล</tspan></text><rect x="764.0" y="96.0" width="172.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="850.0" y="124.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">20:00</tspan></text><text x="850.0" y="166.0" font-size="26" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="850.0" dy="0.0">90 บาท</tspan></text><text x="850.0" y="194.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="850.0" dy="0.0">รถทัวร์มาถึง</tspan></text><rect x="820.0" y="217.5" width="60.0" height="142.5" rx="4" fill="#f59e0b" fill-opacity="0.6"/><text x="850.0" y="376.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="850.0" dy="0.0">150 กล่อง</tspan></text><text x="850.0" y="400.0" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">ข้อมูลใหม่ → มูลค่าใหม่</tspan><tspan x="850.0" dy="14.9">= ไม่สมดุล</tspan></text><text x="48.0" y="452.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ราคาประกาศ (ขึ้น/ลด) เวลากำกับ (ราคาอยู่ได้นานแค่ไหน) ปริมาณยืนยัน (จำนวนกล่องที่ขายได้)</tspan></text></svg>
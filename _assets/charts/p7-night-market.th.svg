<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">แผงตลาดนัดกลางคืนก็คือการประมูลทุกเย็น</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ข้าวเหนียวมะม่วง ราคาต่อกล่อง (บาท) ราคาขยับเพื่อหาผู้ซื้อ ปริมาณขายบอกว่าตกลงกันที่ไหน</tspan></text><rect x="28.0" y="96.0" width="172.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#8ea0bd" stroke-width="1.5"/><text x="114.0" y="124.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="114.0" dy="0.0">18:00</tspan></text><text x="114.0" y="166.0" font-size="26" fill="#8ea0bd" text-anchor="middle" font-weight="800"><tspan x="114.0" dy="0.0">60 บาท</tspan></text><text x="114.0" y="194.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="114.0" dy="0.0">คิวยาว</tspan></text><rect x="84.0" y="322.0" width="60.0" height="38.0" rx="4" fill="#8ea0bd" fill-opacity="0.6"/><text x="114.0" y="376.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="114.0" dy="0.0">40 กล่อง</tspan></text><text x="114.0" y="400.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="114.0" dy="0.0">ถูกไป → ขึ้นราคา</tspan></text><rect x="212.0" y="96.0" width="172.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="298.0" y="124.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="298.0" dy="0.0">18:30</tspan></text><text x="298.0" y="166.0" font-size="26" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="298.0" dy="0.0">70 บาท</tspan></text><tex
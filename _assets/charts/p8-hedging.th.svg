<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ทำไมดีลเลอร์ต้องซื้อขายสินทรัพย์อ้างอิง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">มาร์เก็ตเมกเกอร์ขาย Call ให้คุณ แล้วป้องกันความเสี่ยงให้ Delta เป็นกลาง การป้องกันนั้นขยับตลาด</tspan></text><rect x="28.0" y="96.0" width="219.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="190.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · คุณซื้อ 100 Call</tspan></text><text x="48.0" y="153.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Strike 5,100 ดัชนี 5,000</tspan><tspan x="48.0" dy="17.6">ดีลเลอร์ตอนนี้ Short</tspan><tspan x="48.0" dy="17.6">Call อยู่</tspan></text><line x1="249.0" y1="190.0" x2="257.0" y2="190.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="259.0" y="96.0" width="219.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="259.0" y="96.0" width="5.0" height="190.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="279.0" y="126.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="279.0" dy="0.0">2 · ดีลเลอร์ป้องกัน</tspan></text><text x="279.0" y="153.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="279.0" dy="0.0">Delta ของ Call ≈ 0.31</tspan><tspan x="279.0" dy="17.6">Short Call = Short 31 Delta</tspan><tspan x="279.0" dy="17.6">→ ดีลเลอร์ ซื้อ ≈ 31 หน่วย</tspan></text><line x1="480.0" y1="190.0" x2="488.0" y2="190.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="490.0" y="96.0" width="219.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="490.0" y="96.0" width="5.0" height="190.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="510.0" y="126.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">3 · ราคาขึ้นไป 5,050</tspan></text><text x="510.0" y="153.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">Delta เพิ่มเป็น ≈ 0.40 (Gamma)</tspan><tspan x="510.0" dy="17.6">ดีลเลอร์ต้อง ซื้อ เพิ่ม ≈ 10</tspan><tspan x="510.0" dy="17.6">หน่วย ตามการขึ้น</tspan></text><line x1="711.0" y1="190.0" x2="719.0" y2="190.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="721.0" y="96.0" width="219.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="721.0" y="96.0" width="5.0" height="190.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="741.0" y="126.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="741.0" dy="0.0">4 · ราคาร่วงกลับ</tspan></text><text x="741.0" y="153.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="741.0" dy="0.0">Delta หดลง</tspan><tspan x="741.0" dy="17.6">ดีลเลอร์ ขาย Hedge</tspan><tspan x="741.0" dy="17.6">ส่วนเกิน ตามการลง</tspan></text><rect x="28.0" y="304.0" width="904.0" height="146.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="336.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">แนวคิดสำคัญ</tspan></text><text x="48.0" y="366.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ดีลเลอร์ที่ SHORT Gamma (ขายออปชัน) ต้องซื้อตอนขึ้นและขายตอนลง → พวกเขา ขยาย การเคลื่อนไหว</tspan><tspan x="48.0" dy="18.9">ดีลเลอร์ที่ LONG Gamma (ซื้อออปชัน) ขายตอนขึ้นและซื้อตอนลง → พวกเขา ลดทอน การเคลื่อนไหว</tspan><tspan x="48.0" dy="18.9">เครื่องหมายของ Gamma ดีลเลอร์จึงบอกว่าตลาดมักวิ่งเป็นเทรนด์หรือถูกตรึง (8.4)</tspan></text></svg>
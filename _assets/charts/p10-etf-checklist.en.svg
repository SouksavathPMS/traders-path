<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Choosing an index fund: five checks</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Compare funds that track the same kind of index; the cheapest well-run one usually wins.</tspan></text><rect x="28.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · What index?</tspan></text><text x="48.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">World, US, Thai, bonds?</tspan><tspan x="48.0" dy="18.9">Broad beats narrow for a core.</tspan></text><rect x="332.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="352.0" y="126.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">2 · Yearly cost (TER)</tspan></text><text x="352.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">Lower is better. Compare</tspan><tspan x="352.0" dy="18.9">within the same index.</tspan></text><rect x="636.0" y="96.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="96.0" width="5.0" height="148.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="656.0" y="126.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">3 · Tracking difference</tspan></text><text x="656.0" y="154.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">Fund return minus index</tspan><tspan x="656.0" dy="18.9">return, over several years.</tspan></text><rect x="28.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="286.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">4 · Size &amp; trading</tspan></text><text x="48.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Big funds with tight</tspan><tspan x="48.0" dy="18.9">bid–ask spreads cost less.</tspan></text><rect x="332.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="352.0" y="286.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">5 · Where it&#x27;s based</tspan></text><text x="352.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">Fund country changes</tspan><tspan x="352.0" dy="18.9">dividend tax &amp; estate rules.</tspan></text><rect x="636.0" y="256.0" width="296.0" height="148.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="256.0" width="5.0" height="148.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="656.0" y="286.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">Accumulating vs distributing</tspan></text><text x="656.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">Acc: reinvests dividends.</tspan><tspan x="656.0" dy="18.9">Dist: pays them to you.</tspan><tspan x="656.0" dy="18.9">Same index, different tax.</tspan></text></svg>
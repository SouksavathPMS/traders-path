<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อารมณ์ 4 อย่างที่ขยับเมาส์ของคุณ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เรียกชื่อมัน สังเกตว่ามันอยากให้คุณทำอะไร แล้วทำตามแผนแทน</tspan></text><rect x="28.0" y="92.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="48.0" y="126.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">กลัว</tspan></text><text x="148.0" y="126.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="148.0" dy="0.0">&quot;ถ้ามันสวนทางล่ะ?&quot;</tspan></text><text x="48.0" y="158.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ทำให้คุณ:</tspan></text><text x="48.0" y="180.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ข้ามเซ็ตอัพที่ถูกต้อง · ปิดไม้กำไรเร็ว</tspan><tspan x="48.0" dy="18.9">· ย้าย Stop ไปเท่าทุนเร็วเกินไป</tspan></text><rect x="42.0" y="232.0" width="416.0" height="42.0" rx="8" fill="#ef4444" fill-opacity="0.12"/><text x="54.0" y="259.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="54.0" dy="0.0">→ เสี่ยงน้อยพอที่การแพ้จะน่าเบื่อ</tspan></text><rect x="488.0" y="92.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="508.0" y="126.0" font-size="20" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">โลภ</tspan></text><text x="608.0" y="126.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="608.0" dy="0.0">&quot;ไม้นี้อาจใหญ่มาก เพิ่มอีก&quot;</tspan></text><text x="508.0" y="158.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">ทำให้คุณ:</tspan></text><text x="508.0" y="180.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">ไม้ใหญ่เกิน · ไล่ราคา · ลบเป้าหมาย</tspan><tspan x="508.0" dy="18.9">· เทรดถี่เกินไป</tspan></text><rect x="502.0" y="232.0" width="416.0" height="42.0" rx="8" fill="#f59e0b" fill-opacity="0.12"/><text x="514.0" y="259.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">→ ความเสี่ยงต่อไม้คงที่ ตั้งเป้าก่อนเข้า</tspan></text><rect x="28.0" y="302.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="48.0" y="336.0" font-size="20" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">หวัง</tspan></text><text x="148.0" y="336.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="148.0" dy="0.0">&quot;เดี๋ยวมันก็กลับมา&quot;</tspan></text><text x="48.0" y="368.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ทำให้คุณ:</tspan></text><text x="48.0" y="390.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ถือไม้ขาดทุน · ขยาย Stop · ถัวเฉลี่ย</tspan><tspan x="48.0" dy="18.9">ขาลงในไม้ที่แพ้</tspan></text><rect x="42.0" y="442.0" width="416.0" height="42.0" rx="8" fill="#3b82f6" fill-opacity="0.12"/><text x="54.0" y="469.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="54.0" dy="0.0">→ ตั้ง Stop จริงทันทีที่เข้าเทรด</tspan></text><rect x="488.0" y="302.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="508.0" y="336.0" font-size="20" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">เสียดาย</tspan></text><text x="608.0" y="336.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="608.0" dy="0.0">&quot;รู้งี้…&quot;</tspan></text><text x="508.0" y="368.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">ทำให้คุณ:</tspan></text><text x="508.0" y="390.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">เทรดแก้แค้น · ไล่ราคาที่พลาดไป</tspan><tspan x="508.0" dy="18.9">· ผิดกฎเพื่อเอาคืน</tspan></text><rect x="502.0" y="442.0" width="416.0" height="42.0" rx="8" fill="#a855f7" fill-opacity="0.12"/><text x="514.0" y="469.0" font-size="14" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">→ เทรดที่พลาดเสีย 0R รอไม้ถัดไป</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ระบบที่ชนะเดียวกัน ความเสี่ยงต่างกัน: โอกาสเกิด Drawdown ลึก</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">โอกาสร่วงต่ำกว่าจุดสูงสุด 20% (และ 50%) ภายใน 200 ไม้ ชนะ 45% ได้ +2R จำลองอย่างละ 20,000 ครั้ง</tspan></text><line x1="70.0" y1="370.0" x2="906.0" y2="370.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><rect x="90.0" y="370.0" width="42.0" height="1.5" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="111.0" y="362.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="111.0" dy="0.0">0%</tspan></text><rect x="138.0" y="370.0" width="42.0" height="1.5" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="159.0" y="362.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">0%</tspan></text><text x="135.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">เสี่ยง 0.5%</tspan></text><rect x="226.0" y="368.5" width="42.0" height="1.5" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="247.0" y="360.5" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">&lt;1%</tspan></text><rect x="274.0" y="370.0" width="42.0" height="1.5" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="295.0" y="362.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">0%</tspan></text><text x="271.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">เส
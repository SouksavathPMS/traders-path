<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="aef4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">คุณให้ใครกู้? คุณภาพเครดิต</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ผลตอบแทนที่สูงกว่าคือค่าตอบแทนสำหรับความเสี่ยงที่จะไม่ได้เงินคืน อันดับเครดิตช่วยได้แต่ผิดได้</tspan></text><rect x="28.0" y="96.0" width="700.0" height="74.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="48.0" y="126.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">รัฐบาล (สกุลเงินของตัวเอง)</tspan></text><text x="48.0" y="152.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ความเสี่ยงผิดนัดต่ำสุด ความเสี่ยงหลักคือดอกเบี้ยและเงินเฟ้อ</tspan></text><rect x="650.1" y="116.0" width="55.7" height="25.0" rx="12.5" fill="#22c55e" fill-opacity="1"/><text x="678.0" y="135.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="678.0" dy="0.0">AAA–A</tspan></text><rect x="28.0" y="182.0" width="640.0" height="74.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="48.0" y="212.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">บริษัทระดับน่าลงทุน</tspan></text><text x="48.0" y="238.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">อันดับ BBB− ขึ้นไป ผลตอบแทนเพิ่มเล็กน้อย</tspan></text><rect x="586.4" y="202.0" width="63.2" height="25.0" rx="12.5" fill="#14b8a6" fill-opacity="1"/><text x="618.0" y="221.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="618.0" dy="0.0">≥ BBB−</tspan></text><rect x="28.0" y="268.0" width="580.0" height="74.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="48.0" y="298.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ผลตอบแทนสูง (&quot;Junk&quot;)</tspan></text><text x="48.0" y="324.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">อันดับต่ำกว่า BBB− ผิดนัดเพิ่มขึ้นในภาวะถดถอย</tspan></text><rect x="530.1" y="288.0" width="55.7" height="25.0" rx="12.5" fill="#f59e0b" fill-opacity="1"/><text x="558.0" y="307.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="558.0" dy="0.0">≤ BB+</tspan></text><rect x="28.0" y="354.0" width="520.0" height="74.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="48.0" y="384.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ไม่มีอันดับ / ไม่จดทะเบียน</tspan></text><text x="48.0" y="410.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ข้อมูลน้อย ขายยาก เสี่ยงขาดทุนสูง</tspan></text><rect x="483.0" y="374.0" width="30.0" height="25.0" rx="12.5" fill="#ef4444" fill-opacity="1"/><text x="498.0" y="393.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="498.0" dy="0.0">?</tspan></text><line x1="860.0" y1="420.0" x2="860.0" y2="110.0" stroke="#ef4444" stroke-width="3" marker-end="url(#aef4444)"/><text x="880.0" y="270.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="880.0" dy="0.0">ผลตอบแทน</tspan><tspan x="880.0" dy="17.6">มากขึ้น</tspan><tspan x="880.0" dy="17.6">เสี่ยง</tspan><tspan x="880.0" dy="17.6">มากขึ้น</tspan></text></svg>
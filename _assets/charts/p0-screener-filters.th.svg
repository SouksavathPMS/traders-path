<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="340" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ตัวกรองใน Screener สี่ประเภท</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เริ่มด้วยตัวกรองที่ปกป้องคุณ (ขนาด สภาพคล่อง) แล้วค่อยเพิ่มตัวกรองที่ตรงกับสไตล์ของคุณ</tspan></text><rect x="28.0" y="100.0" width="212.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="100.0" width="5.0" height="190.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · ความปลอดภัย</tspan></text><text x="48.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">มูลค่าตลาด</tspan><tspan x="48.0" dy="18.9">ปริมาณ/มูลค่าซื้อขายเฉลี่ย</tspan><tspan x="48.0" dy="18.9">ราคาขั้นต่ำ</tspan><tspan x="48.0" dy="18.9">ตลาด / ประเทศ</tspan></text><rect x="256.0" y="100.0" width="212.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="256.0" y="100.0" width="5.0" height="190.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="276.0" y="130.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="276.0" dy="0.0">2 · มูลค่า &amp; คุณภาพ</tspan></text><text x="276.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="276.0" dy="0.0">P/E, P/B</tspan><tspan x="276.0" dy="18.9">อัตราปันผล</tspan><tspan x="276.0" dy="18.9">หนี้สิน/ทุน</tspan><tspan x="276.0" dy="18.9">การเติบโตของกำไร  (ดู 10.6)</tspan></text><rect x="484.0" y="100.0" width="212.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="484.0" y="100.0" width="5.0" height="190.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="504.0" y="130.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="504.0" dy="0.0">3 · เทรนด์ &amp; โมเมนตัม</tspan></text><text x="504.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="504.0" dy="0.0">ราคาเทียบค่าเฉลี่ย 50/200 วัน</tspan><tspan x="504.0" dy="18.9">% ห่างจากจุดสูงสุด 52 สัปดาห์</tspan><tspan x="504.0" dy="18.9">RSI  (ดู 2.8)</tspan><tspan x="504.0" dy="18.9">ปริมาณซื้อขายเทียบปกติ</tspan></text><rect x="712.0" y="100.0" width="212.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="712.0" y="100.0" width="5.0" height="190.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="732.0" y="130.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="732.0" dy="0.0">4 · เหตุการณ์</tspan></text><text x="732.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="732.0" dy="0.0">ใกล้ประกาศงบ</tspan><tspan x="732.0" dy="18.9">ใกล้วันขึ้น XD</tspan><tspan x="732.0" dy="18.9">เปิดกระโดดขึ้น/ลงวันนี้</tspan><tspan x="732.0" dy="18.9">หุ้นเข้าใหม่</tspan></text><text x="40.0" y="320.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">เครื่องมือ: Screener ของ TradingView, finviz.com (สหรัฐฯ), แอปโบรกเกอร์ และ set.or.th (ไทย) ข้อมูลพื้นฐานอาจเก่าหลายวันหรือหลายสัปดาห์</tspan></text></svg>
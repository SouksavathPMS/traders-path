<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How rising rates and uninsured deposits broke SVB</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Bond maths (computed) and SVB&#x27;s reported balance sheet (Wikipedia, Collapse of Silicon Valley Bank).</tspan></text><rect x="30.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="30.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="50.0" y="130.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">1 · Deposits flood in (2020–21)</tspan></text><text x="50.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">Tech start-ups park cash at SVB.</tspan><tspan x="50.0" dy="17.6">~89% of deposits above the</tspan><tspan x="50.0" dy="17.6">250,000 USD insurance limit.</tspan></text><rect x="340.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="340.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="360.0" y="130.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">2 · Bought long bonds at low yields</tspan></text><text x="360.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="360.0" dy="0.0">A 10-year 1.5% bond is worth</tspan><tspan x="360.0" dy="17.6">79.72 when yields reach 4%</tspan><tspan x="360.0" dy="17.6">(−20%). Unrealised losses on</tspan><tspan x="360.0" dy="17.6">held-to-maturity bonds &gt; 15 bn USD.</tspan></text><rect x="650.0" y="100.0" width="290.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="650.0" y="100.0" width="5.0" height="250.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="670.0" y="130.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">3 · Forced to sell, run starts</tspan></text><text x="670.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">8 Mar: sells bonds at a 1.8 bn loss.</tspan><tspan x="670.0" dy="17.6">9 Mar: customers try to pull</tspan><tspan x="670.0" dy="17.6">42 bn USD in one day.</tspan><tspan x="670.0" dy="17.6">10 Mar: closed by regulators.</tspan></text><text x="40.0" y="392.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Deposit insurance limits: US FDIC 250,000 USD per depositor per bank; Thailand DPA 1,000,000 THB per depositor per bank (since 11 Aug 2021).</tspan></text><text x="40.0" y="414.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">On 12 March 2023 regulators guaranteed all SVB deposits anyway, using a systemic-risk exception: a rescue you can&#x27;t count on.</tspan></text></svg>
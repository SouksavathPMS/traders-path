<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="390" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">พันธบัตรคือเงินกู้ที่มีตารางเวลา</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ซื้อพันธบัตร 5 ปี ราคา 1,000 คูปอง 4%: ได้ปีละ 40 แล้วได้ 1,000 คืน</tspan></text><rect x="28.0" y="92.0" width="904.0" height="278.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="60.0" y1="250.0" x2="900.0" y2="250.0" stroke="#23314f" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><rect x="90.0" y="250.0" width="80.0" height="100.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="130.0" y="310.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">−1,000</tspan></text><text x="130.0" y="240.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">วันนี้: คุณให้กู้</tspan></text><rect x="230.0" y="226.0" width="80.0" height="24.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="270.0" y="218.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">+40</tspan></text><text x="270.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="270.0" dy="0.0">ปีที่ 1</tspan></text><rect x="370.0" y="226.0" width="80.0" height="24.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="410.0" y="218.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">+40</tspan></text><text x="410.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="410.0" dy="0.0">ปีที่ 2</tspan></text><rect x="510.0" y="226.0" width="80.0" height="24.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="550.0" y="218.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">+40</tspan></text><text x="550.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="550.0" dy="0.0">ปีที่ 3</tspan></text><rect x="650.0" y="226.0" width="80.0" height="24.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="690.0" y="218.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">+40</tspan></text><text x="690.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="690.0" dy="0.0">ปีที่ 4</tspan></text><rect x="790.0" y="226.0" width="80.0" height="24.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="830.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="830.0" dy="0.0">ปีที่ 5</tspan></text><rect x="790.0" y="126.0" width="80.0" height="100.0" rx="4" fill="#3b82f6" fill-opacity="0.8"/><text x="830.0" y="118.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">+40 +1,000</tspan></text><text x="250.0" y="130.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="250.0" dy="0.0">คูปอง = ดอกเบี้ยที่คุณได้รับ</tspan><tspan x="250.0" dy="20.2">มูลค่าที่ตราไว้ = เงินที่ได้คืนเมื่อครบกำหนด</tspan><tspan x="250.0" dy="20.2">ได้รับรวม: 5 × 40 + 1,000 = 1,200</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">วงจรทบทวน: วิธีที่นักเทรดพัฒนาได้จริง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เปลี่ยนทีละ หนึ่ง อย่าง แล้ววัดผลจากจำนวนเทรดที่มากพอ</tspan></text><line x1="380.2" y1="176.4" x2="428.8" y2="211.8" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><line x1="463.0" y1="309.5" x2="444.4" y2="366.7" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><line x1="362.0" y1="429.4" x2="302.0" y2="429.4" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><line x1="216.8" y1="370.5" x2="198.2" y2="313.3" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><line x1="228.0" y1="214.1" x2="276.6" y2="178.8" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><circle cx="330.0" cy="140.0" r="56" fill="#111a2e" stroke="#3b82f6" stroke-width="2.5"/><text x="330.0" y="138.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">วางแผน</tspan></text><text x="330.0" y="158.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="330.0" dy="0.0">เขียนกฎไว้</tspan></text><circle cx="482.2" cy="250.6" r="56" fill="#111a2e" stroke="#22c55e" stroke-width="2.5"/><text x="482.2" y="248.6" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="482.2" dy="0.0">เทรด</tspan></text><text x="482.2" y="268.6" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="482.2" dy="0.0">ทำตามกฎ</tspan></text><circle cx="424.0" cy="429.4" r="56" fill="#111a2e" stroke="#f59e0b" stroke-width="2.5"/><text x="424.0" y="427.4" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="424.0" dy="0.0">บันทึก</tspan></text><text x="424.0" y="447.4" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="424.0" dy="0.0">ทุกเทรด ติดแท็ก</tspan></text><circle cx="236.0" cy="429.4" r="56" fill="#111a2e" stroke="#a855f7" stroke-width="2.5"/><text x="236.0" y="427.4" font-size="15" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="236.0" dy="0.0">ทบทวน</tspan></text><text x="236.0" y="447.4" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="236.0" dy="0.0">รายสัปดาห์ &amp; เดือน</tspan></text><circle cx="177.8" cy="250.6" r="56" fill="#111a2e" stroke="#ec4899" stroke-width="2.5"/><text x="177.8" y="248.6" font-size="15" fill="#ec4899" text-anchor="middle" font-weight="700"><tspan x="177.8" dy="0.0">ปรับ</tspan></text><text x="177.8" y="268.6" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="177.8" dy="0.0">เปลี่ยน หนึ่ง อย่าง</tspan></text><rect x="600.0" y="100.0" width="332.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="600.0" y="100.0" width="5.0" height="190.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="620.0" y="130.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">ทบทวนรายสัปดาห์ (30 นาที)</tspan></text><text x="620.0" y="159.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="620.0" dy="0.0">· R รวม %ชนะ กำไร/ขาดทุนเฉลี่ย</tspan><tspan x="620.0" dy="18.9">· % เทรดที่ทำตามแผน</tspan><tspan x="620.0" dy="18.9">· R จากเทรดเกรด A vs เกรด C</tspan><tspan x="620.0" dy="18.9">· แท็กความผิดพลาดที่เจอบ่อยสุด</tspan><tspan x="620.0" dy="18.9">· สิ่งเดียวที่จะเปลี่ยนสัปดาห์หน้า</tspan></text><rect x="600.0" y="306.0" width="332.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="600.0" y="306.0" width="5.0" height="190.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="620.0" y="336.0" font-size="17" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">ทบทวนรายเดือน (1 ชั่วโมง)</tspan></text><text x="620.0" y="365.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="620.0" dy="0.0">· ค่าคาดหวังแยกตามเซ็ตอัพ (3.4)</tspan><tspan x="620.0" dy="18.9">· Drawdown เทียบกับกฎ (3.6)</tspan><tspan x="620.0" dy="18.9">· 3 เทรดดีสุดและแย่สุด: ดูซ้ำ</tspan><tspan x="620.0" dy="18.9">· สิ่งที่เปลี่ยนเดือนก่อนได้ผลไหม?</tspan><tspan x="620.0" dy="18.9">  เก็บไว้ ปรับ หรือทิ้ง</tspan></text></svg>
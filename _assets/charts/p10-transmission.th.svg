<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">นโยบายธนาคารกลางเดินทางมาถึงกราฟของคุณอย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ดอกเบี้ยนโยบายที่สูงขึ้นหรือ QT ทำให้ภาวะการเงินตึงตัว การลดดอกเบี้ยหรือ QE ผ่อนคลาย มักมีความล่าช้า</tspan></text><rect x="60.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="155.0" y="140.0" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">ดอกเบี้ยนโยบาย</tspan><tspan x="155.0" dy="18.9">+ งบดุล</tspan><tspan x="155.0" dy="18.9">(QE / QT)</tspan></text><line x1="252.0" y1="160.0" x2="268.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="270.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="365.0" y="140.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">ผลตอบแทนพันธบัตร</tspan><tspan x="365.0" dy="18.9">สินเชื่อบ้าน &amp;</tspan><tspan x="365.0" dy="18.9">ส่วนต่างเครดิต</tspan></text><line x1="462.0" y1="160.0" x2="478.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="480.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="575.0" y="140.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">ค่าเงิน</tspan><tspan x="575.0" dy="18.9">สภาพคล่อง</tspan><tspan x="575.0" dy="18.9">ความกล้าเสี่ยง</tspan></text><line x1="672.0" y1="160.0" x2="688.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="690.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="785.0" y="140.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">มูลค่า การใช้จ่าย</tspan><tspan x="785.0" dy="18.9">กำไร → ราคา</tspan><tspan x="785.0" dy="18.9">สินทรัพย์</tspan></text><rect x="28.0" y="250.0" width="444.0" height="200.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="250.0" width="5.0" height="200.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="280.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">QE: การผ่อนคลายเชิงปริมาณ</tspan></text><text x="48.0" y="309.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ธนาคารกลาง ซื้อ พันธบัตรด้วยเงินสำรองใหม่</tspan><tspan x="48.0" dy="18.9">→ ผลตอบแทนระยะยาวต่ำลง สภาพคล่องเพิ่ม</tspan><tspan x="48.0" dy="18.9">นักลงทุนถูกผลักไปหาสินทรัพย์เสี่ยงกว่า</tspan><tspan x="48.0" dy="18.9">ในอดีตเป็นแรงหนุนต่อหุ้นและตราสารหนี้เอกชน</tspan></text><rect x="488.0" y="250.0" width="444.0" height="200.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="250.0" width="5.0" height="200.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="508.0" y="280.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">QT: การตึงตัวเชิงปริมาณ</tspan></text><text x="508.0" y="309.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">ธนาคารกลางปล่อยพันธบัตรครบอายุหรือ ขาย</tspan><tspan x="508.0" dy="18.9">→ เงินสำรองลดลง ผลตอบแทนมีแรงกดขึ้น</tspan><tspan x="508.0" dy="18.9">สภาพคล่องในระบบลดลง</tspan><tspan x="508.0" dy="18.9">มักเป็นลมต้าน ผลช้าและยังถกเถียงกันอยู่</tspan></text></svg>
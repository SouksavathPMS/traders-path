<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker><marker id="aef4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The model as a flowchart, including the failure branch</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Every &#x27;no&#x27; means no trade. After entry, every outcome has a pre-written answer.</tspan></text><rect x="28.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="80.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">1 Bias</tspan><tspan x="80.0" dy="16.2">(2.2)</tspan></text><line x1="132.0" y1="127.0" x2="140.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="80.0" y1="156.0" x2="80.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="80.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">no →</tspan></text><text x="80.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">skip</tspan></text><rect x="142.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="194.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="194.0" dy="0.0">2 Target pool</tspan><tspan x="194.0" dy="16.2">(5.1)</tspan></text><line x1="246.0" y1="127.0" x2="254.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="194.0" y1="156.0" x2="194.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="194.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="194.0" dy="0.0">no →</tspan></text><text x="194.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="194.0" dy="0.0">skip</tspan></text><rect x="256.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="308.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="308.0" dy="0.0">3 Discount</tspan><tspan x="308.0" dy="16.2">(5.3)</tspan></text><line x1="360.0" y1="127.0" x2="368.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="308.0" y1="156.0" x2="308.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="308.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="308.0" dy="0.0">no →</tspan></text><text x="308.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="308.0" dy="0.0">skip</tspan></text><rect x="370.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="422.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="422.0" dy="0.0">4 Sweep</tspan><tspan x="422.0" dy="16.2">(5.2)</tspan></text><line x1="474.0" y1="127.0" x2="482.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="422.0" y1="156.0" x2="422.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="422.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="422.0" dy="0.0">no →</tspan></text><text x="422.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="422.0" dy="0.0">skip</tspan></text><rect x="484.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="536.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="536.0" dy="0.0">5 Killzone</tspan><tspan x="536.0" dy="16.2">(5.6)</tspan></text><line x1="588.0" y1="127.0" x2="596.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="536.0" y1="156.0" x2="536.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="536.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="536.0" dy="0.0">no →</tspan></text><text x="536.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="536.0" dy="0.0">skip</tspan></text><rect x="598.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="650.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">6 MSS</tspan><tspan x="650.0" dy="16.2">(5.2)</tspan></text><line x1="702.0" y1="127.0" x2="710.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="650.0" y1="156.0" x2="650.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="650.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">no →</tspan></text><text x="650.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">skip</tspan></text><rect x="712.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="764.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="764.0" dy="0.0">7 FVG / OB</tspan><tspan x="764.0" dy="16.2">(5.4–5.5)</tspan></text><line x1="816.0" y1="127.0" x2="824.0" y2="127.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a22c55e)"/><line x1="764.0" y1="156.0" x2="764.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="764.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="764.0" dy="0.0">no →</tspan></text><text x="764.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="764.0" dy="0.0">skip</tspan></text><rect x="826.0" y="100.0" width="104.0" height="54.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="878.0" y="122.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="878.0" dy="0.0">8 R:R ≥ 2</tspan><tspan x="878.0" dy="16.2">(3.2)</tspan></text><line x1="878.0" y1="156.0" x2="878.0" y2="186.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#aef4444)"/><text x="878.0" y="204.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="878.0" dy="0.0">no →</tspan></text><text x="878.0" y="220.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="878.0" dy="0.0">skip</tspan></text><text x="480.0" y="252.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">all 8 = yes → enter at the FVG CE / OB, stop beyond the sweep, size for 1R</tspan></text><line x1="480.0" y1="266.0" x2="136.0" y2="296.0" stroke="#22c55e" stroke-width="1.4" marker-end="url(#a22c55e)"/><rect x="28.0" y="300.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="136.0" y="330.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">A · Hits +2R</tspan></text><text x="136.0" y="362.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">Take half off, stop to</tspan><tspan x="136.0" dy="16.2">break-even, rest to target.</tspan><tspan x="136.0" dy="16.2">Example: +2.31R</tspan></text><line x1="480.0" y1="266.0" x2="366.0" y2="296.0" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#af59e0b)"/><rect x="258.0" y="300.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="366.0" y="330.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">B · +2R, then back to entry</tspan></text><text x="366.0" y="362.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">Half closed at +2R, rest</tspan><tspan x="366.0" dy="16.2">stopped at break-even.</tspan><tspan x="366.0" dy="16.2">Example: +0.97R</tspan></text><line x1="480.0" y1="266.0" x2="596.0" y2="296.0" stroke="#ef4444" stroke-width="1.4" marker-end="url(#aef4444)"/><rect x="488.0" y="300.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="596.0" y="330.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">C · Closes below sweep low</tspan></text><text x="596.0" y="362.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">Stop hit: −1R. The sweep</tspan><tspan x="596.0" dy="16.2">was a run. No revenge</tspan><tspan x="596.0" dy="16.2">re-entry; new setup only.</tspan></text><line x1="480.0" y1="266.0" x2="826.0" y2="296.0" stroke="#8ea0bd" stroke-width="1.4" marker-end="url(#a8ea0bd)"/><rect x="718.0" y="300.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#8ea0bd" stroke-width="1.5"/><text x="826.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">D · Never fills</tspan></text><text x="826.0" y="362.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">Price runs without a</tspan><tspan x="826.0" dy="16.2">retrace. Cancel the order;</tspan><tspan x="826.0" dy="16.2">don&#x27;t chase.</tspan></text><text x="480.0" y="510.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Example numbers from 5.7: account 10,000 USD, 29 units, risk 97.15 USD (≈1R).</tspan></text><text x="480.0" y="534.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Expectancy if 40% of trades are A at +2.6R and 60% are C at −1R: 0.4 × 2.6 − 0.6 = +0.44R (illustrative).</tspan></text></svg>
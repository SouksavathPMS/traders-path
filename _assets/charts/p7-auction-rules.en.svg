<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How the auction works</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Price advertises, time regulates, volume validates.</tspan></text><rect x="28.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="19" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Price advertises</tspan></text><text x="48.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Price moves to attract the</tspan><tspan x="48.0" dy="18.9">other side. Up = searching</tspan><tspan x="48.0" dy="18.9">for sellers; down = searching</tspan><tspan x="48.0" dy="18.9">for buyers.</tspan></text><rect x="336.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="356.0" y="122.0" font-size="19" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="356.0" dy="0.0">Time regulates</tspan></text><text x="356.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="356.0" dy="0.0">The longer price stays at a</tspan><tspan x="356.0" dy="18.9">level, the more it is accepted</tspan><tspan x="356.0" dy="18.9">as fair. Quick rejection =</tspan><tspan x="356.0" dy="18.9">unfair price.</tspan></text><rect x="644.0" y="92.0" width="290.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="92.0" width="5.0" height="190.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="664.0" y="122.0" font-size="19" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="664.0" dy="0.0">Volume validates</tspan></text><text x="664.0" y="153.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="664.0" dy="0.0">High volume at a price =</tspan><tspan x="664.0" dy="18.9">acceptance (value).</tspan><tspan x="664.0" dy="18.9">Low volume = rejection</tspan><tspan x="664.0" dy="18.9">(price moves through fast).</tspan></text><rect x="28.0" y="300.0" width="904.0" height="68.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="300.0" width="5.0" height="68.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="48.0" y="328.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Responsive activity</tspan></text><text x="48.0" y="352.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Buying below value / selling above value. Expect rotation back to value. → balance</tspan></text><rect x="28.0" y="380.0" width="904.0" height="68.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="380.0" width="5.0" height="68.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="48.0" y="408.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Initiative activity</tspan></text><text x="48.0" y="432.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Buying above value / selling below value. Expect continuation away from value. → imbalance</tspan></text></svg>
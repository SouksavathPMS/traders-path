<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">19 ตุลาคม 1987: วันเดียวกัน นักเทรดสี่คน (บัญชี 10,000 ดอลลาร์)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ถือฝั่งซื้อ S&amp;P 500 จากราคาปิดวันศุกร์ (282.70) ขาดทุนเป็น % ของบัญชี (คำนวณจริง)</tspan></text><line x1="60.0" y1="150.0" x2="900.0" y2="150.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><rect x="90.0" y="150.0" width="130.0" height="2.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="155.0" y="172.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">0%</tspan></text><text x="155.0" y="120.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="155.0" dy="0.0">ตัวกรองเทรนด์:</tspan><tspan x="155.0" dy="16.2">ไม่ถือตั้งแต่ 4 ก.ย.</tspan></text><rect x="300.0" y="150.0" width="130.0" height="3.0" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="365.0" y="174.9" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">-3.0%</tspan></text><text x="365.0" y="120.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="365.0" dy="0.0">เสี่ยง 1% Stop 275</tspan><tspan x="365.0" dy="16.2">ได้ราคา 260</tspan></text><rect x="510.0" y="150.0" width="130.0" height="7.5" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="575.0" y="179.5" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">-7.5%</tspan></text><text x="575.0" y="120.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="575.0" dy="0.0">ขนาดเดียวกัน</tspan><tspan x="575.0" dy="16.2">ไม่มี Stop</tspan></text><rect x="720.0" y="150.0" width="130.0" height="204.7" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="785.0" y="376.7" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">-204.7%</tspan></text><text x="785.0" y="120.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="785.0" dy="0.0">เลเวอเรจ 10 เท่า</tspan><tspan x="785.0" dy="16.2">ไม่มี Stop</tspan></text><text x="785.0" y="388.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="785.0" dy="0.0">แท่งถูกตัด</tspan></text><text x="60.0" y="440.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">ขนาดสำหรับเสี่ยง 1%: 100 ÷ (7.70 ÷ 282.70) ≈ 3,671 ดอลลาร์ของดัชนี ตลาดที่เร็วหรือ Gap ทำให้ Stop ได้ราคาช้า เลเวอเรจเปลี่ยนวันแย่ให้เป็นพอร์ตพัง</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How a typical prop-firm challenge works</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Example: FTMO 2-Step rules as published Oct 2026. Other firms differ in the details.</tspan></text><rect x="28.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="130.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">You pay a fee</tspan></text><text x="48.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">≈ €540 for a</tspan><tspan x="48.0" dy="18.9">100,000 demo</tspan><tspan x="48.0" dy="18.9">account</tspan></text><line x1="238.0" y1="170.0" x2="258.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="260.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="260.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="280.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">Phase 1</tspan></text><text x="280.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="280.0" dy="0.0">Make +10%</tspan><tspan x="280.0" dy="18.9">without breaking</tspan><tspan x="280.0" dy="18.9">the loss rules</tspan></text><line x1="470.0" y1="170.0" x2="490.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="492.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="512.0" y="130.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">Phase 2</tspan></text><text x="512.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">Make +5%</tspan><tspan x="512.0" dy="18.9">same loss rules</tspan></text><line x1="702.0" y1="170.0" x2="722.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="724.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="724.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="744.0" y="130.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="744.0" dy="0.0">&quot;Funded&quot; account</tspan></text><text x="744.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="744.0" dy="0.0">Still simulated;</tspan><tspan x="744.0" dy="18.9">you keep 80% of</tspan><tspan x="744.0" dy="18.9">profits (up to 90%)</tspan></text><rect x="28.0" y="256.0" width="904.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="286.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Loss rules (both phases)</tspan></text><text x="48.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">• Daily: equity may not fall more than 5% of the starting capital below the day&#x27;s opening balance</tspan><tspan x="48.0" dy="18.9">• Total: equity may never go below 90% of the starting capital (−10%)</tspan><tspan x="48.0" dy="18.9">• Break either rule once → the account is closed and the fee is gone</tspan></text><text x="48.0" y="408.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">FTMO states that all its accounts are demo accounts with fictitious funds. The fee is refunded with the first payout.</tspan></text></svg>
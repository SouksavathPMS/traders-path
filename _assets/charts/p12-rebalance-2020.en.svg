<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">An IPS rebalance in March 2020 (60/40, illustrative)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">1,000,000 THB at 60/40. Stocks follow the S&amp;P 500 path; bonds held flat for simplicity.</tspan></text><rect x="90.0" y="120.0" width="130.0" height="260.0" rx="4" fill="#3b82f6" fill-opacity="0.85"/><text x="155.0" y="110.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">1,000,000</tspan></text><text x="155.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="155.0" dy="0.0">19 Feb</tspan><tspan x="155.0" dy="16.2">start</tspan></text><rect x="300.0" y="172.9" width="130.0" height="207.1" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="365.0" y="162.9" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">796,450</tspan></text><text x="365.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="365.0" dy="0.0">23 Mar</tspan><tspan x="365.0" dy="16.2">after the fall</tspan></text><rect x="510.0" y="119.8" width="130.0" height="260.2" rx="4" fill="#8ea0bd" fill-opacity="0.85"/><text x="575.0" y="109.8" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">1,000,643</tspan></text><text x="575.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="575.0" dy="0.0">18 Aug</tspan><tspan x="575.0" dy="16.2">no rebalance</tspan></text><rect x="720.0" y="108.9" width="130.0" height="271.1" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="785.0" y="98.9" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">1,042,579</tspan></text><text x="785.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="785.0" dy="0.0">18 Aug</tspan><tspan x="785.0" dy="16.2">rebalanced on 23 Mar</tspan></text><text x="40.0" y="446.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">After the fall stocks were 49.8% of the portfolio; the rule bought 81,420 THB of stocks. By 18 Aug that added 41,936 THB (4.2%).</tspan></text></svg>
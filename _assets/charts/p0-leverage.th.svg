<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">เลเวอเรจ: เงินวางประกันน้อย ควบคุมโพซิชันใหญ่</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">บัญชี 1,000 ดอลลาร์ ตลาดขยับ 1% เท่ากัน แต่ใช้เลเวอเรจต่างกัน</tspan></text><text x="150.0" y="118.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="150.0" dy="0.0">ขนาดโพซิชัน</tspan></text><text x="700.0" y="118.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">ขยับ 1% =</tspan></text><text x="830.0" y="118.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="830.0" dy="0.0">% ของบัญชี</tspan></text><text x="40.0" y="164.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">1 : 1</tspan></text><rect x="150.0" y="142.0" width="6.0" height="32.0" rx="6" fill="#22c55e" fill-opacity="0.85"/><text x="166.0" y="164.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="166.0" dy="0.0">1,000 USD</tspan></text><text x="700.0" y="164.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">± 10 USD</tspan></text><text x="830.0" y="164.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="830.0" dy="0.0">± 1%</tspan></text><text x="40.0" y="228.0" font-size="18" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">1 : 10</tspan></text><rect x="150.0" y="206.0" width="40.0" height="32.0" rx="6" fill="#14b8a6" fill-opacity="0.85"/><text x="200.0" y="228.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="200.0" dy="0.0">10,000 USD</tspan></text><text x="700.0" y="228.0" font-size="15" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">± 100 USD</tspan></text><text x="830.0" y="228.0" font-size="18" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="830.0" dy="0.0">± 10%</tspan></text><text x="40.0" y="292.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">1 : 50</tspan></text><rect x="150.0" y="270.0" width="200.0" height="32.0" rx="6" fill="#f59e0b" fill-opacity="0.85"/><text x="360.0" y="292.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="360.0" dy="0.0">50,000 USD</tspan></text><text x="700.0" y="292.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">± 500 USD</tspan></text><text x="830.0" y="292.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="830.0" dy="0.0">± 50%</tspan></text><text x="40.0" y="356.0" font-size="18" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">1 : 100</tspan></text><rect x="150.0" y="334.0" width="400.0" height="32.0" rx="6" fill="#ef4444" fill-opacity="0.85"/><text x="560.0" y="356.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="560.0" dy="0.0">100,000 USD</tspan></text><text x="700.0" y="356.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="700.0" dy="0.0">± 1,000 USD</tspan></text><text x="830.0" y="356.0" font-size="18" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="830.0" dy="0.0">± 100%</tspan></text><rect x="28.0" y="400.0" width="904.0" height="52.0" rx="10" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><text x="48.0" y="432.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ที่ 1:100 วันที่ตลาดขยับปกติ 1% ก็ล้างบัญชีได้ทั้งหมด เลเวอเรจไม่ได้เปลี่ยนตลาด แต่เปลี่ยนว่าการขยับนั้นทำให้ คุณ เสียเท่าไหร่</tspan></text></svg>
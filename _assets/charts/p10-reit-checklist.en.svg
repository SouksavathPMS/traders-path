<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="370" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Before you buy a REIT: six questions</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">A high distribution yield means nothing if the rent behind it is shrinking.</tspan></text><rect x="28.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Occupancy</tspan></text><text x="48.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">What % of space is rented?</tspan><tspan x="48.0" dy="18.9">Falling = warning.</tspan></text><rect x="332.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="352.0" y="126.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">Lease length</tspan></text><text x="352.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">When do big leases end?</tspan><tspan x="352.0" dy="18.9">Land lease expiry?</tspan></text><rect x="636.0" y="96.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="96.0" width="5.0" height="124.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="656.0" y="126.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">Debt (gearing)</tspan></text><text x="656.0" y="155.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">Debt ÷ assets. High debt</tspan><tspan x="656.0" dy="18.9">hurts when rates rise.</tspan></text><rect x="28.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="260.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Yield vs bonds</tspan></text><text x="48.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Extra yield over government</tspan><tspan x="48.0" dy="18.9">bonds pays for the risk.</tspan></text><rect x="332.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="332.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="352.0" y="260.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">Price vs NAV</tspan></text><text x="352.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">Price below net asset value</tspan><tspan x="352.0" dy="18.9">= discount; above = premium.</tspan></text><rect x="636.0" y="230.0" width="296.0" height="124.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="636.0" y="230.0" width="5.0" height="124.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="656.0" y="260.0" font-size="17" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">Sponsor &amp; fees</tspan></text><text x="656.0" y="289.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">Who manages it and</tspan><tspan x="656.0" dy="18.9">who do the fees go to?</tspan></text></svg>
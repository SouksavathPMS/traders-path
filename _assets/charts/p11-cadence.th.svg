<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">วงจรการเรียนรู้: จังหวะที่ใช้ได้หลายปี</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">การทบทวนเล็ก ๆ อย่างสม่ำเสมอชนะการรื้อใหญ่นาน ๆ ครั้ง</tspan></text><rect x="28.0" y="96.0" width="904.0" height="60.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="6.0" height="60.0" rx="3" fill="#3b82f6" fill-opacity="1"/><text x="52.0" y="133.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">รายวัน</tspan></text><text x="200.0" y="133.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="200.0" dy="0.0">กิจวัตร บันทึกทุกเทรด ให้เกรด A/B/C (4.4–4.5)</tspan></text><text x="912.0" y="133.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="700"><tspan x="912.0" dy="0.0">15–45 นาที</tspan></text><rect x="28.0" y="168.0" width="904.0" height="60.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="168.0" width="6.0" height="60.0" rx="3" fill="#14b8a6" fill-opacity="1"/><text x="52.0" y="205.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">รายสัปดาห์</tspan></text><text x="200.0" y="205.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="200.0" dy="0.0">R, % เกรด A, แท็กความผิดพลาดอันดับหนึ่ง, หนึ่งการเปลี่ยน (4.5)</tspan></text><text x="912.0" y="205.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="700"><tspan x="912.0" dy="0.0">30 นาที</tspan></text><rect x="28.0" 
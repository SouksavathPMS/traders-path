<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Seven events, one lesson: survive first</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Peak-to-trough falls in the case studies (each from its lesson; different assets and time spans).</tspan></text><text x="250.0" y="128.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">1987 · S&amp;P 500</tspan></text><rect x="262.0" y="110.0" width="167.5" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="437.5" y="131.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="437.5" dy="0.0">−33.5%  · record again Jul 1989</tspan></text><text x="250.0" y="182.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2008 · S&amp;P 500</tspan></text><rect x="262.0" y="164.0" width="284.0" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="554.0" y="185.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="554.0" dy="0.0">−56.8%  · record again Mar 2013</tspan></text><text x="250.0" y="236.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2015 · EUR/CHF intraday</tspan></text><rect x="262.0" y="218.0" width="150.0" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="420.0" y="239.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="420.0" dy="0.0">−30.0%  · in minutes</tspan></text><text x="250.0" y="290.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2020 · S&amp;P 500</tspan></text><rect x="262.0" y="272.0" width="169.5" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="439.5" y="293.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="439.5" dy="0.0">−33.9%  · record again Aug 2020</tspan></text><text x="250.0" y="344.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2022 · S&amp;P 500</tspan></text><rect x="262.0" y="326.0" width="127.0" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="397.0" y="347.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="397.0" dy="0.0">−25.4%  · record again Jan 2024</tspan></text><text x="250.0" y="398.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2022 · FTT token</tspan></text><rect x="262.0" y="380.0" width="470.5" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="740.5" y="401.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="740.5" dy="0.0">−94.1%  · did not recover</tspan></text><text x="250.0" y="452.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="600"><tspan x="250.0" dy="0.0">2023 · KRE banks ETF</tspan></text><rect x="262.0" y="434.0" width="187.5" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.8"/><text x="457.5" y="455.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="457.5" dy="0.0">−37.5%  · to 4 May 2023</tspan></text><text x="40.0" y="500.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Common thread: small risk per trade, real stops, no borrowed money, money you control, and a written plan kept people in the game.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Options flow นี้เป็นการเปิดหรือปิดโพซิชัน?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เทียบวอลุ่มวันนี้ที่ Strike นั้นกับ Open interest ที่มีอยู่ก่อนวันนี้</tspan></text><rect x="28.0" y="96.0" width="442.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">A · วอลุ่ม 4,000 &gt; OI 900</tspan></text><rect x="88.0" y="358.0" width="100.0" height="12.0" rx="4" fill="#5b6b88" fill-opacity="0.8"/><text x="138.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="138.0" dy="0.0">Open interest</tspan><tspan x="138.0" dy="16.2">(เมื่อวาน)</tspan></text><rect x="248.0" y="316.7" width="100.0" height="53.3" rx="4" fill="#22c55e" fill-opacity="0.8"/><text x="298.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="298.0" dy="0.0">วอลุ่มวันนี้</tspan></text><text x="138.0" y="350.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">900</tspan></text><text x="298.0" y="308.7" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="298.0" dy="0.0">4,000</tspan></text><text x="48.0" y="158.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">อย่างน้อย 3,100 สัญญา ต้อง เป็น</tspan><tspan x="48.0" dy="17.6">โพซิชันใหม่ → น่าจะเป็นการเปิด</tspan></text><rect x="490.0" y="96.0" width="442.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="510.0" y="128.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">B · วอลุ่ม 2,500 &lt; OI 12,000</tspan></text><rect x="550.0" y="210.0" width="100.0" height="160.0" rx="4" fill="#5b6b88" fill-opacity="0.8"/><text x="600.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="600.0" dy="0.0">Open interest</tspan><tspan x="600.0" dy="16.2">(เมื่อวาน)</tspan></text><rect x="710.0" y="336.7" width="100.0" height="33.3" rx="4" fill="#f59e0b" fill-opacity="0.8"/><text x="760.0" y="390.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="760.0" dy="0.0">วอลุ่มวันนี้</tspan></text><text x="600.0" y="202.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">12,000</tspan></text><text x="760.0" y="328.7" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">2,500</tspan></text><text x="510.0" y="158.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">อาจเป็นการปิดโพซิชันเดิมทั้งหมด</tspan><tspan x="510.0" dy="17.6">ดู OI พรุ่งนี้จึงจะรู้</tspan></text></svg>
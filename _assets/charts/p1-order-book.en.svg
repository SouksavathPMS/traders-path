<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker></defs><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The order book: where every price comes from</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Price only moves when aggressive orders use up the resting orders on one side.</tspan></text><text x="310.0" y="110.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">BID size</tspan><tspan x="310.0" dy="17.6">(buyers waiting)</tspan></text><text x="430.0" y="118.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Price</tspan></text><text x="550.0" y="110.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">ASK size</tspan><tspan x="550.0" dy="17.6">(sellers waiting)</tspan></text><rect x="375.0" y="144.0" width="110.0" height="30.0" rx="4" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="430.0" y="165.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="430.0" dy="0.0">100.05</tspan></text><rect x="495.0" y="144.0" width="82.5" height="30.0" rx="4" fill="#ef4444" fill-opacity="0.7"/><text x="500.0" y="165.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600"><tspan x="500.0" dy="0.0">900</tspan></text><rect x="375.0" y="178.0" width="110.0" height="30.0" rx="4" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="430
f" stroke-width="1.5"/><text x="430.0" y="465.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="430.0" dy="0.0">99.97</tspan></text><rect x="319.2" y="444.0" width="45.8" height="30.0" rx="4" fill="#22c55e" fill-opacity="0.7"/><text x="360.0" y="465.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="600"><tspan x="360.0" dy="0.0">500</tspan></text><rect x="375.0" y="478.0" width="110.0" height="30.0" rx="4" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="430.0" y="499.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="430.0" dy="0.0">99.96</tspan></text><rect x="291.7" y="478.0" width="73.3" height="30.0" rx="4" fill="#22c55e" fill-opacity="0.7"/><text x="360.0" y="499.0" font-size="13" fill="#ffffff" text-anchor="end" font-weight="600"><tspan x="360.0" dy="0.0">800</tspan></text><rect x="650.0" y="130.0" width="285.0" height="190.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="650.0" y="130.0" width="5.0" height="190.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="670.0" y="160.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">Market BUY 550</tspan></text><text x="670.0" y="189.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">1) fills 250 @ 100.01</tspan><tspan x="670.0" dy="18.9">2) fills 300 @ 100.02</tspan><tspan x="670.0" dy="18.9">→ ask level gone, next best</tspan><tspan x="670.0" dy="18.9">   ask is 100.03</tspan><tspan x="670.0" dy="18.9">→ last price ticks UP</tspan></text><line x1="645.0" y1="230.0" x2="540.0" y2="261.0" stroke="#22c55e" stroke-width="2" marker-end="url(#a22c55e)"/><rect x="28.0" y="130.0" width="200.0" height="150.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="130.0" width="5.0" height="150.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="48.0" y="160.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Key idea</tspan></text><text x="48.0" y="188.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Limit orders = wall.</tspan><tspan x="48.0" dy="18.9">Market orders = hammer.</tspan><tspan x="48.0" dy="18.9">Price moves when the</tspan><tspan x="48.0" dy="18.9">hammer breaks the wall.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="450" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ตลาดหลักทรัพย์ในบ้าน: SET และ LSX (ณ ต.ค. 2026)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ทั้งสองตลาดใช้เวลา UTC+7 วันจันทร์–ศุกร์ ยกเว้นวันหยุด ตรวจสอบการเปลี่ยนแปลงที่เว็บไซต์ทางการ</tspan></text><rect x="28.0" y="92.0" width="440.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="196.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">SET · ตลาดหลักทรัพย์แห่งประเทศไทย</tspan></text><text x="48.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">• กระดานหลัก SET + mai สำหรับบริษัทเล็ก</tspan><tspan x="48.0" dy="18.9">• ราคาเป็นบาท ส่วนใหญ่ซื้อขายเป็นล็อต 100 หุ้น</tspan><tspan x="48.0" dy="18.9">• มี ETF REIT และ DR (หุ้นต่างประเทศ</tspan><tspan x="48.0" dy="18.9">  เป็นบาท เช่น Apple Tencent)</tspan><tspan x="48.0" dy="18.9">• กำไรจากขายหุ้นใน SET: ไม่เสียภาษี</tspan><tspan x="48.0" dy="18.9">  เงินได้บุคคล ปันผล: หัก 10%</tspan></text><rect x="492.0" y="92.0" width="440.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="92.0" width="5.0" height="196.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="512.0" y="122.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">LSX · ตลาดหลักทรัพย์ลาว</tspan></text><text x="512.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">• เปิด 11 ม.ค. 2011 ที่เวียงจันทน์</tspan><tspan x="512.0" dy="18.9">  (Korea Exchange ถือหุ้น 49%)</tspan><tspan x="512.0" dy="18.9">• บริษัทจดทะเบียนราวสิบกว่าแห่ง</tspan><tspan x="512.0" dy="18.9">  (12 ณ เม.ย. 2026) ราคาเป็นกีบ</tspan><tspan x="512.0" dy="18.9">• ตลาดเล็ก สภาพคล่องต่ำ: การซื้อขาย</tspan><tspan x="512.0" dy="18.9">  อาจทำให้ราคาขยับมาก</tspan><tspan x="512.0" dy="18.9">• ปันผลเสียภาษี 10% ขายหุ้น 2%</tspan></text><rect x="28.0" y="300.0" width="904.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="194.1" y1="336.0" x2="194.1" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="194.1" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="194.1" dy="0.0">09:00</tspan></text><line x1="282.4" y1="336.0" x2="282.4" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="282.4" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="282.4" dy="0.0">10:00</tspan></text><line x1="370.6" y1="336.0" x2="370.6" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="370.6" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="370.6" dy="0.0">11:00</tspan></text><line x1="458.8" y1="336.0" x2="458.8" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="458.8" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="458.8" dy="0.0">12:00</tspan></text><line x1="547.1" y1="336.0" x2="547.1" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="547.1" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="547.1" dy="0.0">13:00</tspan></text><line x1="635.3" y1="336.0" x2="635.3" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="635.3" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="635.3" dy="0.0">14:00</tspan></text><line x1="723.5" y1="336.0" x2="723.5" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="723.5" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="723.5" dy="0.0">15:00</tspan></text><line x1="811.8" y1="336.0" x2="811.8" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="811.8" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="811.8" dy="0.0">16:00</tspan></text><line x1="900.0" y1="336.0" x2="900.0" y2="420.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="900.0" y="434.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="900.0" dy="0.0">17:00</tspan></text><text x="44.0" y="357.0" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="44.0" dy="0.0">SET</tspan></text><rect x="238.2" y="343.0" width="44.1" height="22.0" rx="0" fill="#3b82f6" fill-opacity="0.3"/><rect x="282.4" y="343.0" width="220.6" height="22.0" rx="0" fill="#3b82f6" fill-opacity="0.85"/><rect x="591.2" y="343.0" width="44.1" height="22.0" rx="0" fill="#3b82f6" fill-opacity="0.3"/><rect x="635.3" y="343.0" width="220.6" height="22.0" rx="0" fill="#3b82f6" fill-opacity="0.85"/><rect x="855.9" y="343.0" width="14.7" height="22.0" rx="0" fill="#3b82f6" fill-opacity="0.3"/><text x="44.0" y="401.0" font-size="15" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="44.0" dy="0.0">LSX</tspan></text><rect x="150.0" y="387.0" width="44.1" height="22.0" rx="0" fill="#a855f7" fill-opacity="0.3"/><rect x="194.1" y="387.0" width="514.7" height="22.0" rx="0" fill="#a855f7" fill-opacity="0.85"/><rect x="708.8" y="3
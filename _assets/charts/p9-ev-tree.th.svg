<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ค่าคาดหวัง: ถ่วงน้ำหนักทุกผลลัพธ์ด้วยความน่าจะเป็น</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">EV = Σ (ความน่าจะเป็น × ผลลัพธ์) รวมทุกกิ่ง รวมถึงต้นทุนและผลลัพธ์บางส่วน</tspan></text><rect x="28.0" y="90.0" width="904.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><circle cx="110.0" cy="255.0" r="30" fill="#111a2e" stroke="#e5ecf6" stroke-width="2"/><text x="110.0" y="260.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">เทรด</tspan></text><line x1="140.0" y1="255.0" x2="330.0" y2="150.0" stroke="#22c55e" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><text x="250.0" y="196.5" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">40%</tspan></text><rect x="330.0" y="128.0" width="300.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="345.0" y="156.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="345.0" dy="0.0">ถึงเป้าเต็ม</tspan></text><text x="615.0" y="156.0" font-size="15" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="615.0" dy="0.0">+2.5R</tspan></text><text x="660.0" y="156.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="660.0" dy="0.0">40% × +2.5R = +1.000R</tspan></text><line x1="140.0" y1="255.0" x2="330.0" y2="230.0" stroke="#14b8a6" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><text x="250.0" y="236.5" font-size="14" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">15%</tspan></text><rect x="330.0" y="208.0" width="300.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="345.0" y="236.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="345.0" dy="0.0">บางส่วน / เลื่อน Stop</tspan></text><text x="615.0" y="236.0" font-size="15" fill="#14b8a6" text-anchor="end" font-weight="700"><tspan x="615.0" dy="0.0">+0.8R</tspan></text><text x="660.0" y="236.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="660.0" dy="0.0">15% × +0.8R = +0.120R</tspan></text><line x1="140.0" y1="255.0" x2="330.0" y2="310.0" stroke="#8ea0bd" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><text x="250.0" y="276.5" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">10%</tspan></text><rect x="330.0" y="288.0" width="300.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#8ea0bd" stroke-width="1.5"/><text x="345.0" y="316.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="345.0" dy="0.0">เสมอตัว</tspan></text><text x="615.0" y="316.0" font-size="15" fill="#8ea0bd" text-anchor="end" font-weight="700"><tspan x="615.0" dy="0.0">0R</tspan></text><text x="660.0" y="316.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="660.0" dy="0.0">10% × 0R = +0.000R</tspan></text><line x1="140.0" y1="255.0" x2="330.0" y2="390.0" stroke="#ef4444" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/><text x="250.0" y="316.5" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">35%</tspan></text><rect x="330.0" y="368.0" width="300.0" height="44.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="345.0" y="396.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="345.0" dy="0.0">โดน Stop</tspan></text><text x="615.0" y="396.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="615.0" dy="0.0">−1.05R</tspan></text><text x="660.0" y="396.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="660.0" dy="0.0">35% × −1.05R = -0.367R</tspan></text><text x="50.0" y="390.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">EV = +0.75R ต่อเทรด</tspan></text><text x="50.0" y="410.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">(ขาดทุน −1.05R รวม Slippage)</tspan></text></svg>
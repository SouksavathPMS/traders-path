<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Why a sweep wick happens: orders resting near an obvious low</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Illustrative order book for EUR/USD. Normal depth ≈ 20 lots per pip; the stop cluster holds 180 lots.</tspan></text><text x="206.0" y="118.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0790</tspan></text><rect x="220.0" y="104.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="118.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="146.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0788</tspan></text><rect x="220.0" y="132.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="146.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="174.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0786</tspan></text><rect x="220.0" y="160.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="174.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="202.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0784</tspan></text><rect x="220.0" y="188.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="202.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="230.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0782</tspan></text><rect x="220.0" y="216.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="230.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="258.0" font-size="13" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="206.0" dy="0.0">1.0780</tspan></text><rect x="220.0" y="244.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="258.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="286.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0778</tspan></text><rect x="220.0" y="272.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="286.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="314.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0776</tspan></text><rect x="220.0" y="300.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="314.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="342.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0774</tspan></text><rect x="220.0" y="328.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="342.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><text x="206.0" y="370.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0772</tspan></text><rect x="220.0" y="356.0" width="360.0" height="20.0" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="588.0" y="370.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="588.0" dy="0.0">60</tspan></text><text x="206.0" y="398.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0770</tspan></text><rect x="220.0" y="384.0" width="360.0" height="20.0" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="588.0" y="398.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="588.0" dy="0.0">60</tspan></text><text x="206.0" y="426.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0768</tspan></text><rect x="220.0" y="412.0" width="360.0" height="20.0" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="588.0" y="426.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="588.0" dy="0.0">60</tspan></text><text x="206.0" y="454.0" font-size="13" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="206.0" dy="0.0">1.0766</tspan></text><rect x="220.0" y="440.0" width="120.0" height="20.0" rx="3" fill="#3b82f6" fill-opacity="0.85"/><text x="348.0" y="454.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="348.0" dy="0.0">20</tspan></text><line x1="216.0" y1="254.0" x2="660.0" y2="254.0" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="1" stroke-dasharray="5 4" stroke-linecap="round"/><text x="410.0" y="250.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="410.0" dy="0.0">equal lows 1.0780 (SSL)</tspan></text><text x="620.0" y="372.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="620.0" dy="0.0">← 300 long stops × 0.5 lot = 150</tspan><tspan x="620.0" dy="17.6">← 100 breakout sells × 0.3 = 30</tspan><tspan x="620.0" dy="17.6">= 180 lots of market SELLS</tspan></text><rect x="660.0" y="100.0" width="272.0" height="230.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="680.0" y="130.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="680.0" dy="0.0">What happens</tspan></text><text x="680.0" y="158.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="680.0" dy="0.0">1. Price ticks to 1.0772.</tspan><tspan x="680.0" dy="17.6">2. 180 lots of stops fire</tspan><tspan x="680.0" dy="17.6">   as market sells.</tspan><tspan x="680.0" dy="17.6">3. Each pip below holds ~20</tspan><tspan x="680.0" dy="17.6">   lots → 180 ÷ 20 ≈ 9 pips</tspan><tspan x="680.0" dy="17.6">   of fast drop = the wick.</tspan><tspan x="680.0" dy="17.6">4. A big buyer fills 180 lots</tspan><tspan x="680.0" dy="17.6">   cheaply, price snaps back.</tspan></text><text x="48.0" y="478.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Illustration of the mechanism, not real order-book data. Spot forex has no central book (see 7.3).</tspan></text></svg>
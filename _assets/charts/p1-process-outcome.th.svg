<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ตัดสินที่กระบวนการ ไม่ใช่ผลลัพธ์</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ชนะอาจเป็นความผิดพลาด แพ้อาจเป็นการเทรดที่สมบูรณ์แบบ</tspan></text><text x="390.0" y="116.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ผลลัพธ์ดี (ชนะ)</tspan></text><text x="762.0" y="116.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="762.0" dy="0.0">ผลลัพธ์แย่ (แพ้)</tspan></text><text x="194.0" y="205.0" font-size="15" fill="#3b82f6" text-anchor="end" font-weight="700"><tspan x="194.0" dy="0.0">กระบวนการ</tspan><tspan x="194.0" dy="20.2">ดี</tspan></text><text x="194.0" y="367.0" font-size="15" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="194.0" dy="0.0">กระบวนการ</tspan><tspan x="194.0" dy="20.2">แย่</tspan></text><rect x="210.0" y="130.0" width="360.0" height="150.0" rx="12" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1.5"/><text x="230.0" y="166.0" font-size="19" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="230.0" dy="0.0">ชนะอย่างสมควร</tspan></text><text x="230.0" y="200.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="230.0" dy="0.0">ทำตามแผน และได้ผล</tspan><tspan x="230.0" dy="20.2">→ ทำซ้ำ</tspan></text><rect x="582.0" y="130.0" width="360.0" height="150.0" rx="12" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/><text x="602.0" y="166.0" font-size="19" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="602.0" dy="0.0">โชคไม่ดี — แต่ยังดีอยู่</tspan></text><text x="602.0" y="200.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="602.0" dy="0.0">ทำตามแผน แต่ก็แพ้</tspan><tspan x="602.0" dy="20.2">→ ยอมรับ การแพ้คือต้นทุน</tspan><tspan x="602.0" dy="20.2">   ของธุรกิจนี้</tspan></text><rect x="210.0" y="292.0" width="360.0" height="150.0" rx="12" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><text x="230.0" y="328.0" font-size="19" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="230.0" dy="0.0">ฟลุ๊ค — อันตรายที่สุด</tspan></text><text x="230.0" y="362.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="230.0" dy="0.0">ผิดกฎแต่ดันชนะ</tspan><tspan x="230.0" dy="20.2">→ สร้างนิสัยเสีย</tspan><tspan x="230.0" dy="20.2">   ให้บันทึกว่าเป็นความผิดพลาด</tspan></text><rect x="582.0" y="292.0" width="360.0" height="150.0" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><text x="602.0" y="328.0" font-size="19" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="602.0" dy="0.0">แพ้อย่างสมควร</tspan></text><text x="602.0" y="362.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="602.0" dy="0.0">ผิดกฎและแพ้</tspan><tspan x="602.0" dy="20.2">→ แก้ที่กระบวนการ</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Correlation: two 1% trades are not always &#x27;2% spread out&#x27;</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Typical swing of the combined position, in % of the account, for two positions that each swing 1% (σ = √(1² + 1² + 2ρ)).</tspan></text><rect x="110.0" y="184.4" width="100.0" height="155.6" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="160.0" y="174.4" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1.41%</tspan></text><text x="160.0" y="364.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="160.0" dy="0.0">unrelated (ρ = 0)</tspan></text><rect x="310.0" y="149.5" width="100.0" height="190.5" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="360.0" y="139.5" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1.73%</tspan></text><text x="360.0" y="364.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="360.0" dy="0.0">ρ = 0.5</tspan></text><rect x="510.0" y="125.6" width="100.0" height="214.4" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="560.0" y="115.6" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">1.95%</tspan></text><text x="560.0" y="364.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="560.0" dy="0.0">very similar (ρ = 0.9)</tspan></text><rect x="710.0" y="120.0" width="100.0" height="220.0" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="760.0" y="110.0" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">2.00%</tspan></text><text x="760.0" y="364.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="760.0" dy="0.0">identical (ρ = 1)</tspan></text><line x1="90.0" y1="340.0" x2="900.0" y2="340.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><text x="60.0" y="410.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">Five 1% positions with ρ = 0.8 swing like √(5 + 20 × 0.8) = 4.58%, almost five times one trade; unrelated, √5 = 2.24%.</tspan></text></svg>
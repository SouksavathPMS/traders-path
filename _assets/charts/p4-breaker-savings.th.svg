<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="450" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">วันแย่ ๆ ที่มีและไม่มีเบรกเกอร์ตัดไฟ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ลำดับตัวอย่าง: แพ้ปกติ 3 ไม้ แล้วแพ้ไม้ที่เพิ่มขนาด ไม้ที่เลื่อน Stop และไม้แก้แค้นอีกสองไม้</tspan></text><rect x="40.0" y="90.0" width="680.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="90.0" y1="124.2" x2="690.0" y2="124.2" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="82.0" y="128.2" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="82.0" dy="0.0">0R</tspan></text><line x1="90.0" y1="181.1" x2="690.0" y2="181.1" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="82.0" y="185.1" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="82.0" dy="0.0">-2R</tspan></text><line x1="90.0" y1="237.9" x2="690.0" y2="237.9" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="82.0" y="241.9" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="82.0" dy="0.0">-4R</tspan></text><line x1="90.0" y1="294.7" x2="690.0" y2="294.7" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="82.0" y="298.7" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="82.0" dy="0.0">-6R</tspan></text><line x1="90.0" y1="351.6" x2="690.0" y2="351.6" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="82.0" y="355.6" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="82.0" dy="0.0">-8R</tspan></text><text x="432.9" y="274.1" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600"><tspan x="432.9" dy="0.0">เพิ่มขนาด</tspan></text><text x="518.6" y="330.9" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600"><tspan x="518.6" dy="0.0">เลื่อน Stop</tspan></text><text x="604.3" y="359.4" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600"><tspan x="604.3" dy="0.0">แก้แค้น</tspan></text><text x="690.0" y="387.8" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600"><tspan x="690.0" dy="0.0">แก้แค้น</tspan></text><polyline points="90.0,124.2 175.7,152.6 261.4,181.1 347.1,209.5 432.9,252.1 518.6,308.9 604.3,337.4 690.0,365.8" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><polyline points="90.0,124.2 175.7,152.6 261.4,181.1 347.1,209.5" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="347.1" y1="179.5" x2="347.1" y2="380.0" stroke="#22c55e" stroke-width="1.5" stroke-opacity="1" stroke-dasharray="5 4" stroke-linecap="round"/><text x="347.1" y="171.5" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="347.1" dy="0.0">เบรกเกอร์: แพ้ 3 ไม้ → หยุด</tspan></text><text x="690.0" y="353.8" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">-8.5R</tspan></text><rect x="740.0" y="90.0" width="190.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="740.0" y="90.0" width="5.0" height="330.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="760.0" y="120.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="760.0" dy="0.0">ความต่าง</tspan></text><text x="760.0" y="148.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="760.0" dy="0.0">มีเบรกเกอร์:</tspan><tspan x="760.0" dy="17.6">−3R</tspan><tspan x="760.0" dy="17.6">(−300 ดอลลาร์ ที่ 1R = 100)</tspan><tspan x="760.0" dy="17.6"> </tspan><tspan x="760.0" dy="17.6">ไม่มี:</tspan><tspan x="760.0" dy="17.6">−8.5R</tspan><tspan x="760.0" dy="17.6">(−850 ดอลลาร์)</tspan><tspan x="760.0" dy="17.6"> </tspan><tspan x="760.0" dy="17.6">ประหยัด 5.5R และ</tspan><tspan x="760.0" dy="17.6">นิสัยการหยุด</tspan></text></svg>
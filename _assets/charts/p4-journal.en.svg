"256.0" width="870.0" height="46.0" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="285.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">03-03</tspan></text><text x="120.0" y="285.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="120.0" dy="0.0">No setup (chased)</tspan></text><text x="280.0" y="285.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="280.0" dy="0.0">—</tspan></text><text x="360.0" y="285.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">−1.6R</tspan></text><text x="440.0" y="285.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="440.0" dy="0.0">C</tspan></text><text x="500.0" y="285.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="500.0" dy="0.0">FOMO after loss</tspan></text><text x="640.0" y="285.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="640.0" dy="0.0">broke-plan · revenge · moved-stop</tspan></text><rect x="28.0" y="320.0" width="440.0" height="160.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="320.0" width="5.0" height="160.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="350.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">What the numbers say</tspan></text><text x="48.0" y="379.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Day total: −0.6R. Looks like a bad day.</tspan><tspan x="48.0" dy="18.9">But the plan trades made +1.0R.</tspan><tspan x="48.0" dy="18.9">The loss came from one C-grade trade.</tspan></text><rect x="492.0" y="320.0" width="440.0" height="160.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="320.0" width="5.0" height="160.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="512.0" y="350.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">The lesson</tspan></text><text x="512.0" y="379.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">Not &quot;my system is broken&quot; but</tspan><tspan x="512.0" dy="18.9">&quot;after a loss I chase&quot;. The fix is a rule:</tspan><tspan x="512.0" dy="18.9">&quot;After any loss: 15-minute break.&quot;</tspan></text></svg>
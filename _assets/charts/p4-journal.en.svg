<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">A journal entry that teaches you something</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Numbers tell you WHAT happened. Tags and notes tell you WHY.</tspan></text><rect x="28.0" y="100.0" width="870.0" height="44.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">Date</tspan></text><text x="120.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="120.0" dy="0.0">Setup</tspan></text><text x="280.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">Plan R:R</tspan></text><text x="360.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">Result</tspan></text><text x="440.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="440.0" dy="0.0">Grade</tspan></text><text x="500.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="500.0" dy="0.0">Emotion</tspan></text><text x="640.0" y="128.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="640.0" dy="0.0">Tags</tspan></text><rect x="28.0" y="152.0" width="870.0" height="46.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="40.0" y="181.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">03-02</tspan></text><text x=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">เงินออมส่วนไหนคือ &#x27;เงินที่เสี่ยงได้&#x27;?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวอย่าง: เงินออม 400,000 บาท ค่าใช้จ่ายจำเป็น 19,000 บาทต่อเดือน (ตัวอย่าง)</tspan></text><rect x="60.0" y="120.0" width="110.0" height="260.0" rx="4" fill="#3b82f6" fill-opacity="0.85"/><text x="115.0" y="112.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">400,000</tspan></text><text x="115.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="115.0" dy="0.0">เงินออม</tspan></text><rect x="235.0" y="120.0" width="110.0" height="74.1" rx="4" fill="#14b8a6" fill-opacity="0.85"/><text x="290.0" y="112.0" font-size="13" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">114,000</tspan></text><text x="290.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="290.0" dy="0.0">− เงินสำรองฉุกเฉิน</tspan><tspan x="290.0" dy="16.2">(6 × 19,000)</tspan></text><rect x="410.0" y="194.1" width="110.0" height="97.5" rx="4" fill="#a855f7" fill-opacity="0.85"/><text x="465.0" y="186.1" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">150,000</tspan></text><text x="465.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="465.0" dy="0.0">− ต้องใช้ภายใน</tspan><tspan x="465.0" dy="16.2">3 ปี</tspan></text><rect x="585.0" y="291.6" width="110.0" height="88.4" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="640.0" y="283.6" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">136,000</tspan></text><text x="640.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="640.0" dy="0.0">= ลงทุนได้</tspan></text><rect x="760.0" y="371.2" width="110.0" height="8.8" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="815.0" y="363.2" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">13,600</tspan></text><text x="815.0" y="402.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="815.0" dy="0.0">เงินเทรด</tspan><tspan x="815.0" dy="16.2">(≤ 10% ของส่วนนี้)</tspan></text><text x="60.0" y="445.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">ที่ความเสี่ยง 1% ต่อไม้ 1R ของบัญชี 13,600 บาท คือ 136 บาท</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Draw zones, not lines — and grade them</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">A level is an area where orders sat. Price rarely turns at the exact same tick.</tspan></text><rect x="28.0" y="90.0" width="420.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="120.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">Zone = wicks to bodies</tspan></text><rect x="44.0" y="325.1" width="388.0" height="32.0" rx="3" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/><line x1="44.0" y1="336.4" x2="432.0" y2="336.4" stroke="#5b6b88" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="2 4" stroke-linecap="round"/><line x1="52.4" y1="175.5" x2="52.4" y2="237.3" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="47.2" y="185.5" width="10.5" height="39.8" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="69.3" y1="207.0" x2="69.3" y2="272.1" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="64.1" y="225.3" width="10.5" height="42.4" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="86.2" y1="252.0" x2="86.2" y2="319.0" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="80.9" y="267.7" width="10.5" height="38.6" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="103.0" y1="301.0" x2="103.0" y2="345.3" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="97.8" y="306.3" width="10.5" height="29.0" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="119.9" y1="299.2" x2="119.9" y2="337.6" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="114.7" y="302.5" width="10.5" height="32.7" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="136.8" y1="241.4" x2="136.8" y2="318.5" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="131.6" y="250.2" width="10.5" height="52.3" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="153.7" y1="163.6" x2="153.7" y2="273.0" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="148.4" y="192.3" width="10.5" height="57.9" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="170.5" y1="155.9" x2="170.5" y2="206.3" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="165.3" y="167.7" width="10.5" height="24.6" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="187.4" y1="160.7" x2="187.4" y2="213.0" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="182.2" y="167.7" width="10.5" height="39.3" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="204.3" y1="194.5" x2="204.3" y2="268.0" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="199.0" y="207.0" width="10.5" height="40.3" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="221.1" y1="229.6" x2="221.1" y2="294.0" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="215.9" y="247.3" width="10.5" height="38.7" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="238.0" y1="267.6" x2="238.0" y2="336.4" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="232.8" y="286.0" width="10.5" height="39.1" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="254.9" y1="286.8" x2="254.9" y2="327.2" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="249.6" y="289.6" width="10.5" height="35.5" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="271.7" y1="246.9" x2="271.7" y2="295.5" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="266.5" y="253.6" width="10.5" height="36.0" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="288.6" y1="179.9" x2="288.6" y2="260.2" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="283.4" y="203.2" width="10.5" height="50.4" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="305.5" y1="167.7" x2="305.5" y2="206.6" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="300.2" y="178.2" width="10.5" height="25.0" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="322.3" y1="172.5" x2="322.3" y2="226.7" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="317.1" y="178.2" width="10.5" height="30.8" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="339.2" y1="191.9" x2="339.2" y2="277.6" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="334.0" y="209.1" width="10.5" height="63.0" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="356.1" y1="265.3" x2="356.1" y2="304.0" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="350.9" y="272.1" width="10.5" height="27.3" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="373.0" y1="279.3" x2="373.0" y2="354.1" stroke="#ef4444" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="367.7" y="299.4" width="10.5" height="43.1" rx="1.5" fill="#ef4444" fill-opacity="1"/><line x1="389.8" y1="292.3" x2="389.8" y2="349.3" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="384.6" y="309.8" width="10.5" height="32.7" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="406.7" y1="238.3" x2="406.7" y2="333.8" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="401.5" y="261.9" width="10.5" height="47.9" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="423.6" y1="200.3" x2="423.6" y2="263.8" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="418.3" y="213.1" width="10.5" height="48.8" rx="1.5" fill="#22c55e" fill-opacity="1"/><text x="103.0" y="369.3" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="103.0" dy="0.0">1</tspan></text><text x="238.0" y="360.4" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="238.0" dy="0.0">2</tspan></text><text x="373.0" y="378.1" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="373.0" dy="0.0">3</tspan></text><text x="46.0" y="400.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">A single line (dotted) gets pierced every time.</tspan><tspan x="46.0" dy="17.6">The zone holds all three touches.</tspan></text><rect x="468.0" y="90.0" width="464.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="468.0" y="90.0" width="5.0" height="66.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="488.0" y="116.0" font-size="15" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="488.0" dy="0.0">Higher timeframe</tspan></text><text x="488.0" y="140.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="488.0" dy="0.0">Weekly/daily levels beat 5-minute levels.</tspan></text><rect x="468.0" y="166.0" width="464.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="468.0" y="166.0" width="5.0" height="66.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="488.0" y="192.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="488.0" dy="0.0">Clean, strong reaction</tspan></text><text x="488.0" y="216.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="488.0" dy="0.0">Price left fast and far = many orders there.</tspan></text><rect x="468.0" y="242.0" width="464.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="468.0" y="242.0" width="5.0" height="66.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="488.0" y="268.0" font-size="15" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="488.0" dy="0.0">Recency</tspan></text><text x="488.0" y="292.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="488.0" dy="0.0">Recent levels still hold live orders.</tspan></text><rect x="468.0" y="318.0" width="464.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="468.0" y="318.0" width="5.0" height="66.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="488.0" y="344.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="488.0" dy="0.0">Confluence</tspan></text><text x="488.0" y="368.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="488.0" dy="0.0">Round number, prior day high/low, role reversal.</tspan></text><rect x="468.0" y="394.0" width="464.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="468.0" y="394.0" width="5.0" height="66.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="488.0" y="420.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="488.0" dy="0.0">Number of tests</tspan></text><text x="488.0" y="444.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="488.0" dy="0.0">Each test uses up orders. 3rd–4th test → weaker.</tspan></text></svg>
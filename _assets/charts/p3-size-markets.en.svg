<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">One formula, four markets (1R = 100 USD)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Size = 1R ÷ loss per unit at the stop. Only the &#x27;unit&#x27; changes.</tspan></text><rect x="28.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="136.0" y="128.0" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">Stock</tspan></text><text x="136.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">entry 50.00</tspan><tspan x="136.0" dy="18.9">stop 48.00</tspan></text><text x="136.0" y="248.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">loss per unit</tspan></text><text x="136.0" y="272.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">2.00 per share</tspan></text><text x="136.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">100 ÷ 2.00</tspan></text><text x="136.0" y="380.0" font-size="20" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="136.0" dy="0.0">= 50 shares</tspan></text><rect x="258.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="366.0" y="128.0" font-size="17" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">Crypto</tspan></text><text x="366.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">BTC 60,000</tspan><tspan x="366.0" dy="18.9">stop 58,500</tspan></text><text x="366.0" y="248.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">loss per unit</tspan></text><text x="366.0" y="272.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">1,500 per coin</tspan></text><text x="366.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">100 ÷ 1,500</tspan></text><text x="366.0" y="380.0" font-size="20" fill="#a855f7" text-anchor="middle" font-weight="800"><tspan x="366.0" dy="0.0">= 0.0667 BTC</tspan></text><rect x="488.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="596.0" y="128.0" font-size="17" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">Forex</tspan></text><text x="596.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">EUR/USD</tspan><tspan x="596.0" dy="18.9">25-pip stop</tspan></text><text x="596.0" y="248.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">loss per unit</tspan></text><text x="596.0" y="272.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">25 × 10 = 250 per lot</tspan></text><text x="596.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">100 ÷ 250</tspan></text><text x="596.0" y="380.0" font-size="20" fill="#14b8a6" text-anchor="middle" font-weight="800"><tspan x="596.0" dy="0.0">= 0.4 lots</tspan></text><rect x="718.0" y="96.0" width="216.0" height="340.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="826.0" y="128.0" font-size="17" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">Futures (MES)</tspan></text><text x="826.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">4-point stop</tspan><tspan x="826.0" dy="18.9">5 USD per point</tspan></text><text x="826.0" y="248.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">loss per unit</tspan></text><text x="826.0" y="272.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">4 × 5 = 20 per contract</tspan></text><text x="826.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">100 ÷ 20</tspan></text><text x="826.0" y="380.0" font-size="20" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="826.0" dy="0.0">= 5 contracts</tspan></text><text x="28.0" y="462.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="28.0" dy="0.0">Always round DOWN. If the smallest tradable size is still too big, the trade is not for your account.</tspan></text></svg>
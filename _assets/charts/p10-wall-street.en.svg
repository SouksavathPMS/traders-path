<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How Wall Street fits together</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">The sell side makes markets and sells services; the buy side manages money. Everyone needs liquidity.</tspan></text><rect x="28.0" y="100.0" width="208.0" height="300.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="132.0" y="130.0" font-size="15" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">ISSUERS</tspan></text><rect x="40.0" y="150.0" width="184.0" height="42.0" rx="8" fill="#a855f7" fill-opacity="0.12"/><text x="132.0" y="176.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="132.0" dy="0.0">Companies</tspan></text><rect x="40.0" y="202.0" width="184.0" height="42.0" rx="8" fill="#a855f7" fill-opacity="0.12"/><text x="132.0" y="228.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="132.0" dy="0.0">Governments</tspan></text><text x="132.0" y="385.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">need capital</tspan></text><line x1="238.0" y1="250.0" x2="284.0" y2="250.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="260.0" y="100.0" width="208.0" height="300.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="364.0" y="130.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">SELL SIDE</tspan></text><rect x="272.0" y="150.0" width="184.0" height="42.0" rx="8" fill="#3b82f6" fill-opacity="0.12"/><text x="364.0" y="176.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="364.0" dy="0.0">Investment banks (IPOs, M&amp;A)</tspan></text><rect x="272.0" y="202.0" width="184.0" height="42.0" rx="8" fill="#3b82f6" fill-opacity="0.12"/><text x="364.0" y="228.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="364.0" dy="0.0">Brokers &amp; research</tspan></text><rect x="272.0" y="254.0" width="184.0" height="42.0" rx="8" fill="#3b82f6" fill-opacity="0.12"/><text x="364.0" y="280.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="364.0" dy="0.0">Market makers / dealers</tspan></text><text x="364.0" y="385.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">earn fees &amp; spreads</tspan></text><line x1="470.0" y1="250.0" x2="516.0" y2="250.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="492.0" y="100.0" width="208.0" height="300.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="596.0" y="130.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">MARKETS</tspan></text><rect x="504.0" y="150.0" width="184.0" height="42.0" rx="8" fill="#f59e0b" fill-opacity="0.12"/><text x="596.0" y="176.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">Exchanges (NYSE, CME…)</tspan></text><rect x="504.0" y="202.0" width="184.0" height="42.0" rx="8" fill="#f59e0b" fill-opacity="0.12"/><text x="596.0" y="228.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">Dark pools / OTC</tspan></text><rect x="504.0" y="254.0" width="184.0" height="42.0" rx="8" fill="#f59e0b" fill-opacity="0.12"/><text x="596.0" y="280.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">Clearing houses</tspan></text><text x="596.0" y="385.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">match &amp; settle</tspan></text><line x1="702.0" y1="250.0" x2="748.0" y2="250.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="724.0" y="100.0" width="208.0" height="300.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="828.0" y="130.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">BUY SIDE</tspan></text><rect x="736.0" y="150.0" width="184.0" height="42.0" rx="8" fill="#22c55e" fill-opacity="0.12"/><text x="828.0" y="176.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="828.0" dy="0.0">Pension &amp; sovereign funds</tspan></text><rect x="736.0" y="202.0" width="184.0" height="42.0" rx="8" fill="#22c55e" fill-opacity="0.12"/><text x="828.0" y="228.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="828.0" dy="0.0">Mutual funds &amp; ETFs</tspan></text><rect x="736.0" y="254.0" width="184.0" height="42.0" rx="8" fill="#22c55e" fill-opacity="0.12"/><text x="828.0" y="280.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="828.0" dy="0.0">Hedge funds, CTAs</tspan></text><rect x="736.0" y="306.0" width="184.0" height="42.0" rx="8" fill="#22c55e" fill-opacity="0.12"/><text x="828.0" y="332.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="828.0" dy="0.0">Retail (you)</tspan></text><text x="828.0" y="385.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">invest &amp; speculate</tspan></text><text x="48.0" y="440.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Conflicts of interest exist everywhere: research sells, banks underwrite, brokers profit from activity.</tspan></text><text x="48.0" y="465.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Ask of every message: who is paying for this, and what do they want me to do?</tspan></text></svg>
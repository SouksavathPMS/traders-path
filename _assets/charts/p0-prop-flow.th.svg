<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Challenge ของ Prop firm ทั่วไปทำงานอย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวอย่าง: กฎ FTMO แบบ 2-Step ตามที่เผยแพร่ ต.ค. 2026 บริษัทอื่นต่างกันในรายละเอียด</tspan></text><rect x="28.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="130.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">คุณจ่ายค่าธรรมเนียม</tspan></text><text x="48.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">≈ €540 สำหรับ</tspan><tspan x="48.0" dy="18.9">บัญชีเดโม</tspan><tspan x="48.0" dy="18.9">100,000</tspan></text><line x1="238.0" y1="170.0" x2="258.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="260.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="260.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="280.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="280.0" dy="0.0">เฟส 1</tspan></text><text x="280.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="280.0" dy="0.0">ทำกำไร +10%</tspan><tspan x="280.0" dy="18.9">โดยไม่ผิด</tspan><tspan x="280.0" dy="18.9">กฎขาดทุน</tspan></text><line x1="470.0" y1="170.0" x2="490.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="492.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="512.0" y="130.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">เฟส 2</tspan></text><text x="512.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">ทำกำไร +5%</tspan><tspan x="512.0" dy="18.9">กฎขาดทุนเดิม</tspan></text><line x1="702.0" y1="170.0" x2="722.0" y2="170.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="724.0" y="100.0" width="208.0" height="140.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="724.0" y="100.0" width="5.0" height="140.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="744.0" y="130.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="744.0" dy="0.0">บัญชี &quot;Funded&quot;</tspan></text><text x="744.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="744.0" dy="0.0">ยังเป็นบัญชีจำลอง</tspan><tspan x="744.0" dy="18.9">ได้ 80% ของกำไร</tspan><tspan x="744.0" dy="18.9">(สูงสุด 90%)</tspan></text><rect x="28.0" y="256.0" width="904.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="286.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">กฎขาดทุน (ทั้งสองเฟส)</tspan></text><text x="48.0" y="314.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">• รายวัน: Equity ห้ามต่ำกว่ายอดต้นวันเกิน 5% ของทุนเริ่มต้น</tspan><tspan x="48.0" dy="18.9">• รวม: Equity ห้ามต่ำกว่า 90% ของทุนเริ่มต้น (−10%)</tspan><tspan x="48.0" dy="18.9">• ผิดกฎข้อใดครั้งเดียว → บัญชีถูกปิด ค่าธรรมเนียมหายไป</tspan></text><text x="48.0" y="408.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">FTMO ระบุว่าบัญชีทั้งหมดเป็นบัญชีเดโมที่ใช้เงินสมมติ ค่าธรรมเนียมคืนพร้อมการจ่ายกำไรครั้งแรก</tspan></text></svg>
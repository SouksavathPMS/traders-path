<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">1 BTC บน FTX vs 1 BTC ในกระเป๋าของคุณเอง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">สิทธิเรียกร้องของ FTX คิดเป็นดอลลาร์ ณ วันล้มละลาย (ราคาปิด 11 พ.ย. 2022: 17,070 ดอลลาร์ต่อ BTC)</tspan></text><rect x="40.0" y="110.0" width="420.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="110.0" width="5.0" height="250.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="60.0" y="140.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">บนกระดานเทรด (FTX)</tspan></text><text x="60.0" y="169.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">ถอนไม่ได้ตั้งแต่ 9 พ.ย. 2022</tspan><tspan x="60.0" dy="18.9">คุณกลายเป็นเจ้าหนี้ไม่มีหลักประกัน</tspan><tspan x="60.0" dy="18.9">คาดว่าได้คืน 118–142% ของมูลค่า</tspan><tspan x="60.0" dy="18.9">ดอลลาร์ ณ วันยื่นล้มละลาย:</tspan><tspan x="60.0" dy="18.9">17,070 × 1.18 = 20,143 ดอลลาร์</tspan><tspan x="60.0" dy="18.9">17,070 × 1.42 = 24,240 ดอลลาร์</tspan><tspan x="60.0" dy="18.9">ได้เป็นดอลลาร์ หลายปีต่อมา ไม่ได้ BTC</tspan></text><rect x="500.0" y="110.0" width="420.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="500.0" y="110.0" width="5.0" height="250.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="520.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="520.0" dy="0.0">ในกระเป๋าของคุณเอง</tspan></text><text x="520.0" y="169.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="520.0" dy="0.0">ไม่มีใครระงับได้</tspan><tspan x="520.0" dy="18.9">ราคายังร่วงตามตลาด</tspan><tspan x="520.0" dy="18.9">(−25% ในสัปดาห์นั้น) แต่คุณยังมี</tspan><tspan x="520.0" dy="18.9">เหรียญและควบคุมได้เต็มที่</tspan><tspan x="520.0" dy="18.9">ความเสี่ยงย้ายมาที่คุณ: ทำ Seed</tspan><tspan x="520.0" dy="18.9">phrase หายก็เสียเหรียญไป</tspan></text><text x="40.0" y="400.0" font-size="11" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">ที่มาของการประมาณการคืนเงิน: CEO ของ FTX John J. Ray III ตามที่รายงาน (Wikipedia)</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">หลัง N ไม้ คุณมั่นใจได้แค่ไหน?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ระบบที่ค่าคาดหวังจริง +0.35R (ชนะ 45% ที่ +2R) แท่ง: ช่วงที่ผลที่วัดได้มักตกอยู่ (95%)</tspan></text><rect x="50.0" y="90.0" width="660.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="120.0" y1="350.0" x2="680.0" y2="350.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="110.0" y="354.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="110.0" dy="0.0">-0.2R</tspan></text><line x1="120.0" y1="310.0" x2="680.0" y2="310.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><text x="110.0" y="314.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="110.0" dy="0.0">+0.0R</tspan></text><line x1="120.0" y1="270.0" x2="680.0" y2="270.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="110.0" y="274.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="110.0" dy="0.0">+0.2R</tspan></text><line x1="120.0" y1="230.0" x2="680.0" y2="230.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="110.0" y="234.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="110.0" dy="0.0">+0.4R</tspan></text><line x1="120.0" y1="190.0" x2="680.0" y2="190.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="110.0" y="194.0" font-size="12" fill="#8ea0b
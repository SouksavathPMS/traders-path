<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Money comes in this order: trading is the last step</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Climb one step at a time. Each step protects the one above it.</tspan></text><rect x="40.0" y="400.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="2"/><text x="54.0" y="420.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="54.0" dy="0.0">1 · Budget &amp; bills paid</tspan></text><text x="54.0" y="438.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="54.0" dy="0.0">Know your essential monthly costs</tspan></text><rect x="152.0" y="348.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="2"/><text x="166.0" y="368.0" font-size="14" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="166.0" dy="0.0">2 · Starter emergency fund</tspan></text><text x="166.0" y="386.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="166.0" dy="0.0">About 1 month of essentials in cash</tspan></text><rect x="264.0" y="296.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="278.0" y="316.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="278.0" dy="0.0">3 · Pay off high-interest debt</tspan></text><text x="278.0" y="334.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="278.0" dy="0.0">Credit cards, personal loans: a sure 16–25% &#x27;return&#x27;</tspan></text><rect x="376.0" y="244.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="2"/><text x="390.0" y="264.0" font-size="14" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="390.0" dy="0.0">4 · Full emergency fund</tspan></text><text x="390.0" y="282.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="390.0" dy="0.0">3–6 months of essentials</tspan></text><rect x="488.0" y="192.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="502.0" y="212.0" font-size="14" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="502.0" dy="0.0">5 · Long-term investing</tspan></text><text x="502.0" y="230.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="502.0" dy="0.0">Diversified, low-cost, by your IPS (11.2)</tspan></text><rect x="600.0" y="140.0" width="290.0" height="46.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="614.0" y="160.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="614.0" dy="0.0">6 · Trading (risk capital)</tspan></text><text x="614.0" y="178.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="614.0" dy="0.0">Small; losing all of it wouldn&#x27;t change your life</tspan></text></svg>
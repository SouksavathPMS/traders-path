<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How central bank policy reaches your chart</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Higher policy rates or QT tighten financial conditions; cuts or QE loosen them, usually with a lag.</tspan></text><rect x="60.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="155.0" y="140.0" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Policy rate</tspan><tspan x="155.0" dy="18.9">+ balance sheet</tspan><tspan x="155.0" dy="18.9">(QE / QT)</tspan></text><line x1="252.0" y1="160.0" x2="268.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="270.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="365.0" y="140.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Bond yields,</tspan><tspan x="365.0" dy="18.9">mortgage &amp; credit</tspan><tspan x="365.0" dy="18.9">spreads</tspan></text><line x1="462.0" y1="160.0" x2="478.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="480.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="575.0" y="140.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Currency,</tspan><tspan x="575.0" dy="18.9">liquidity, risk</tspan><tspan x="575.0" dy="18.9">appetite</tspan></text><line x1="672.0" y1="160.0" x2="688.0" y2="160.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="690.0" y="100.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="785.0" y="140.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Valuations, spending,</tspan><tspan x="785.0" dy="18.9">earnings → asset</tspan><tspan x="785.0" dy="18.9">prices</tspan></text><rect x="28.0" y="250.0" width="444.0" height="200.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="250.0" width="5.0" height="200.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="280.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">QE: quantitative easing</tspan></text><text x="48.0" y="309.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Central bank BUYS bonds with new reserves.</tspan><tspan x="48.0" dy="18.9">→ lower long-term yields, more liquidity,</tspan><tspan x="48.0" dy="18.9">investors pushed into riskier assets.</tspan><tspan x="48.0" dy="18.9">Historically supportive for stocks and credit.</tspan></text><rect x="488.0" y="250.0" width="444.0" height="200.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="250.0" width="5.0" height="200.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="508.0" y="280.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">QT: quantitative tightening</tspan></text><text x="508.0" y="309.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">Central bank lets bonds mature or SELLS them.</tspan><tspan x="508.0" dy="18.9">→ reserves drain, upward pressure on yields,</tspan><tspan x="508.0" dy="18.9">less liquidity in the system.</tspan><tspan x="508.0" dy="18.9">Usually a headwind; effects are slow and debated.</tspan></text></svg>
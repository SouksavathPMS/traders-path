<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Phase 3 on one page</tspan></text><line x1="480.0" y1="310.0" x2="170.0" y2="140.0" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="790.0" y2="140.0" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="150.0" y2="320.0" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="810.0" y2="320.0" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="250.0" y2="480.0" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="710.0" y2="480.0" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><circle cx="480.0" cy="310.0" r="74" fill="#111a2e" stroke="#e5ecf6" stroke-width="2"/><text x="480.0" y="306.0" font-size="20" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">PHASE 3</tspan></text><text x="480.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Risk &amp; Money</tspan></text><rect x="40.0" y="98.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="170.0" y="126.0" font-size="17" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">3.1 Survive first</tspan></text><text x="170.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0.0">Risk 0.5–1% per trade.</tspan><tspan x="170.0" dy="17.6">Streaks are certain.</tspan></text><rect x="660.0" y="98.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="790.0" y="126.0" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">3.2 Position sizing</tspan></text><text x="790.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="790.0" dy="0.0">$ risk ÷ stop distance</tspan><tspan x="790.0" dy="17.6">= size.</tspan></text><rect x="20.0" y="278.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="150.0" y="306.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">3.3 R-multiples</tspan></text><text x="150.0" y="330.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0.0">1R = loss at the stop.</tspan><tspan x="150.0" dy="17.6">Measure everything in R.</tspan></text><rect x="680.0" y="278.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="810.0" y="306.0" font-size="17" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">3.4 Expectancy</tspan></text><text x="810.0" y="330.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="810.0" dy="0.0">Win% × avg win − Loss% × 1R.</tspan><tspan x="810.0" dy="17.6">Judge on 100+ trades.</tspan></text><rect x="120.0" y="438.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="250.0" y="466.0" font-size="17" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">3.5 Stops &amp; targets</tspan></text><text x="250.0" y="490.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="250.0" dy="0.0">Stop where the idea is wrong.</tspan><tspan x="250.0" dy="17.6">Exit plan before entry.</tspan></text><rect x="580.0" y="438.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="710.0" y="466.0" font-size="17" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">3.6 Drawdown</tspan></text><text x="710.0" y="490.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="710.0" dy="0.0">−50% needs +100%.</tspan><tspan x="710.0" dy="17.6">Cut size when down.</tspan></text></svg>
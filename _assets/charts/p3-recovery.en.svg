<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Losses and recoveries are not symmetric</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Gain needed to get back to break-even = loss ÷ (1 − loss)</tspan></text><rect x="28.0" y="90.0" width="904.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="70.0" y1="330.0" x2="900.0" y2="330.0" stroke="#5b6b88" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><rect x="90.0" y="330.0" width="34.0" height="2.5" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="107.0" y="348.5" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="107.0" dy="0.0">−5%</tspan></text><rect x="130.0" y="323.9" width="34.0" height="6.1" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="147.0" y="315.9" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="147.0" dy="0.0">+5%</tspan></text><rect x="192.0" y="330.0" width="34.0" height="5.1" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="209.0" y="351.1" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="209.0" dy="0.0">−10%</tspan></text><rect x="232.0" y="317.2" width="34.0" height="12.8" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="249.0" y="309.2" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="249.0" dy="0.0">+11%</tspan></text><rect x="294.0" y="330.0" width="34.0" height="10.1" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="311.0" y="356.1" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="311.0" dy="0.0">−20%</tspan></text><rect x="334.0" y="301.2" width="34.0" height="28.7" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="351.0" y="293.2" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="351.0" dy="0.0">+25%</tspan></text><rect x="396.0" y="330.0" width="34.0" height="15.2" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="413.0" y="361.2" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="413.0" dy="0.0">−30%</tspan></text><rect x="436.0" y="280.7" width="34.0" height="49.3" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="453.0" y="272.7" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="453.0" dy="0.0">+43%</tspan></text><rect x="498.0" y="330.0" width="34.0" height="20.2" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="515.0" y="366.2" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">−40%</tspan></text><rect x="538.0" y="253.3" width="34.0" height="76.7" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="555.0" y="245.3" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">+67%</tspan></text><rect x="600.0" y="330.0" width="34.0" height="25.3" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="617.0" y="371.3" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="617.0" dy="0.0">−50%</tspan></text><rect x="640.0" y="215.0" width="34.0" height="115.0" rx="3" fill="#22c55e" fill-opacity="0.85"/><text x="657.0" y="207.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="657.0" dy="0.0">+100%</tspan></text><rect x="702.0" y="330.0" width="34.0" height="38.0" rx="3" fill="#ef4444" fill-opacity="0.85"/><text x="719.0" y="383.9" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="719.0" dy="0.0">−75%</tspan></text><rect x="742.0" y="157.5" width="34.0" height="172.5" rx="3" fill="#22c5
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">เพิ่มโพซิชันโดยไม่เพิ่มความเสี่ยง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">งบความเสี่ยง 100 ดอลลาร์ (1R) เพิ่มเฉพาะหลังส่วนแรกกำไร และเลื่อน Stop ให้กรณีแย่สุดรวมยังเป็น 1R</tspan></text><rect x="40.0" y="100.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="100.0" width="5.0" height="92.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="60.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ขั้น 1 · ซื้อ 50 ที่ 100 Stop 98</tspan></text><text x="60.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">กรณีแย่สุด: 50 × (98 − 100) = −100 ดอลลาร์ = −1R</tspan></text><rect x="40.0" y="210.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="210.0" width="5.0" height="92.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="60.0" y="240.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ขั้น 2 · ราคา 104: เพิ่ม 50 ที่ 104 เลื่อน Stop ทั้งหมดไป 101</tspan></text><text x="60.0" y="268.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">กรณีแย่สุด: 50 × (+1) + 50 × (−3) = +50 − 150 = −100 ดอลลาร์ = −1R · ต้นทุนเฉลี่ย 102</tspan></text><rect x="40.0" y="320.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="320.0" width="5.0" height="92.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="60.0" y="350.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ขั้น 3 · ราคาถึง 110</tspan></text><text x="60.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">50 × 10 + 50 × 6 = +800 ดอลลาร์ = +8R  (หน่วยเดียว: 50 × 10 = +500 ดอลลาร์ = +5R)</tspan></text><text x="40.0" y="445.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">การเพิ่มจ่ายด้วยกำไรที่ยังไม่ปิดของหน่วยแรก ถ้าเทรดไม่เคยวิ่งไปในทางของคุณ คุณก็จะไม่เพิ่มเลย</tspan></text></svg>
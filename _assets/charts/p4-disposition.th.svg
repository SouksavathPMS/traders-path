<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อารมณ์เปลี่ยนแผนที่ชนะให้กลายเป็นแผนที่แพ้ได้อย่างไร</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เซ็ตอัพเดียวกัน จุดเข้าเดียวกัน ต่างแค่การออก: ตัดไม้กำไรเร็ว ถือไม้ขาดทุน &quot;จนกว่าจะกลับมา&quot;</tspan></text><rect x="28.0" y="90.0" width="444.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="120.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">ตามแผน</tspan></text><line x1="58.0" y1="270.0" x2="448.0" y2="270.0" stroke="#5b6b88" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><rect x="88.0" y="170.0" width="70.0" height="100.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="123.0" y="162.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="123.0" dy="0.0">+2.0R</tspan></text><text x="123.0" y="350.0" font-size="1" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="123.0" dy="0.0"></tspan></text><rect x="178.0" y="270.0" width="70.0" height="50.0" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="213.0" y="340.0" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="213.0" dy="0.0">−1.0R</tspan></text><text x="123.0" y="290.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="123.0" dy="0.0">กำไรเฉลี่ย</tspan></text><text x="213.0" y="260.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="213.0" dy="0.0">ขาดทุนเฉลี่ย</tspan></text><text x="278.0" y="170.0" font-size="1
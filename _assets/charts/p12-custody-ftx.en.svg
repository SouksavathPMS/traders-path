<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">1 BTC on FTX vs 1 BTC in your own wallet</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">FTX claims were valued in US dollars at the bankruptcy date (11 Nov 2022 close: 17,070 USD per BTC).</tspan></text><rect x="40.0" y="110.0" width="420.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="110.0" width="5.0" height="250.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="60.0" y="140.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">On the exchange (FTX)</tspan></text><text x="60.0" y="169.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">Withdrawals frozen 9 Nov 2022.</tspan><tspan x="60.0" dy="18.9">You become an unsecured creditor.</tspan><tspan x="60.0" dy="18.9">Estimated recovery 118–142% of the</tspan><tspan x="60.0" dy="18.9">petition-date dollar value:</tspan><tspan x="60.0" dy="18.9">17,070 × 1.18 = 20,143 USD</tspan><tspan x="60.0" dy="18.9">17,070 × 1.42 = 24,240 USD</tspan><tspan x="60.0" dy="18.9">Paid in dollars, years later; no BTC.</tspan></text><rect x="500.0" y="110.0" width="420.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="500.0" y="110.0" width="5.0" height="250.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="520.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="520.0" dy="0.0">In your own wallet</tspan></text><text x="520.0" y="169.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="520.0" dy="0.0">Nobody can freeze it.</tspan><tspan x="520.0" dy="18.9">Price still fell with the market</tspan><tspan x="520.0" dy="18.9">(−25% in the week), but you kept</tspan><tspan x="520.0" dy="18.9">the coin and full control.</tspan><tspan x="520.0" dy="18.9">Risk moves to you: lose the seed</tspan><tspan x="520.0" dy="18.9">phrase and the coin is gone.</tspan></text><text x="40.0" y="400.0" font-size="11" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">Source for recovery estimate: FTX CEO John J. Ray III, as reported (Wikipedia, Bankruptcy of FTX).</tspan></text></svg>
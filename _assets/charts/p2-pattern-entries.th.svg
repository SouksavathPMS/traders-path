<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">จุดเข้าเป็นตัวกำหนด R:R ไม่ใช่ตัวรูปแบบ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ยอดคู่จากภาพแรก: รูปแบบเดียวกัน เป้าเดียวกัน 42.0 (ราคาตัวอย่าง)</tspan></text><line x1="758.0" y1="110.0" x2="758.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="758.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="758.0" dy="0.0">42</tspan></text><line x1="634.0" y1="110.0" x2="634.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="634.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="634.0" dy="0.0">44</tspan></text><line x1="510.0" y1="110.0" x2="510.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="510.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="510.0" dy="0.0">46</tspan></text><line x1="386.0" y1="110.0" x2="386.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="386.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="386.0" dy="0.0">48</tspan></text><line x1="262.0" y1="110.0" x2="262.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="262.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="262.0" dy="0.0">50</tspan></text><text x="40.0" y="150.0" font-size="15" fill="#ef4444" text-
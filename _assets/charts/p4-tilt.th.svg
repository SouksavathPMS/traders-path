<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">มาตรวัด Tilt: รู้ว่าตัวเองอยู่ตรงไหนก่อนกดคลิก</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Tilt = อารมณ์เข้ามาคุมการตัดสินใจ มันก่อตัวเป็นขั้น และแต่ละขั้นมีกฎของมัน</tspan></text><rect x="42.0" y="110.0" width="289.3" height="22.0" rx="11" fill="#22c55e" fill-opacity="0.9"/><rect x="42.0" y="146.0" width="289.3" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="62.0" y="182.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="62.0" dy="0.0">เขียว · ควบคุมได้</tspan></text><text x="62.0" y="214.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="62.0" dy="0.0">สัญญาณ:</tspan></text><text x="62.0" y="238.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="62.0" dy="0.0">สงบ อดทน เบื่อกับการรอ</tspan><tspan x="62.0" dy="18.9">การแพ้รู้สึกเหมือน</tspan><tspan x="62.0" dy="18.9">ต้นทุนธุรกิจ</tspan></text><rect x="54.0" y="380.0" width="261.3" height="80.0" rx="10" fill="#22c55e" fill-opacity="0.14"/><text x="66.0" y="406.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="66.0" dy="0.0">กฎ:</tspan></text><text x="66.0" y="434.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="66.0" dy="0.0">เทรดตามแผน</tspan></text><rect x="335.3" y="110.0" width="289.3" height="22.0" rx="11" fill="#f59e0b" fill-opacity="0.9"/><rect x="335.3" y="146.0" width="289.3" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="355.3" y="182.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="355.3" dy="0.0">เหลือง · เริ่มร้อน</tspan></text><text x="355.3" y="214.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="355.3" dy="0.0">สัญญาณ:</tspan></text><text x="355.3" y="238.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="355.3" dy="0.0">ดูกำไรขาดทุนบ่อย อยาก</tspan><tspan x="355.3" dy="18.9">&#x27;เอาคืน&#x27; คลิกเร็วขึ้น</tspan><tspan x="355.3" dy="18.9">ข้ามขั้นในเช็กลิสต์</tspan></text><rect x="347.3" y="380.0" width="261.3" height="80.0" rx="10" fill="#f59e0b" fill-opacity="0.14"/><text x="359.3" y="406.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="359.3" dy="0.0">กฎ:</tspan></text><text x="359.3" y="434.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="359.3" dy="0.0">พัก 15 นาที ลดไม้ครึ่งหนึ่ง</tspan></text><rect x="628.7" y="110.0" width="289.3" height="22.0" rx="11" fill="#ef4444" fill-opacity="0.9"/><rect x="628.7" y="146.0" width="289.3" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="648.7" y="182.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="648.7" dy="0.0">แดง · Tilt แล้ว</tspan></text><text x="648.7" y="214.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="648.7" dy="0.0">สัญญาณ:</tspan></text><text x="648.7" y="238.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="648.7" dy="0.0">โกรธหรือตื่นตระหนก เทรดแก้แค้น</tspan><tspan x="648.7" dy="18.9">ย้าย Stop เพิ่มไม้</tspan><tspan x="648.7" dy="18.9">หลังแพ้</tspan></text><rect x="640.7" y="380.0" width="261.3" height="80.0" rx="10" fill="#ef4444" fill-opacity="0.14"/><text x="652.7" y="406.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="652.7" dy="0.0">กฎ:</tspan></text><text x="652.7" y="434.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="652.7" dy="0.0">ปิดแพลตฟอร์ม จบวันนี้</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Where did it close? Measure the close inside the range</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Close location = (close − low) ÷ (high − low). Top 25% = strong, bottom 25% = weak.</tspan></text><rect x="110.0" y="110.0" width="300.0" height="75.0" rx="4" fill="#22c55e" fill-opacity="0.12"/><text x="430.0" y="152.5" font-size="13" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="430.0" dy="0.0">strong (top 25%)</tspan></text><rect x="110.0" y="185.0" width="300.0" height="150.0" rx="4" fill="#5b6b88" fill-opacity="0.12"/><text x="430.0" y="265.0" font-size="13" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="430.0" dy="0.0">middle</tspan></text><rect x="110.0" y="335.0" width="300.0" height="75.0" rx="4" fill="#ef4444" fill-opacity="0.12"/><text x="430.0" y="377.5" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="430.0" dy="0.0">weak (bottom 25%)</tspan></text><line x1="260.0" y1="110.0" x2="260.0" y2="410.0" stroke="#22c55e" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><rect x="230.0" y="152.9" width="60.0" height="128.6" rx="4" fill="#22c55e" fill-opacity="1"/><text x="100.0" y="115.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="100.0" dy="0.0">H 104</tspan></text><text x="100.0" y="157.9" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="100.0" dy="0.0">C 103</tspan></text><text x="100.0" y="286.4" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="100.0" dy="0.0">O 100</tspan></text><text x="100.0" y="415.0" font-size="13" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="100.0" dy="0.0">L 97</tspan></text><rect x="560.0" y="110.0" width="370.0" height="300.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="560.0" y="110.0" width="5.0" height="300.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="580.0" y="140.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="580.0" dy="0.0">The example candle</tspan></text><text x="580.0" y="170.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="580.0" dy="0.0">Range</tspan></text><text x="910.0" y="170.0" font-size="15" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">104 − 97 = 7</tspan></text><text x="580.0" y="208.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="580.0" dy="0.0">Body</tspan></text><text x="910.0" y="208.0" font-size="15" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">103 − 100 = 3</tspan></text><text x="580.0" y="246.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="580.0" dy="0.0">Lower wick</tspan></text><text x="910.0" y="246.0" font-size="15" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">100 − 97 = 3</tspan></text><text x="580.0" y="284.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="580.0" dy="0.0">Upper wick</tspan></text><text x="910.0" y="284.0" font-size="15" fill="#e5ecf6" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">104 − 103 = 1</tspan></text><text x="580.0" y="322.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="580.0" dy="0.0">Close location</tspan></text><text x="910.0" y="322.0" font-size="15" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">(103 − 97) ÷ 7 = 86%</tspan></text><text x="580.0" y="380.0" font-size="14" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="580.0" dy="0.0">86% → top 25%: buyers won the close.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Five ways a backtest lies, as tiny stories</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Each one makes the past look better than the future will be.</tspan></text><rect x="28.0" y="96.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="6.0" height="72.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="52.0" y="138.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Look-ahead</tspan></text><text x="300.0" y="126.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">Buys at the open using that day&#x27;s close.</tspan><tspan x="300.0" dy="17.6">Knew the future → impossible in real life.</tspan></text><rect x="28.0" y="178.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="178.0" width="6.0" height="72.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="52.0" y="220.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Survivorship</tspan></text><text x="300.0" y="208.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">Tests today&#x27;s index members only.</tspan><tspan x="300.0" dy="17.6">The companies that went bust are missing.</tspan></text><rect x="28.0" y="260.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="260.0" width="6.0" height="72.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="52.0" y="302.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Overfitting</tspan></text><text x="300.0" y="290.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">Tunes 6 settings until the past is perfect.</tspan><tspan x="300.0" dy="17.6">Fits the noise; fails on new data.</tspan></text><rect x="28.0" y="342.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="342.0" width="6.0" height="72.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="52.0" y="384.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Data snooping</tspan></text><text x="300.0" y="372.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">Tries 200 ideas, shows the best one.</tspan><tspan x="300.0" dy="17.6">By luck alone, some will look great.</tspan></text><rect x="28.0" y="424.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="424.0" width="6.0" height="72.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="52.0" y="466.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Ignoring costs</tspan></text><text x="300.0" y="454.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">200 trades a year, no spread or commission.</tspan><tspan x="300.0" dy="17.6">+20% on paper becomes −5% for real.</tspan></text></svg>
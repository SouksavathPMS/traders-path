<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The clock-change trap: Europe and the US switch on different dates</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Thailand and Laos never change clocks, so session times shift for us twice a year, in two steps.</tspan></text><rect x="28.0" y="96.0" width="288.0" height="290.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Fri 23 Oct</tspan><tspan x="48.0" dy="20.2">(both on summer time)</tspan></text><text x="48.0" y="210.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">London open</tspan></text><text x="296.0" y="210.0" font-size="26" fill="#3b82f6" text-anchor="end" font-weight="700"><tspan x="296.0" dy="0.0">14:00</tspan></text><text x="48.0" y="280.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">New York open</tspan></text><text x="296.0" y="280.0" font-size="26" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="296.0" dy="0.0">20:30</tspan></text><text x="48.0" y="350.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Bangkok time</tspan></text><rect x="332.0" y="96.0" width="288.0" height="290.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="352.0" y="128.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="352.0" dy="0.0">Tue 27 Oct</tspan><tspan x="352.0" dy="20.2">(Europe changed 25 Oct)</tspan></text><text x="352.0" y="210.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">London open</tspan></text><text x="600.0" y="210.0" font-size="26" fill="#3b82f6" text-anchor="end" font-weight="700"><tspan x="600.0" dy="0.0">15:00</tspan></text><text x="352.0" y="280.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">New York open</tspan></text><text x="600.0" y="280.0" font-size="26" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="600.0" dy="0.0">20:30</tspan></text><text x="352.0" y="350.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="352.0" dy="0.0">Bangkok time</tspan></text><rect x="428.7" y="356.0" width="94.6" height="24.0" rx="12.0" fill="#ec4899" fill-opacity="1"/><text x="476.0" y="374.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="476.0" dy="0.0">+1h: London</tspan></text><rect x="636.0" y="96.0" width="288.0" height="290.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="656.0" y="128.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="656.0" dy="0.0">Tue 3 Nov</tspan><tspan x="656.0" dy="20.2">(US changed 1 Nov)</tspan></text><text x="656.0" y="210.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">London open</tspan></text><text x="904.0" y="210.0" font-size="26" fill="#3b82f6" text-anchor="end" font-weight="700"><tspan x="904.0" dy="0.0">15:00</tspan></text><text x="656.0" y="280.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="656.0" dy="0.0">New York open</tspan></text><text x="904.0" y="280.0" font-size="26" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="904.0" dy="0.0">21:30</tspan></text><text x="656.0" y="350.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a5b6b88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b88"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">&#x27;Half at +2R, stop to break-even, rest to +4R&#x27;: the three outcomes</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Entry 100, stop 98 (1R = 2 points), 2 units. Targets 104 (+2R) and 108 (+4R).</tspan></text><rect x="40.0" y="170.0" width="200.0" height="90.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="170.0" width="5.0" height="90.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="60.0" y="200.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Entry</tspan></text><text x="60.0" y="228.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">2 units at 100</tspan><tspan x="60.0" dy="17.6">stop 98</tspan></text><line x1="244.0" y1="215.0" x2="380.0" y2="130.0" stroke="#5b6b88" stroke-width="1.8" marker-end="url(#a5b6b88)"/><rect x="390.0" y="100.0" width="420.0" height="76.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="390.0" y="100.0" width="5.0" height="76.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="410.0" y="130.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="410.0" dy="0.0">Stopped before 104</tspan></text><text x="410.0" y="157.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="410.0" dy="0.0">2 units × −2 = −4 points</tspan></text><text x="860.0" y="146.0" font-size="24" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="860.0" dy="0.0">−1R</tspan></text><line x1="244.0" y1="215.0" x2="380.0" y2="240.0" stroke="#5b6b88" stroke-width="1.8" marker-end="url(#a5b6b88)"/><rect x="390.0" y="210.0" width="420.0" height="76.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="390.0" y="210.0" width="5.0" height="76.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="410.0" y="240.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="410.0" dy="0.0">104 hit, then back to 100</tspan></text><text x="410.0" y="267.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="410.0" dy="0.0">1 unit +4, 1 unit 0 = +4 points</tspan></text><text x="860.0" y="256.0" font-size="24" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="860.0" dy="0.0">+1R</tspan></text><line x1="244.0" y1="215.0" x2="380.0" y2="350.0" stroke="#5b6b88" stroke-width="1.8" marker-end="url(#a5b6b88)"/><rect x="390.0" y="320.0" width="420.0" height="76.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="390.0" y="320.0" width="5.0" height="76.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="410.0" y="350.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="410.0" dy="0.0">104 hit, then 108 hit</tspan></text><text x="410.0" y="377.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="410.0" dy="0.0">1 unit +4, 1 unit +8 = +12 points</tspan></text><text x="860.0" y="366.0" font-size="24" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="860.0" dy="0.0">+3R</tspan></text><text x="40.0" y="428.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">4 points of profit = 4 ÷ (2 units × 2 points of risk) = +1R. The worst case after the first target is +1R, not −1R.</tspan></text></svg>
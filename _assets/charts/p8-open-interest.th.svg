<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Open Interest = จำนวนสัญญาที่ยังเปิดอยู่</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Volume นับทุกการซื้อขาย แต่ Open Interest จะเพิ่มก็ต่อเมื่อมีการสร้างสัญญา ใหม่</tspan></text><text x="360.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Volume</tspan></text><text x="470.0" y="120.0" font-size="13" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Open Interest</tspan></text><rect x="28.0" y="136.0" width="904.0" height="64.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="174.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">วันที่ 1</tspan></text><text x="120.0" y="163.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="120.0" dy="0.0">แอนซื้อ Call 1 สัญญาจากเบน</tspan><tspan x="120.0" dy="17.6">(ทั้งคู่เปิดใหม่)</tspan></text><text x="360.0" y="176.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1</tspan></text><text x="470.0" y="176.0" font-size="22" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">1</tspan></text><rect x="530.0" y="154.0" width="26.0" height="28.0" rx="5" fill="#22c55e" fill-opacity="0.85"/><text x="910.0" y="176.0" font-size="13" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">+1 เปิดใหม่</tspan></text><rect x="28.0" y="212.0" width="904.0" height="64.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="250.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">วันที่ 2</tspan></text><text x="120.0" y="239.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="120.0" dy="0.0">แคทซื้อ Call 1 สัญญาจากแดน</tspan><tspan x="120.0" dy="17.6">(ทั้งคู่เปิดใหม่)</tspan></text><text x="360.0" y="252.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1</tspan></text><text x="470.0" y="252.0" font-size="22" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">2</tspan></text><rect x="530.0" y="230.0" width="26.0" height="28.0" rx="5" fill="#22c55e" fill-opacity="0.85"/><rect x="564.0" y="230.0" width="26.0" height="28.0" rx="5" fill="#22c55e" fill-opacity="0.85"/><text x="910.0" y="252.0" font-size="13" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">+1 เปิดใหม่</tspan></text><rect x="28.0" y="288.0" width="904.0" height="64.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="326.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">วันที่ 3</tspan></text><text x="120.0" y="315.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="120.0" dy="0.0">แอนขาย Call ให้อีฟ</tspan><tspan x="120.0" dy="17.6">(แอนปิด อีฟเปิดแทน)</tspan></text><text x="360.0" y="328.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1</tspan></text><text x="470.0" y="328.0" font-size="22" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">2</tspan></text><rect x="530.0" y="306.0" width="26.0" height="28.0" rx="5" fill="#f59e0b" fill-opacity="0.85"/><rect x="564.0" y="306.0" width="26.0" height="28.0" rx="5" fill="#f59e0b" fill-opacity="0.85"/><text x="910.0" y="328.0" font-size="13" fill="#f59e0b" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">แค่เปลี่ยนมือ</tspan></text><rect x="28.0" y="364.0" width="904.0" height="64.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="402.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">วันที่ 4</tspan></text><text x="120.0" y="391.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="120.0" dy="0.0">แคทขายคืนให้แดน</tspan><tspan x="120.0" dy="17.6">(ทั้งคู่ปิด)</tspan></text><text x="360.0" y="404.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1</tspan></text><text x="470.0" y="404.0" font-size="22" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">1</tspan></text><rect x="530.0" y="382.0" width="26.0" height="28.0" rx="5" fill="#ef4444" fill-opacity="0.85"/><text x="910.0" y="404.0" font-size="13" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="910.0" dy="0.0">−1 ปิดสัญญา</tspan></text><text x="48.0" y="450.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Open Interest สูงที่ Strike ใด = มีสัญญาค้างอยู่มาก = ดีลเลอร์มี Hedge ผูกกับราคานั้นมาก (8.5)</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">คำนวณขนาดไม้ทองคำ (CFD 1 ล็อต = 100 ออนซ์)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">บัญชี 2,000 ดอลลาร์ เสี่ยง 1% = 20 ดอลลาร์ ตรวจขนาดสัญญาของโบรกเกอร์ก่อนเสมอ!</tspan></text><text x="48.0" y="116.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ล็อต</tspan></text><text x="200.0" y="116.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="200.0" dy="0.0">ออนซ์</tspan></text><text x="360.0" y="116.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">ขยับ 1 ดอลลาร์ =</tspan></text><text x="560.0" y="116.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="560.0" dy="0.0">Stop 5 ดอลลาร์ =</tspan></text><text x="750.0" y="116.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="750.0" dy="0.0">Stop 15 ดอลลาร์ =</tspan></text><rect x="28.0" y="130.0" width="904.0" height="48.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="161.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1.00</tspan></text><text x="200.0" y="161.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="200.0" dy="0.0">100</tspan></text><text x="360.0" y="161.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">100 USD</tspan></text><text x="560.0" y="161.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="560.0" dy="0.0">500 USD</tspan></text><text x="750.0" y="161.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="750.0" dy="0.0">1,500 USD</tspan></text><rect x="28.0" y="188.0" width="904.0" height="48.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="219.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">0.10</tspan></text><text x="200.0" y="219.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="200.0" dy="0.0">10</tspan></text><text x="360.0" y="219.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">10 USD</tspan></text><text x="560.0" y="219.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="560.0" dy="0.0">50 USD</tspan></text><text x="750.0" y="219.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="750.0" dy="0.0">150 USD</tspan></text><rect x="28.0" y="246.0" width="904.0" height="48.0" rx="10" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/><text x="48.0" y="277.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">0.04</tspan></text><text x="200.0" y="277.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="200.0" dy="0.0">4</tspan></text><text x="360.0" y="277.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="360.0" dy="0.0">4 USD</tspan></text><text x="560.0" y="277.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="560.0" dy="0.0">20 USD</tspan></text><text x="750.0" y="277.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="750.0" dy="0.0">60 USD</tspan></text><rect x="28.0" y="304.0" width="904.0" height="48.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="3
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a5b6b88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b88"/></marker></defs><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How a short sale works (shares)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Example: 100 shares, sold at 50, bought back at 40 (illustrative).</tspan></text><rect x="40.0" y="130.0" width="200.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="2"/><text x="140.0" y="165.0" font-size="17" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1 · Borrow</tspan></text><text x="140.0" y="200.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="140.0" dy="0.0">Your broker borrows</tspan><tspan x="140.0" dy="17.6">100 shares for you</tspan></text><line x1="244.0" y1="195.0" x2="264.0" y2="195.0" stroke="#5b6b88" stroke-width="2" marker-end="url(#a5b6b88)"/><rect x="268.0" y="130.0" width="200.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="368.0" y="165.0" font-size="17" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="368.0" dy="0.0">2 · Sell</tspan></text><text x="368.0" y="200.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="368.0" dy="0.0">Sell them at 50:</tspan><tspan x="368.0" dy="17.6">+5,000 in cash</tspan></text><line x1="472.0" y1="195.0" x2="492.0" y2="195.0" stroke="#5b6b88" stroke-width="2" marker-end="url(#a5b6b88)"/><rect x="496.0" y="130.0" width="200.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="2"/><text x="596.0" y="165.0" font-size="17" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">3 · Buy back</tspan></text><text x="596.0" y="200.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">Later buy 100</tspan><tspan x="596.0" dy="17.6">at 40: −4,000</tspan></text><line x1="700.0" y1="195.0" x2="720.0" y2="195.0" stroke="#5b6b88" stroke-width="2" marker-end="url(#a5b6b88)"/><rect x="724.0" y="130.0" width="200.0" height="130.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="824.0" y="165.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="824.0" dy="0.0">4 · Return</tspan></text><text x="824.0" y="200.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="824.0" dy="0.0">Give the shares back.</tspan><tspan x="824.0" dy="17.6">Keep 1,000 − fees</tspan></text><text x="40.0" y="310.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">While the short is open you pay: a borrow fee (e.g. 0.30% a year → 5,000 × 0.003 × 30/360 = 1.25 for 30 days),</tspan></text><text x="40.0" y="334.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">and any dividend (0.50 per share × 100 = 50). A hard-to-borrow stock at 50% a year would cost 208.33 for the same 30 days.</tspan></text><text x="40.0" y="378.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">If the price rises instead, you must buy back higher: the loss has no ceiling.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="340" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">สี่วันสำคัญของเงินปันผล</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">เพื่อได้รับปันผล คุณต้องถือหุ้นก่อนวันที่ไม่มีสิทธิรับปันผล (XD ในไทย)</tspan></text><rect x="28.0" y="92.0" width="904.0" height="228.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="70.0" y1="170.0" x2="890.0" y2="170.0" stroke="#23314f" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="130.0" cy="170.0" r="9" fill="#3b82f6"/><text x="130.0" y="140.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">วันประกาศ</tspan></text><text x="130.0" y="206.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="130.0" dy="0.0">คณะกรรมการประกาศ</tspan><tspan x="130.0" dy="17.6">จำนวนและวันที่</tspan></text><circle cx="360.0" cy="170.0" r="9" fill="#ef4444"/><text x="360.0" y="140.0" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">วัน XD</tspan></text><text x="360.0" y="206.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="360.0" dy="0.0">ซื้อในหรือหลังวันนี้:</tspan><tspan x="360.0" dy="17.6">ไม่ได้ปันผล ราคามักเปิด</tspan><tspan x="360.0" dy="17.6">ต่ำลงราวเท่าปันผล</tspan></text><circle cx="590.0" cy="170.0" r="9" fill="#f59e0b"/><text x="590.0" y="140.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">วันกำหนดรายชื่อ</tspan></text><text x="590.0" y="206.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="590.0" dy="0.0">บริษัทตรวจสอบ</tspan><tspan x="590.0" dy="17.6">รายชื่อผู้ถือหุ้น</tspan></text><circle cx="810.0" cy="170.0" r="9" fill="#22c55e"/><text x="810.0" y="140.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">วันจ่าย</tspan></text><text x="810.0" y="206.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="810.0" dy="0.0">เงินเข้า</tspan><tspan x="810.0" dy="17.6">หลังหักภาษี</tspan><tspan x="810.0" dy="17.6">ณ ที่จ่าย</tspan></text></svg>
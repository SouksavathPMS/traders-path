<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The one-page trading plan</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">If it doesn&#x27;t fit on one page, you won&#x27;t follow it when it matters.</tspan></text><rect x="28.0" y="92.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="102.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="50.0" y="122.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">1 · Why &amp; goals</tspan></text><text x="50.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">Process goals, not $ goals.</tspan><tspan x="50.0" dy="18.9">&quot;Follow the plan on 95% of trades.&quot;</tspan></text><rect x="488.0" y="92.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="102.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="510.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">2 · Markets &amp; timeframes</tspan></text><text x="510.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">e.g. 3 markets · Daily / 4H / 1H</tspan><tspan x="510.0" dy="18.9">Trading hours I am available</tspan></text><rect x="28.0" y="206.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="206.0" width="5.0" height="102.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="50.0" y="236.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">3 · Setups (A+ only)</tspan></text><text x="50.0" y="264.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">1–2 setups with screenshots:</tspan><tspan x="50.0" dy="18.9">what they look like, what they need</tspan></text><rect x="488.0" y="206.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="206.0" width="5.0" height="102.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="510.0" y="236.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">4 · Entry rules</tspan></text><text x="510.0" y="264.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">Checklist from Phase 2:</tspan><tspan x="510.0" dy="18.9">HTF bias · zone · LTF CHoCH · R:R ≥ 2</tspan></text><rect x="28.0" y="320.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="320.0" width="5.0" height="102.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="50.0" y="350.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">5 · Risk rules</tspan></text><text x="50.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">Risk 0.5–1% · max open 3R</tspan><tspan x="50.0" dy="18.9">Daily −2R · weekly −5R</tspan></text><rect x="488.0" y="320.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="320.0" width="5.0" height="102.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="510.0" y="350.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">6 · Exit rules</tspan></text><text x="510.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">Stop beyond structure + buffer</tspan><tspan x="510.0" dy="18.9">Target method A / B / C (3.5)</tspan></text><rect x="28.0" y="434.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="434.0" width="5.0" height="102.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="50.0" y="464.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">7 · Routine</tspan></text><text x="50.0" y="492.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">Before · during · after (4.4)</tspan><tspan x="50.0" dy="18.9">Journal every trade (4.5)</tspan></text><rect x="488.0" y="434.0" width="444.0" height="102.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="434.0" width="5.0" height="102.0" rx="2" fill="#8ea0bd" fill-opacity="1"/><text x="510.0" y="464.0" font-size="16" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">8 · Circuit breakers</tspan></text><text x="510.0" y="492.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">−5% → half risk · −10% → stop &amp; review</tspan><tspan x="510.0" dy="18.9">Tilt signs → walk away (4.6)</tspan></text></svg>
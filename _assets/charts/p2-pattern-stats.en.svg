="500.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Break-even failure = price fails to move at least 5% in the breakout direction. Measured without stops: not your expectancy.</tspan></text><text x="40.0" y="522.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">Double top = Adam &amp; Adam type; Eve &amp; Eve double tops fail 20%.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="540" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Who stands between you and the market</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Two ways your order can travel: through an exchange, or to a broker that IS the market.</tspan></text><text x="28.0" y="112.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">A · EXCHANGE MODEL  (stocks, futures, listed options, ETFs)</tspan></text><rect x="28.0" y="128.0" width="150.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#e5ecf6" stroke-width="1.5"/><text x="103.0" y="156.0" font-size="15" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="103.0" dy="0.0">You</tspan></text><text x="103.0" y="178.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="103.0" dy="0.0">app / platform</tspan></text><rect x="228.0" y="128.0" width="170.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="313.0" y="156.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="313.0" dy="0.0">Your broker</tspan></text><text x="313.0" y="178.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="313.0" dy="0.0">checks money,</tspan><tspan x="313.0" dy="16.2">sends the order</tspan></text><rect x="448.0" y="128.0" width="200.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="548.0" y="156.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="548.0" dy="0.0">Exchange</tspan></text><text x="548.0" y="178.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="548.0" dy="0.0">matching engine:</tspan><tspan x="548.0" dy="16.2">buyer meets seller</tspan></text><rect x="698.0" y="128.0" width="234.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#e5ecf6" stroke-width="1.5"/><text x="815.0" y="156.0" font-size="15" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Other brokers &amp; traders</tspan></text><text x="815.0" y="178.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="815.0" dy="0.0">millions of orders</tspan></text><line x1="180.0" y1="165.0" x2="224.0" y2="165.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><line x1="400.0" y1="165.0" x2="444.0" y2="165.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><line x1="696.0" y1="165.0" x2="652.0" y2="165.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="448.0" y="238.0" width="200.0" height="70.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="548.0" y="266.0" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="548.0" dy="0.0">Clearing house</tspan></text><text x="548.0" y="288.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="548.0" dy="0.0">guarantees both sides pay</tspan></text><rect x="228.0" y="238.0" width="170.0" height="70.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="313.0" y="266.0" font-size="15" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="313.0" dy="0.0">Custodian</tspan></text><text x="313.0" y="288.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="313.0" dy="0.0">holds your shares</tspan><tspan x="313.0" dy="16.2">in your name</tspan></text><line x1="548.0" y1="204.0" x2="548.0" y2="236.0" stroke="#8ea0bd" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a8ea0bd)"/><line x1="446.0" y1="273.0" x2="400.0" y2="273.0" stroke="#8ea0bd" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a8ea0bd)"/><text x="698.0" y="262.0" font-size="13" fill="#22c55e" text-anchor="start" font-weight="400"><tspan x="698.0" dy="0.0">✓ One public price for everyone</tspan><tspan x="698.0" dy="17.6">✓ Your assets kept separately</tspan><tspan x="698.0" dy="17.6">✓ Strong regulation</tspan></text><line x1="28.0" y1="336.0" x2="932.0" y2="336.0" stroke="#23314f" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="28.0" y="370.0" font-size="13" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">B · OTC / CFD MODEL  (most retail forex, gold, crypto CFDs)</tspan></text><rect x="28.0" y="388.0" width="150.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#e5ecf6" stroke-width="1.5"/><text x="103.0" y="416.0" font-size="15" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="103.0" dy="0.0">You</tspan></text><text x="103.0" y="438.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="103.0" dy="0.0">app / platform</tspan></text><rect x="228.0" y="388.0" width="220.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ec4899" stroke-width="1.5"/><text x="338.0" y="416.0" font-size="15" fill="#ec4899" text-anchor="middle" font-weight="700"><tspan x="338.0" dy="0.0">Broker = your counterparty</tspan></text><text x="338.0" y="438.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="338.0" dy="0.0">quotes its own price;</tspan><tspan x="338.0" dy="16.2">may keep or pass on your trade</tspan></text><rect x="498.0" y="388.0" width="200.0" height="74.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="598.0" y="416.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="598.0" dy="0.0">Liquidity providers</tspan></text><text x="598.0" y="438.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="598.0" dy="0.0">banks, big market makers</tspan></text><line x1="180.0" y1="425.0" x2="224.0" y2="425.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><line x1="450.0" y1="425.0" x2="494.0" y2="425.0" stroke="#8ea0bd" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a8ea0bd)"/><text x="472.0" y="484.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="472.0" dy="0.0">only if the broker hedges</tspan></text><text x="712.0" y="410.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="400"><tspan x="712.0" dy="0.0">✗ Price set by the broker</tspan><tspan x="712.0" dy="17.6">✗ Your loss can be its profit</tspan><tspan x="712.0" dy="17.6">✗ Protection depends on the</tspan><tspan x="712.0" dy="17.6">   regulator — check it!</tspan></text><text x="28.0" y="520.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="28.0" dy="0.0">Neither model is &#x27;bad&#x27;. B is how almost all retail forex &amp; gold trading works — the broker&#x27;s licence is what protects you.</tspan></text></svg>
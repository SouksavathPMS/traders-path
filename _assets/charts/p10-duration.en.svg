<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Duration: how much a bond falls when yields rise</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Rule of thumb: price change ≈ −duration × yield change. Here yields rise by 0.5 percentage points.</tspan></text><text x="48.0" y="150.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">2-year bond</tspan></text><text x="48.0" y="172.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">duration ≈ 2</tspan></text><rect x="300.0" y="130.0" width="50.0" height="40.0" rx="5" fill="#14b8a6" fill-opacity="0.8"/><text x="362.0" y="156.0" font-size="18" fill="#14b8a6" text-anchor="start" font-weight="800"><tspan x="362.0" dy="0.0">≈ −1%</tspan></text><text x="48.0" y="230.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">10-year bond</tspan></text><text x="48.0" y="252.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">duration ≈ 8</tspan></text><rect x="300.0" y="210.0" width="200.0" height="40.0" rx="5" fill="#f59e0b" fill-opacity="0.8"/><text x="512.0" y="236.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="800"><tspan x="512.0" dy="0.0">≈ −4%</tspan></text><text x="48.0" y="310.0" font-size="16" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">30-year bond</tspan></text><text x="48.0" y="332.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">duration ≈ 17</tspan></text><rect x="300.0" y="290.0" width="425.0" height="40.0" rx="5" fill="#ef4444" fill-opacity="0.8"/><text x="737.0" y="316.0" font-size="18" fill="#ef4444" text-anchor="start" font-weight="800"><tspan x="737.0" dy="0.0">≈ −8.5%</tspan></text><rect x="28.0" y="370.0" width="904.0" height="50.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="400.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Long-duration assets (long bonds, growth stocks) are the most sensitive to interest rates.</tspan></text></svg>
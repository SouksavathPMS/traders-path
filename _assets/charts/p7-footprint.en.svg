ill="#f59e0b" fill-opacity="1"/><text x="670.0" y="122.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">Delta</tspan></text><text x="670.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">Δ = market buys − market sells.</tspan><tspan x="670.0" dy="17.6">Positive: buyers more aggressive.</tspan><tspan x="670.0" dy="17.6">Candle 3: big negative Δ at the</tspan><tspan x="670.0" dy="17.6">top → sellers stepped in.</tspan></text><rect x="650.0" y="256.0" width="282.0" height="150.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="650.0" y="256.0" width="5.0" height="150.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="670.0" y="286.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">Diagonal imbalance</tspan></text><text x="670.0" y="314.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">Compare ask at a price with</tspan><tspan x="670.0" dy="17.6">bid one tick lower. ≥ 3× =</tspan><tspan x="670.0" dy="17.6">imbalance (boxed). Stacked</tspan><tspan x="670.0" dy="17.6">imbalances = strong initiative.</tspan></text><rect x="650.0" y="420.0" width="282.0" height="150.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="650.0" y="420.0" width="5.0" height="150.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="670.0" y="450.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="670.0" dy="0.0">Read the story</tspan></text><text x="670.0" y="478.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="670.0" dy="0.0">1–2: buyers lift offers.</tspan><tspan x="670.0" dy="17.6">3: buyers stop, sellers hit</tspan><tspan x="670.0" dy="17.6">bids at the high → turn?</tspan></text></svg>
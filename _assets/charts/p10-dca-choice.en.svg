<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="340" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Which one fits your situation?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">The maths favours investing sooner; your behaviour decides what you can stick with.</tspan></text><rect x="28.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="126.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Monthly salary</tspan></text><text x="48.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">You invest as money</tspan><tspan x="48.0" dy="20.2">arrives. That is DCA</tspan><tspan x="48.0" dy="20.2">by default, and it&#x27;s</tspan><tspan x="48.0" dy="20.2">the right habit.</tspan><tspan x="48.0" dy="20.2"></tspan><tspan x="48.0" dy="20.2">Automate it on</tspan><tspan x="48.0" dy="20.2">payday.</tspan></text><rect x="335.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="335.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="355.0" y="126.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="355.0" dy="0.0">A lump sum, calm</tspan></text><text x="355.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="355.0" dy="0.0">Investing it all now</tspan><tspan x="355.0" dy="20.2">has won most of the</tspan><tspan x="355.0" dy="20.2">time historically,</tspan><tspan x="355.0" dy="20.2">because markets</tspan><tspan x="355.0" dy="20.2">rise more often</tspan><tspan x="355.0" dy="20.2">than they fall.</tspan></text><rect x="642.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="642.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="662.0" y="126.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">A lump sum, nervous</tspan></text><text x="662.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">If a fall right after</tspan><tspan x="662.0" dy="20.2">investing would make</tspan><tspan x="662.0" dy="20.2">you sell, DCA over</tspan><tspan x="662.0" dy="20.2">6–12 months with a</tspan><tspan x="662.0" dy="20.2">written schedule.</tspan><tspan x="662.0" dy="20.2">It costs a little on</tspan><tspan x="662.0" dy="20.2">average; panic</tspan><tspan x="662.0" dy="20.2">costs more.</tspan></text></svg>
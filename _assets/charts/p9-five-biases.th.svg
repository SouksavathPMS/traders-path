<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ห้าวิธีที่ Backtest โกหก เล่าเป็นเรื่องสั้น</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">แต่ละแบบทำให้อดีตดูดีกว่าอนาคตที่จะเป็น</tspan></text><rect x="28.0" y="96.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="6.0" height="72.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="52.0" y="138.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Look-ahead</tspan></text><text x="300.0" y="126.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">ซื้อตอนเปิดโดยใช้ราคาปิดของวันนั้น</tspan><tspan x="300.0" dy="17.6">รู้อนาคต → ทำจริงไม่ได้</tspan></text><rect x="28.0" y="178.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="178.0" width="6.0" height="72.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="52.0" y="220.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Survivorship</tspan></text><text x="300.0" y="208.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">ทดสอบเฉพาะหุ้นที่อยู่ในดัชนีวันนี้</tspan><tspan x="300.0" dy="17.6">บริษัทที่เจ๊งไปแล้วหายไปจากข้อมูล</tspan></text><rect x="28.0" y="260.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="260.0" width="6.0" height="72.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="52.0" y="302.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Overfitting</tspan></text><text x="300.0" y="290.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">ปรับ 6 ค่าจนอดีตสมบูรณ์แบบ</tspan><tspan x="300.0" dy="17.6">จับคู่กับสัญญาณรบกวน พังกับข้อมูลใหม่</tspan></text><rect x="28.0" y="342.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="342.0" width="6.0" height="72.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="52.0" y="384.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">Data snooping</tspan></text><text x="300.0" y="372.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">ลอง 200 ไอเดีย โชว์ตัวที่ดีที่สุด</tspan><tspan x="300.0" dy="17.6">แค่โชคก็ทำให้บางตัวดูดีมากแล้ว</tspan></text><rect x="28.0" y="424.0" width="904.0" height="72.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="424.0" width="6.0" height="72.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="52.0" y="466.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">ไม่คิดต้นทุน</tspan></text><text x="300.0" y="454.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="300.0" dy="0.0">เทรด 200 ไม้ต่อปี ไม่คิด Spread หรือค่าคอม</tspan><tspan x="300.0" dy="17.6">+20% บนกระดาษกลายเป็น −5% ในของจริง</tspan></text></svg>
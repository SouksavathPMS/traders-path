<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="a3b82f6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="aa855f7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/></marker></defs><rect width="960" height="380" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How a REIT works</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Many investors pool money to own rent-paying property; most of the profit must be paid out.</tspan></text><rect x="40.0" y="130.0" width="220.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="150.0" y="175.0" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">You + other</tspan><tspan x="150.0" dy="21.6">investors</tspan></text><rect x="370.0" y="130.0" width="220.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="480.0" y="175.0" font-size="16" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">REIT</tspan><tspan x="480.0" dy="21.6">(listed trust)</tspan></text><rect x="700.0" y="130.0" width="220.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="810.0" y="175.0" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Malls, offices,</tspan><tspan x="810.0" dy="21.6">warehouses,</tspan><tspan x="810.0" dy="21.6">hotels, towers</tspan></text><line x1="265.0" y1="165.0" x2="365.0" y2="165.0" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#a3b82f6)"/><text x="315.0" y="155.0" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="400"><tspan x="315.0" dy="0.0">money</tspan></text><line x1="595.0" y1="165.0" x2="695.0" y2="165.0" stroke="#a855f7" stroke-width="2.5" marker-end="url(#aa855f7)"/><text x="645.0" y="155.0" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="400"><tspan x="645.0" dy="0.0">buys</tspan></text><line x1="695.0" y1="220.0" x2="595.0" y2="220.0" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a22c55e)"/><text x="645.0" y="240.0" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="400"><tspan x="645.0" dy="0.0">rent</tspan></text><line x1="365.0" y1="220.0" x2="265.0" y2="220.0" stroke="#22c55e" stroke-width="2.5" marker-end="url(#a22c55e)"/><text x="315.0" y="240.0" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">≥ 90% paid out</tspan></text><text x="40.0" y="300.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">• You can buy and sell units on the exchange like a share.</tspan><tspan x="40.0" dy="20.2">• Income comes from rent; value moves with rents, occupancy and interest rates.</tspan><tspan x="40.0" dy="20.2">• US REITs and Thai REITs must pay out at least 90% of their (taxable or adjusted net) profit.</tspan></text></svg>
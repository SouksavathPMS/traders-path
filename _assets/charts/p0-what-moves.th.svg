<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อะไรขยับแต่ละตลาด</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ข่าวเดียวกัน ปฏิกิริยาต่างกัน รู้ตัวขับเคลื่อนหลักของตลาดที่คุณเทรด</tspan></text><rect x="28.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="18" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ฟอเร็กซ์</tspan></text><text x="48.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">ส่วนต่างดอกเบี้ยระหว่างประเทศ</tspan><tspan x="48.0" dy="17.6">สุนทรพจน์ธนาคารกลาง CPI</tspan><tspan x="48.0" dy="17.6">การจ้างงาน GDP การค้า</tspan><tspan x="48.0" dy="17.6">อารมณ์ความเสี่ยง</tspan></text><rect x="258.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="258.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="278.0" y="126.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="278.0" dy="0.0">ทองคำ</tspan></text><text x="278.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="278.0" dy="0.0">ดอกเบี้ยที่แท้จริง (↓ = ทอง ↑)</tspan><tspan x="278.0" dy="17.6">ดอลลาร์ (↓ = ทอง ↑) ความกลัว</tspan><tspan x="278.0" dy="17.6">สงคราม ธนาคารกลางซื้อทอง</tspan><tspan x="278.0" dy="17.6">ความกังวลเงินเฟ้อ</tspan></text><rect x="488.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="508.0" y="126.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">หุ้นและดัชนี</tspan></text><text x="508.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">ผลประกอบการและประมาณการ</tspan><tspan x="508.0" dy="17.6">ดอกเบี้ย การเติบโตเศรษฐกิจ</tspan><tspan x="508.0" dy="17.6">ข่าวอุตสาหกรรม (AI ชิป)</tspan><tspan x="508.0" dy="17.6">งบบริษัทเทคใหญ่ การซื้อหุ้นคืน</tspan></text><rect x="718.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="718.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="738.0" y="126.0" font-size="18" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="738.0" dy="0.0">คริปโต</tspan></text><text x="738.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="738.0" dy="0.0">สภาพคล่องโลกและอารมณ์เสี่ยง</tspan><tspan x="738.0" dy="17.6">เงินไหลเข้า ETF ข่าวกฎหมาย</tspan><tspan x="738.0" dy="17.6">การล้างพอร์ตเลเวอเรจ</tspan><tspan x="738.0" dy="17.6">แฮ็ก / ล้มของแพลตฟอร์ม</tspan></text><rect x="28.0" y="286.0" width="904.0" height="156.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="316.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">ตัวอย่าง: เงินเฟ้อสหรัฐออกมา สูงกว่า คาด</tspan></text><rect x="48.0" y="338.0" width="128.0" height="64.0" rx="8" fill="#8ea0bd" fill-opacity="0.12" stroke="#8ea0bd" st
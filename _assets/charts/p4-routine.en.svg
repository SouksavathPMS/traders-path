<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">A daily routine: before, during, after</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Routines remove decisions. Fewer decisions = less room for emotion.</tspan></text><rect x="28.0" y="92.0" width="290.0" height="408.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="290.0" height="50.0" rx="12" fill="#3b82f6" fill-opacity="0.18"/><text x="173.0" y="124.0" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="173.0" dy="0.0">BEFORE · 20–30 min</tspan></text><circle cx="56.0" cy="167.0" r="12" fill="#3b82f6"/><text x="56.0" y="172.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56.0" dy="0.0">1</tspan></text><text x="78.0" y="172.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="78.0" dy="0.0">State check: sleep, mood, stress 1–5</tspan></text><circle cx="56.0" cy="231.0" r="12" fill="#3b82f6"/><text x="56.0" y="236.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56.0" dy="0.0">2</tspan></text><text x="78.0" y="236.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="78.0" dy="0.0">News &amp; event calendar (Phase 10)</tspan></text><circle cx="56.0" cy="295.0" r="12" fill="#3b82f6"/><text x="56.0" y="300.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56.0" dy="0.0">3</tspan></text><text x="78.0" y="300.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="78.0" dy="0.0">HTF state for each market</tspan></text><circle cx="56.0" cy="359.0" r="12" fill="#3b82f6"/><text x="56.0" y="364.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56.0" dy="0.0">4</tspan></text><text x="78.0" y="364.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="78.0" dy="0.0">Mark zones, set price alerts</tspan></text><circle cx="56.0" cy="423.0" r="12" fill="#3b82f6"/><text x="56.0" y="428.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56.0" dy="0.0">5</tspan></text><text x="78.0" y="428.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="78.0" dy="0.0">Write today&#x27;s if-then plan</tspan></text><line x1="320.0" y1="300.0" x2="334.0" y2="300.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="336.0" y="92.0" width="290.0" height="408.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="92.0" width="290.0" height="50.0" rx="12" fill="#22c55e" fill-opacity="0.18"/><text x="481.0" y="124.0" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="481.0" dy="0.0">DURING · on alert</tspan></text><circle cx="364.0" cy="167.0" r="12" fill="#22c55e"/><text x="364.0" y="172.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">1</tspan></text><text x="386.0" y="172.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="386.0" dy="0.0">Alert fires → open LTF</tspan></text><circle cx="364.0" cy="231.0" r="12" fill="#22c55e"/><text x="364.0" y="236.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">2</tspan></text><text x="386.0" y="236.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="386.0" dy="0.0">Run the if-then checklist</tspan></text><circle cx="364.0" cy="295.0" r="12" fill="#22c55e"/><text x="364.0" y="300.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">3</tspan></text><text x="386.0" y="300.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="386.0" dy="0.0">Size → enter → stop in market</tspan></text><circle cx="364.0" cy="359.0" r="12" fill="#22c55e"/><text x="364.0" y="364.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">4</tspan></text><text x="386.0" y="364.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="386.0" dy="0.0">Manage by the plan only</tspan></text><circle cx="364.0" cy="423.0" r="12" fill="#22c55e"/><text x="364.0" y="428.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">5</tspan></text><text x="386.0" y="428.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="386.0" dy="0.0">No alert = no screen</tspan></text><line x1="628.0" y1="300.0" x2="642.0" y2="300.0" stroke="#8ea0bd" stroke-width="2.5" marker-end="url(#a8ea0bd)"/><rect x="644.0" y="92.0" width="290.0" height="408.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="92.0" width="290.0" height="50.0" rx="12" fill="#a855f7" fill-opacity="0.18"/><text x="789.0" y="124.0" font-size="16" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="789.0" dy="0.0">AFTER · 15 min</tspan></text><circle cx="672.0" cy="167.0" r="12" fill="#a855f7"/><text x="672.0" y="172.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">1</tspan></text><text x="694.0" y="172.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="694.0" dy="0.0">Journal every trade + screenshot</tspan></text><circle cx="672.0" cy="231.0" r="12" fill="#a855f7"/><text x="672.0" y="236.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">2</tspan></text><text x="694.0" y="236.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="694.0" dy="0.0">Grade execution A / B / C</tspan></text><circle cx="672.0" cy="295.0" r="12" fill="#a855f7"/><text x="672.0" y="300.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">3</tspan></text><text x="694.0" y="300.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="694.0" dy="0.0">Note emotions at entry &amp; exit</tspan></text><circle cx="672.0" cy="359.0" r="12" fill="#a855f7"/><text x="672.0" y="364.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">4</tspan></text><text x="694.0" y="364.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="694.0" dy="0.0">Update equity peak &amp; drawdown</tspan></text><circle cx="672.0" cy="423.0" r="12" fill="#a855f7"/><text x="672.0" y="428.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="672.0" dy="0.0">5</tspan></text><text x="694.0" y="428.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="694.0" dy="0.0">Close the platform. Done.</tspan></text></svg>
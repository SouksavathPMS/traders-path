<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="400" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Four ways to own US stocks from Thailand</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Each route has different costs, tax paperwork and protection. Compare total cost, not just commission.</tspan></text><rect x="28.0" y="92.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="132.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · Thai broker, foreign-stock account</tspan></text><text x="48.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">+ Thai regulator (SEC), Thai support</tspan><tspan x="48.0" dy="18.9">− FX spread and higher commissions</tspan><tspan x="48.0" dy="18.9">− you handle foreign-income tax</tspan></text><rect x="488.0" y="92.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="132.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="508.0" y="122.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">2 · Overseas broker</tspan></text><text x="508.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">+ low commissions, many markets</tspan><tspan x="508.0" dy="18.9">− foreign regulator; disputes are hard</tspan><tspan x="508.0" dy="18.9">− you handle forms (W-8BEN) and tax</tspan></text><rect x="28.0" y="234.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="234.0" width="5.0" height="132.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="264.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">3 · DRs on the SET</tspan></text><text x="48.0" y="292.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">+ buy in baht through a normal account</tspan><tspan x="48.0" dy="18.9">− only some stocks; small premium or</tspan><tspan x="48.0" dy="18.9">  discount to the real share possible</tspan></text><rect x="488.0" y="234.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="234.0" width="5.0" height="132.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="508.0" y="264.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">4 · Thai fund (feeder / index fund)</tspan></text><text x="508.0" y="292.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">+ easy, small amounts, some tax-saving</tspan><tspan x="508.0" dy="18.9">− two layers of fees (Thai + foreign fund)</tspan><tspan x="508.0" dy="18.9">− check the fund&#x27;s currency hedge</tspan></text><text x="40.0" y="388.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">Lao residents: routes 2 and 4 depend on your bank and broker; check foreign-exchange rules with your bank first.</tspan></text></svg>
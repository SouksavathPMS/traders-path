<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Screener คือกรวย: ทุกตัวกรองตัดหุ้นออก</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวอย่างสมมติ 10 หุ้น Screener หาหุ้นที่ควรศึกษา ไม่ใช่หุ้นที่ต้องซื้อ</tspan></text><rect x="170.0" y="100.0" width="560.0" height="52.0" rx="10" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.5"/><text x="450.0" y="133.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">10</tspan></text><text x="40.0" y="124.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">หุ้นทั้งหมดในรายการ</tspan></text><text x="40.0" y="144.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">A B C D E F G H I J</tspan></text><rect x="226.0" y="170.0" width="448.0" height="52.0" rx="10" fill="#14b8a6" fill-opacity="0.28" stroke="#14b8a6" stroke-width="1.5"/><text x="450.0" y="203.0" font-size="22" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">8</tspan></text><text x="40.0" y="194.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">มูลค่าตลาด ≥ 2 หมื่นล้านบาท</tspan></text><text x="40.0" y="214.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">A B D E G H I J</tspan></text><rect x="226.0" y="240.0" width="448.0" height="52.0" rx="10" fill="#a855f7" fill-opacity="0.28" stroke="#a855f7" stroke-width="1.5"/><text x="450.0" y="273.0" font-size="22" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">8</tspan></text><text x="40.0" y="264.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">ซื้อขาย ≥ 50 ล้านบาท/วัน</tspan></text><text x="40.0" y="284.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">A B D E G H I J</tspan></text><rect x="254.0" y="310.0" width="392.0" height="52.0" rx="10" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-width="1.5"/><text x="450.0" y="343.0" font-size="22" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">7</tspan></text><text x="40.0" y="334.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">P/E ≤ 20</tspan></text><text x="40.0" y="354.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">A B E G H I J</tspan></text><rect x="310.0" y="380.0" width="280.0" height="52.0" rx="10" fill="#22c55e" fill-opacity="0.28" stroke="#22c55e" stroke-width="1.5"/><text x="450.0" y="413.0" font-size="22" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">5</tspan></text><text x="40.0" y="404.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">ราคาอยู่เหนือค่าเฉลี่ย 200 วัน</tspan></text><text x="40.0" y="424.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">A E H I J</tspan></text><text x="40.0" y="460.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">หมายเหตุ: ตัวกรองสภาพคล่องไม่ได้ตัดหุ้นเพิ่ม เพราะตัวกรองขนาดตัดหุ้นเล็กที่ซื้อขายน้อยสองตัวออกไปแล้ว</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ค่าคาดหวังก่อนเทรด: เหรียญ ลูกเต๋า แล้วจึงเป็นไม้เทรด</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">EV = Σ ความน่าจะเป็น × ผลลัพธ์ มีแค่ค่าเฉลี่ยจากการทำซ้ำหลายครั้งที่สำคัญ</tspan></text><rect x="28.0" y="96.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="136.0" y="128.0" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">เกมโยนเหรียญ</tspan></text><text x="136.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">หัว: +2</tspan><tspan x="136.0" dy="18.9">ก้อย: −1</tspan></text><text x="136.0" y="250.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="136.0" dy="0.0">0.5 × 2 − 0.5 × 1</tspan></text><text x="136.0" y="310.0" font-size="22" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="136.0" dy="0.0">EV = +0.50</tspan></text><text x="136.0" y="350.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="136.0" dy="0.0">เดิมพันที่ดี</tspan></text><rect x="258.0" y="96.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#8ea0bd" stroke-width="1.5"/><text x="366.0" y="128.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">เกมลูกเต๋า</tspan></text><text x="366.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">ออกหก: +5</tspan><tspan x="366.0" dy="18.9">อย่างอื่น: −1</tspan></text><text x="366.0" y="250.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="366.0" dy="0.0">1/6 × 5 − 5/6 × 1</tspan></text><text x="366.0" y="310.0" font-size="22" fill="#8ea0bd" text-anchor="middle" font-weight="800"><tspan x="366.0" dy="0.0">EV = 0.00</tspan></text><text x="366.0" y="350.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="366.0" dy="0.0">ไม่มีประโยชน์</tspan></text><rect x="488.0" y="96.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="596.0" y="128.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">ไม้เทรด ไม่มีต้นทุน</tspan></text><text x="596.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">ชนะ 45%: +2R</tspan><tspan x="596.0" dy="18.9">แพ้ 55%: −1R</tspan></text><text x="596.0" y="250.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="596.0" dy="0.0">0.45 × 2 − 0.55 × 1</tspan></text><text x="596.0" y="310.0" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="596.0" dy="0.0">EV = +0.35R</tspan></text><text x="596.0" y="350.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="596.0" dy="0.0">เดิมพันที่ดี</tspan></text><rect x="718.0" y="96.0" width="216.0" height="320.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="826.0" y="128.0" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">ไม้เดิม Stop 10 pip</tspan></text><text x="826.0" y="168.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">ต้นทุน 1.9 pip</tspan><tspan x="826.0" dy="18.9">= 0.19R ต่อไม้</tspan></text><text x="826.0" y="250.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="826.0" dy="0.0">0.35 − 0.19</tspan></text><text x="826.0" y="310.0" font-size="22" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="826.0" dy="0.0">EV = +0.16R</tspan></text><text x="826.0" y="350.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="600"><tspan x="826.0" dy="0.0">ต้นทุนกินไปครึ่ง</tspan></text></svg>
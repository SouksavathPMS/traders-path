ht="64.0" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><text x="852.0" y="364.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="852.0" dy="0.0">Bitcoin ↓</tspan></text><text x="48.0" y="426.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Typical first reaction, not a rule — positioning and other news can change it.</tspan></text></svg>
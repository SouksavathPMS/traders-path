<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">What moves each market</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Same news, different reactions. Learn the main driver of the market you trade.</tspan></text><rect x="28.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="126.0" font-size="18" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Forex</tspan></text><text x="48.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Interest-rate differences</tspan><tspan x="48.0" dy="17.6">between countries, central</tspan><tspan x="48.0" dy="17.6">bank speeches, CPI, jobs,</tspan><tspan x="48.0" dy="17.6">GDP, trade, risk mood</tspan></text><rect x="258.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="258.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="278.0" y="126.0" font-size="18" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="278.0" dy="0.0">Gold</tspan></text><text x="278.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="278.0" dy="0.0">Real interest rates (↓ = gold ↑),</tspan><tspan x="278.0" dy="17.6">US dollar (↓ = gold ↑), fear &amp;</tspan><tspan x="278.0" dy="17.6">wars, central-bank buying,</tspan><tspan x="278.0" dy="17.6">inflation worries</tspan></text><rect x="488.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="508.0" y="126.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Stocks &amp; indices</tspan></text><text x="508.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">Earnings &amp; guidance, interest</tspan><tspan x="508.0" dy="17.6">rates, economic growth, sector</tspan><tspan x="508.0" dy="17.6">news (AI, chips), big-tech</tspan><tspan x="508.0" dy="17.6">results, buybacks</tspan></text><rect x="718.0" y="96.0" width="216.0" height="170.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="718.0" y="96.0" width="5.0" height="170.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="738.0" y="126.0" font-size="18" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="738.0" dy="0.0">Crypto</tspan></text><text x="738.0" y="156.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="738.0" dy="0.0">Global liquidity &amp; risk mood,</tspan><tspan x="738.0" dy="17.6">ETF flows, regulation news,</tspan><tspan x="738.0" dy="17.6">leverage liquidations,</tspan><tspan x="738.0" dy="17.6">exchange hacks / failures</tspan></text><rect x="28.0" y="286.0" width="904.0" height="156.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="316.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Example: US inflation comes in HOTTER than forecast</tspan></text><rect x="48.0" y="338.0" width="128.0" height="6
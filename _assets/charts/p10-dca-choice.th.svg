<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="340" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">แบบไหนเหมาะกับสถานการณ์ของคุณ?</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">คณิตศาสตร์เอียงไปทางลงทุนเร็ว แต่พฤติกรรมของคุณตัดสินว่าทำได้จริงแบบไหน</tspan></text><rect x="28.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="126.0" font-size="17" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">เงินเดือนรายเดือน</tspan></text><text x="48.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">คุณลงทุนเมื่อเงินเข้า</tspan><tspan x="48.0" dy="20.2">นั่นคือ DCA โดยธรรมชาติ</tspan><tspan x="48.0" dy="20.2">และเป็นนิสัยที่ถูกต้อง</tspan><tspan x="48.0" dy="20.2"></tspan><tspan x="48.0" dy="20.2">ตั้งให้ตัดอัตโนมัติ</tspan><tspan x="48.0" dy="20.2">ในวันเงินเดือนออก</tspan></text><rect x="335.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="335.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="355.0" y="126.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="355.0" dy="0.0">เงินก้อน ใจนิ่ง</tspan></text><text x="355.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="355.0" dy="0.0">ลงทุนทั้งหมดตอนนี้</tspan><tspan x="355.0" dy="20.2">ชนะเป็นส่วนใหญ่ในอดีต</tspan><tspan x="355.0" dy="20.2">เพราะตลาดขึ้นบ่อยกว่า</tspan><tspan x="355.0" dy="20.2">ลง</tspan></text><rect x="642.0" y="96.0" width="290.0" height="220.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="642.0" y="96.0" width="5.0" height="220.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="662.0" y="126.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">เงินก้อน ใจไม่นิ่ง</tspan></text><text x="662.0" y="155.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">ถ้าการร่วงหลังลงทุนทันที</tspan><tspan x="662.0" dy="20.2">จะทำให้คุณขาย ให้ DCA</tspan><tspan x="662.0" dy="20.2">ใน 6–12 เดือนตาม</tspan><tspan x="662.0" dy="20.2">ตารางที่เขียนไว้</tspan><tspan x="662.0" dy="20.2">โดยเฉลี่ยเสียเล็กน้อย</tspan><tspan x="662.0" dy="20.2">แต่การตื่นตระหนก</tspan><tspan x="662.0" dy="20.2">เสียมากกว่า</tspan></text></svg>
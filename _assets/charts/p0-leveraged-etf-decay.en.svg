<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Why leveraged ETFs decay in a choppy market</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">20 days: the index goes +5%, −5%, +5%, −5% … and ends almost flat. The 3× ETF does not.</tspan></text><line x1="90.0" y1="380.0" x2="720.0" y2="380.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="80.0" y="384.0" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="80.0" dy="0.0">60</tspan></text><line x1="90.0" y1="341.4" x2="720.0" y2="341.4" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="80.0" y="345.4" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="80.0" dy="0.0">70</tspan></text><line x1="90.0" y1="302.9" x2="720.0" y2="302.9" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="80.0" y="306.9" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="80.0" dy="0.0">80</tspan></text><line x1="90.0" y1="264.3" x2="720.0" y2="264.3" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="80.0" y="268.3" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="80.0" dy="0.0">90</tspan></text><line x1="90.0" y1="225.7" x2="720.0" y2="225.7" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="80.0" y="229.7" font-size="12" fill="#8ea0bd" text-anchor="end" font-weight="400"><tspan x="80.0" dy="0.0">100</tspan></text><line x1="90.0" y1="187.1" x2="720.0" y2="187.1" stroke="#1a25
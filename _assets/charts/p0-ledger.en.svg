"420.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">Bitcoin: the notebook only records bitcoin; max 21 million coins.  Ether: the notebook can also run programs (smart contracts).</tspan></text><text x="48.0" y="442.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Stablecoin: a token that promises 1 coin = 1 USD, backed by reserves held by a company.</tspan></text></svg>
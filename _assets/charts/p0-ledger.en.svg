<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">A blockchain = a village notebook everyone copies</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">No bank in the middle: thousands of computers keep the same list of who sent what to whom.</tspan></text><rect x="40.0" y="100.0" width="180.0" height="150.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="130.0" y="128.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Page 1</tspan></text><text x="62.0" y="162.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="62.0" dy="0.0">A → B  2</tspan></text><text x="62.0" y="188.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="62.0" dy="0.0">C → A  1</tspan></text><text x="130.0" y="236.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="130.0" dy="0.0">seal: links to page before</tspan></text><line x1="222.0" y1="175.0" x2="262.0" y2="175.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="265.0" y="100.0" width="180.0" height="150.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="355.0" y="128.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">Page 2</tspan></text><text x="287.0" y="162.0" font-size="14" fill="#e5ecf6" tex
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Static vs trailing loss limits</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Left: 100,000 account, static + daily floor. Right: 50,000 account, floor trails the best end-of-day balance.</tspan></text><rect x="28.0" y="96.0" width="442.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="126.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Static + daily (FTMO-style)</tspan></text><line x1="70.0" y1="403.0" x2="450.0" y2="403.0" stroke="#ef4444" stroke-width="2" stroke-opacity="1" stroke-dasharray="7 5" stroke-linecap="round"/><text x="448.0" y="397.0" font-size="12" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="448.0" dy="0.0">static floor 90,000</tspan></text><line x1="80.0" y1="335.5" x2="150.0" y2="335.5" stroke="#ec4899" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><line x1="150.0" y1="315.2" x2="220.0" y2="315.2" stroke="#ec4899" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><line x1="220.0" y1="295.0" x2="290.0" y2="295.0" stroke="#ec4899" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><line x1="290.0" y1="281.5" x2="360.0" y2="281.5" stroke="#ec4899" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><line x1="360.0" y1="305.8" x2="430.0" y2="305.8" stroke="#ec4899" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><text x="60.0" y="370.6" font-size="12" fill="#ec4899" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">pink = daily floor. Day 3 starts at 104,000 → floor 99,000</tspan></text><polyline points="80.0,268.0 150.0,247.8 220.0,227.5 290.0,214.0 360.0,238.3 430.0,203.2" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80.0" cy="268.0" r="4" fill="#3b82f6"/><circle cx="150.0" cy="247.8" r="4" fill="#3b82f6"/><circle cx="220.0" cy="227.5" r="4" fill="#3b82f6"/><circle cx="290.0" cy="214.0" r="4" fill="#3b82f6"/><circle cx="360.0" cy="238.3" r="4" fill="#3b82f6"/><circle cx="430.0" cy="203.2" r="4" fill="#3b82f6"/><text x="80.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="80.0" dy="0.0">d0</tspan></text><text x="150.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0.0">d1</tspan></text><text x="220.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="220.0" dy="0.0">d2</tspan></text><text x="290.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="290.0" dy="0.0">d3</tspan></text><text x="360.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="360.0" dy="0.0">d4</tspan></text><text x="430.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="430.0" dy="0.0">d5</tspan></text><rect x="490.0" y="96.0" width="442.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="510.0" y="126.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">End-of-day trailing (Topstep-style)</tspan></text><polyline points="540.0,405.5 610.0,380.9 680.0,380.9 750.0,346.5 820.0,307.3 890.0,307.3" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><polyline points="540.0,307.3 610.0,282.7 680.0,307.3 750.0,248.4 820.0,194.4 890.0,258.2" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="540.0" cy="307.3" r="4" fill="#3b82f6"/><text x="540.0" y="423.5" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="540.0" dy="0.0">48,000</tspan></text><circle cx="610.0" cy="282.7" r="4" fill="#3b82f6"/><text x="610.0" y="398.9" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="610.0" dy="0.0">48,500</tspan></text><circle cx="680.0" cy="307.3" r="4" fill="#3b82f6"/><text x="680.0" y="398.9" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="680.0" dy="0.0">48,500</tspan></text><circle cx="750.0" cy="248.4" r="4" fill="#3b82f6"/><text x="750.0" y="364.5" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="750.0" dy="0.0">49,200</tspan></text><circle cx="820.0" cy="194.4" r="4" fill="#3b82f6"/><text x="820.0" y="325.3" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="820.0" dy="0.0">50,000</tspan></text><circle cx="890.0" cy="258.2" r="4" fill="#3b82f6"/><text x="890.0" y="325.3" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="400"><tspan x="890.0" dy="0.0">50,000</tspan></text><text x="820.0" y="182.4" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">52,300</tspan></text><text x="850.0" y="277.3" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">floor locks at</tspan><tspan x="850.0" dy="16.2">50,000</tspan></text><text x="540.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="540.0" dy="0.0">d0</tspan></text><text x="610.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="610.0" dy="0.0">d1</tspan></text><text x="680.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="680.0" dy="0.0">d2</tspan></text><text x="750.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="750.0" dy="0.0">d3</tspan></text><text x="820.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="820.0" dy="0.0">d4</tspan></text><text x="890.0" y="452.0" font-size="11" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="890.0" dy="0.0">d5</tspan></text><text x="40.0" y="490.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">Profits raise a trailing floor but losses never lower it. Your real room to lose can shrink to almost nothing.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อคติ 6 อย่างที่ทำให้นักเทรดเสียเงิน</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ทุกคนมีอคติ เป้าหมายไม่ใช่ลบมันออก แต่สร้างกฎที่ดักจับมันไว้</tspan></text><rect x="28.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#ef4444" fill-opacity="1"/><text x="46.0" y="132.0" font-size="17" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">เกลียดการขาดทุน</tspan></text><text x="46.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">ขาดทุนเจ็บประมาณ 2 เท่า</tspan><tspan x="46.0" dy="18.9">ของความสุขจากกำไรเท่ากัน</tspan></text><text x="46.0" y="262.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="46.0" dy="0.0">แก้: คิดเป็น R ยอมรับ −1R ล่วงหน้า</tspan></text><rect x="336.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#f59e0b" fill-opacity="1"/><text x="354.0" y="132.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="354.0" dy="0.0">อคติยืนยันความเชื่อ</tspan></text><text x="354.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="354.0" dy="0.0">เห็นแต่หลักฐานที่</tspan><tspan x="354.0" dy="18.9">เข้าข้างสถานะของตัวเอง</tspan></text><text x="354.0" y="262.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="354.0" dy="0.0">แก้: เขียนว่าอะไรจะพิสูจน์ว่าคุณผิด</tspan></text><rect x="644.0" y="92.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="92.0" width="290.0" height="6.0" rx="3" fill="#3b82f6" fill-opacity="1"/><text x="662.0" y="132.0" font-size="17" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">อคติเหตุการณ์ล่าสุด</tspan></text><text x="662.0" y="166.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">3 เทรดล่าสุดรู้สึกเหมือน</tspan><tspan x="662.0" dy="18.9">ความจริงทั้งหมด</tspan></text><text x="662.0" y="262.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="600"><tspan x="662.0" dy="0.0">แก้: ตัดสินจาก 100+ ไม้ (3.4)</tspan></text><rect x="28.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#a855f7" fill-opacity="1"/><text x="46.0" y="360.0" font-size="17" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">มั่นใจเกินไป</tspan></text><text x="46.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">หลังชนะติดกัน</tspan><tspan x="46.0" dy="18.9">เพิ่มไม้และหย่อนกฎ</tspan></text><text x="46.0" y="490.0" font-size="13" fill="#a855f7" text-anchor="start" font-weight="600"><tspan x="46.0" dy="0.0">แก้: ความเสี่ยงคงที่ ไม่ได้ &#x27;ได้มา&#x27; จากการชนะ</tspan></text><rect x="336.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="336.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#14b8a6" fill-opacity="1"/><text x="354.0" y="360.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="354.0" dy="0.0">การยึดติดตัวเลข</tspan></text><text x="354.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="354.0" dy="0.0">&quot;เดือนก่อน 120</tspan><tspan x="354.0" dy="18.9">ตอนนี้ 95 ถือว่าถูก&quot;</tspan></text><text x="354.0" y="490.0" font-size="13" fill="#14b8a6" text-anchor="start" font-weight="600"><tspan x="354.0" dy="0.0">แก้: ดูโครงสร้าง ไม่ใช่ราคาเก่า</tspan></text><rect x="644.0" y="320.0" width="290.0" height="214.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="644.0" y="320.0" width="290.0" height="6.0" rx="3" fill="#ec4899" fill-opacity="1"/><text x="662.0" y="360.0" font-size="17" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="662.0" dy="0.0">ต้นทุนจม / Disposition</tspan></text><text x="662.0" y="394.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="662.0" dy="0.0">ขายไม้กำไรเร็ว ถือไม้ขาดทุน</tspan><tspan x="662.0" dy="18.9">เพราะ &#x27;ขาดทุนมากเกินจะขายแล้ว&#x27;</tspan></text><text x="662.0" y="490.0" font-size="13" fill="#ec4899" text-anchor="start" font-weight="600"><tspan x="662.0" dy="0.0">แก้: ตั้ง Stop และเป้าก่อนเข้า</tspan></text></svg>
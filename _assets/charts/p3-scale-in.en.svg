<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="460" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Scaling in without raising your risk</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Risk budget 100 USD (1R). Add only after the first part is in profit, and move the stop so the total worst case stays 1R.</tspan></text><rect x="40.0" y="100.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="100.0" width="5.0" height="92.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="60.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Step 1 · buy 50 at 100, stop 98</tspan></text><text x="60.0" y="158.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">worst case: 50 × (98 − 100) = −100 USD = −1R</tspan></text><rect x="40.0" y="210.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="210.0" width="5.0" height="92.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="60.0" y="240.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Step 2 · price 104: add 50 at 104, move ALL stops to 101</tspan></text><text x="60.0" y="268.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">worst case: 50 × (+1) + 50 × (−3) = +50 − 150 = −100 USD = −1R · average entry 102</tspan></text><rect x="40.0" y="320.0" width="880.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="40.0" y="320.0" width="5.0" height="92.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="60.0" y="350.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Step 3 · price reaches 110</tspan></text><text x="60.0" y="378.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="60.0" dy="0.0">50 × 10 + 50 × 6 = +800 USD = +8R  (one unit only: 50 × 10 = +500 USD = +5R)</tspan></text><text x="40.0" y="445.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">The add is paid for by the first unit&#x27;s open profit. If the trade had never moved in your favour, you would never have added.</tspan></text></svg>
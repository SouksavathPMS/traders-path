<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="400" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">สี่ทางในการถือหุ้นสหรัฐฯ จากประเทศไทย</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">แต่ละทางมีต้นทุน เอกสารภาษี และความคุ้มครองต่างกัน เทียบต้นทุนรวม ไม่ใช่แค่ค่าคอมมิชชัน</tspan></text><rect x="28.0" y="92.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="132.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">1 · โบรกเกอร์ไทย บัญชีหุ้นต่างประเทศ</tspan></text><text x="48.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">+ อยู่ใต้ ก.ล.ต. ไทย มีบริการภาษาไทย</tspan><tspan x="48.0" dy="18.9">− ส่วนต่างค่าเงินและค่าคอมสูงกว่า</tspan><tspan x="48.0" dy="18.9">− คุณจัดการภาษีเงินได้ต่างประเทศเอง</tspan></text><rect x="488.0" y="92.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="132.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="508.0" y="122.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">2 · โบรกเกอร์ต่างประเทศ</tspan></text><text x="508.0" y="150.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">+ ค่าคอมต่ำ หลายตลาด</tspan><tspan x="508.0" dy="18.9">− อยู่ใต้หน่วยงานต่างประเทศ ข้อพิพาทยาก</tspan><tspan x="508.0" dy="18.9">− คุณจัดการแบบฟอร์ม (W-8BEN) และภาษีเอง</tspan></text><rect x="28.0" y="234.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="234.0" width="5.0" height="132.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="264.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">3 · DR ใน SET</tspan></text><text x="48.0" y="292.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">+ ซื้อเป็นบาทผ่านบัญชีปกติ</tspan><tspan x="48.0" dy="18.9">− มีแค่บางตัว ราคาอาจสูงหรือต่ำกว่า</tspan><tspan x="48.0" dy="18.9">  หุ้นจริงเล็กน้อย</tspan></text><rect x="488.0" y="234.0" width="444.0" height="132.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="234.0" width="5.0" height="132.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="508.0" y="264.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">4 · กองทุนไทย (Feeder / กองทุนดัชนี)</tspan></text><text x="508.0" y="292.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">+ ง่าย ลงทุนน้อยได้ บางกองลดหย่อนภาษี</tspan><tspan x="508.0" dy="18.9">− ค่าธรรมเนียมสองชั้น (ไทย + กองต่างประเทศ)</tspan><tspan x="508.0" dy="18.9">− ตรวจการป้องกันความเสี่ยงค่าเงิน</tspan></text><text x="40.0" y="388.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">ผู้มีถิ่นที่อยู่ในลาว: ทาง 2 และ 4 ขึ้นกับธนาคารและโบรกเกอร์ของคุณ ตรวจกฎการแลกเปลี่ยนเงินตรากับธนาคารก่อน</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Intermarket relationships (typical, not fixed)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Relationships change with the regime, especially with inflation. Check, don&#x27;t assume.</tspan></text><rect x="28.0" y="92.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="92.0" width="5.0" height="120.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Stronger US dollar</tspan></text><text x="48.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ often weaker commodities (priced in $)</tspan><tspan x="48.0" dy="17.6">→ pressure on emerging markets incl. Thailand</tspan></text><rect x="488.0" y="92.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="92.0" width="5.0" height="120.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="508.0" y="122.0" font-size="16" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Higher real bond yields</tspan></text><text x="508.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ lower stock valuations, esp. growth stocks</tspan><tspan x="508.0" dy="17.6">→ often a stronger dollar</tspan></text><rect x="28.0" y="224.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="224.0" width="5.0" height="120.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="48.0" y="254.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Oil / commodities up</tspan></text><text x="48.0" y="282.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ inflation expectations up → yields up</tspan><tspan x="48.0" dy="17.6">→ helps energy stocks, hurts importers</tspan></text><rect x="488.0" y="224.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="224.0" width="5.0" height="120.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="508.0" y="254.0" font-size="16" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Gold</tspan></text><text x="508.0" y="282.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ often rises when real yields and the $ fall</tspan><tspan x="508.0" dy="17.6">→ a fear / currency-debasement hedge</tspan></text><rect x="28.0" y="356.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="356.0" width="5.0" height="120.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="48.0" y="386.0" font-size="16" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Stocks vs bonds</tspan></text><text x="48.0" y="414.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">→ low inflation: often move opposite (bonds hedge)</tspan><tspan x="48.0" dy="17.6">→ high inflation: can fall together (e.g. 2022)</tspan></text><rect x="488.0" y="356.0" width="444.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="356.0" width="5.0" height="120.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="508.0" y="386.0" font-size="16" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Risk-off shock</tspan></text><text x="508.0" y="414.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">→ stocks, EM, crypto down; $, yen, US bonds</tspan><tspan x="508.0" dy="17.6">   often bid (flight to safety)</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="420" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อ่านแท่งเทียนเป็นลำดับ ไม่ใช่ทีละแท่ง</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวแท่งใหญ่ขึ้น = โมเมนตัม  ตัวแท่งเล็กลง + ไส้ยาว = แรงส่งกำลังหมด</tspan></text><rect x="28.0" y="90.0" width="444.0" height="310.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="120.0" font-size="18" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">โมเมนตัม</tspan></text><line x1="64.7" y1="340.4" x2="64.7" y2="361.6" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="54.3" y="344.3" width="20.7" height="11.5" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="98.0" y1="325.1" x2="98.0" y2="348.1" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="87.7" y="327.0" width="20.7" height="17.3" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="131.3" y1="298.2" x2="131.3" y2="330.8" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="121.0" y="300.1" width="20.7" height="26.9" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="164.7" y1="257.9" x2="164.7" y2="302.0" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="154.3" y="259.8" width="20.7" height="40.3" rx="1.5" fill="#22c55e" fill-opacity="1"/><line x1="198.0" y1="206.0" x2="198.0" y2="261.7" stroke="#22c55e" stroke-width="1.6" stroke-opacity="1" stroke-linecap="round"/><rect x="187.7" y="209.9" width="20.7" height="49.9" rx="1.5" fill="#22c55e" fill-opacity="1"/
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="520" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The four emotions that move your mouse</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Name it, notice what it wants you to do, then do what the plan says instead.</tspan></text><rect x="28.0" y="92.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="48.0" y="126.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">FEAR</tspan></text><text x="148.0" y="126.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="148.0" dy="0.0">&quot;What if it goes against me?&quot;</tspan></text><text x="48.0" y="158.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Makes you:</tspan></text><text x="48.0" y="180.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Skip valid setups · exit winners early</tspan><tspan x="48.0" dy="18.9">· move stop to break-even too soon</tspan></text><rect x="42.0" y="232.0" width="416.0" height="42.0" rx="8" fill="#ef4444" fill-opacity="0.12"/><text x="54.0" y="259.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="54.0" dy="0.0">→ Risk small enough that a loss is boring.</tspan></text><rect x="488.0" y="92.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="508.0" y="126.0" font-size="20" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">GREED</tspan></text><text x="608.0" y="126.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="608.0" dy="0.0">&quot;This could be huge. Add more.&quot;</tspan></text><text x="508.0" y="158.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Makes you:</tspan></text><text x="508.0" y="180.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">Oversize · chase entries · remove</tspan><tspan x="508.0" dy="18.9">the target · overtrade</tspan></text><rect x="502.0" y="232.0" width="416.0" height="42.0" rx="8" fill="#f59e0b" fill-opacity="0.12"/><text x="514.0" y="259.0" font-size="14" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">→ Fixed risk per trade. Targets set before entry.</tspan></text><rect x="28.0" y="302.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="48.0" y="336.0" font-size="20" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">HOPE</tspan></text><text x="148.0" y="336.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="148.0" dy="0.0">&quot;It will come back.&quot;</tspan></text><text x="48.0" y="368.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Makes you:</tspan></text><text x="48.0" y="390.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Hold losers · widen stops · average</tspan><tspan x="48.0" dy="18.9">down into a losing trade</tspan></text><rect x="42.0" y="442.0" width="416.0" height="42.0" rx="8" fill="#3b82f6" fill-opacity="0.12"/><text x="54.0" y="469.0" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="54.0" dy="0.0">→ Hard stop in the market the moment you enter.</tspan></text><rect x="488.0" y="302.0" width="444.0" height="196.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="508.0" y="336.0" font-size="20" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">REGRET</tspan></text><text x="608.0" y="336.0" font-size="14" fill="#8ea0bd" text-anchor="start" font-weight="400" font-style="italic"><tspan x="608.0" dy="0.0">&quot;I should have…&quot;</tspan></text><text x="508.0" y="368.0" font-size="12" fill="#5b6b88" text-anchor="start" font-weight="700"><tspan x="508.0" dy="0.0">Makes you:</tspan></text><text x="508.0" y="390.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="508.0" dy="0.0">Revenge trades · chase the move</tspan><tspan x="508.0" dy="18.9">you missed · break rules to make it back</tspan></text><rect x="502.0" y="442.0" width="416.0" height="42.0" rx="8" fill="#a855f7" fill-opacity="0.12"/><text x="514.0" y="469.0" font-size="14" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">→ Missed trades cost 0R. Wait for the next one.</tspan></text></svg>
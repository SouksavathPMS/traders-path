<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">A real edge still has losing stretches</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Chance that a run of N trades ends below 0R, for a system with +0.35R per trade (45% wins at +2R). Exact binomial maths.</tspan></text><line x1="90.0" y1="350.0" x2="880.0" y2="350.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><rect x="120.0" y="154.9" width="90.0" height="195.1" rx="4" fill="#ef4444" fill-opacity="0.85"/><text x="165.0" y="144.9" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">26.6%</tspan></text><text x="165.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">10 trades</tspan></text><rect x="280.0" y="254.7" width="90.0" height="95.3" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="325.0" y="244.7" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">13.0%</tspan></text><text x="325.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">20 trades</tspan></text><rect x="440.0" y="318.7" width="90.0" height="31.3" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="485.0" y="308.7" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">4.3%</tspan></text><text x="485.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">50 trades</tspan></text><rect x="600.0" y="342.8" width="90.0" height="7.2" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="645.0" y="332.8" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">1.0%</tspan></text><text x="645.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">100 trades</tspan></text><rect x="760.0" y="349.7" width="90.0" height="2.0" rx="4" fill="#22c55e" fill-opacity="0.85"/><text x="805.0" y="339.7" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">&lt;0.1%</tspan></text><text x="805.0" y="374.0" font-size="14" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">200 trades</tspan></text><text x="90.0" y="410.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="90.0" dy="0.0">Judging a system on its last 10 trades is close to judging it on a coin flip. 100+ trades tell you much more.</tspan></text></svg>
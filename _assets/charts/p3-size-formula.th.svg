<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">สูตรคำนวณขนาดไม้</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัดสินเงินที่ยอมเสียได้ก่อน แล้วให้ Stop เป็นตัวบอกว่าซื้อได้เท่าไหร่</tspan></text><rect x="28.0" y="110.0" width="152.0" height="110.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="104.0" y="145.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">เงินในพอร์ต</tspan></text><text x="104.0" y="190.0" font-size="22" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">$10,000</tspan></text><text x="204.0" y="178.0" font-size="30" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">×</tspan></text><rect x="218.0" y="110.0" width="152.0" height="110.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="294.0" y="145.0" font-size="13" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="294.0" dy="0.0">% ความเสี่ยง</tspan></text><text x="294.0" y="190.0" font-size="22" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="294.0" dy="0.0">1%</tspan></text><text x="394.0" y="178.0" font-size="30" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="394.0" dy="0.0">=</tspan></text><rect x="408.0" y="110.0" width="152.0" height="110.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="484.0" y="145.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="484.0" dy="0.0">เงินที่เสี่ยง (1R)</tspan></text><text x="484.0" y="190.0" font-size="22" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="484.0" dy="0.0">$100</tspan></text><text x="584.0" y="178.0" font-size="30" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="584.0" dy="0.0">÷</tspan></text><rect x="598.0" y="110.0" width="152.0" height="110.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="674.0" y="145.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="674.0" dy="0.0">ระยะ Stop</tspan></text><text x="674.0" y="190.0" font-size="22" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="674.0" dy="0.0">$2.00</tspan></text><text x="774.0" y="178.0" font-size="30" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="774.0" dy="0.0">=</tspan></text><rect x="788.0" y="110.0" width="152.0" height="110.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="864.0" y="145.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="864.0" dy="0.0">ขนาดไม้</tspan></text><text x="864.0" y="190.0" font-size="22" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="864.0" dy="0.0">50 หุ้น</tspan></text><text x="674.0" y="240.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="674.0" dy="0.0">เข้า 50.00 − Stop 48.00</tspan></text><rect x="28.0" y="270.0" width="440.0" height="180.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="270.0" width="5.0" height="180.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="48.0" y="300.0" font-size="17" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">คริปโต / ตลาดไหนก็ได้</tspan></text><text x="48.0" y="329.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">เสี่ยง $100 เข้า BTC ที่ 60,000 Stop 58,500</tspan><tspan x="48.0" dy="18.9">ระยะ Stop = $1,500 ต่อ 1 BTC</tspan><tspan x="48.0" dy="18.9">ขนาด = 100 ÷ 1,500 = 0.0667 BTC</tspan><tspan x="48.0" dy="18.9">(มูลค่าสถานะ ≈ $4,000)</tspan></text><rect x="492.0" y="270.0" width="440.0" height="180.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="492.0" y="270.0" width="5.0" height="180.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="512.0" y="300.0" font-size="17" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="512.0" dy="0.0">มูลค่าสถานะ ≠ ความเสี่ยง</tspan></text><text x="512.0" y="329.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">50 หุ้น × $50 = $2,500 (25% ของพอร์ต)</tspan><tspan x="512.0" dy="18.9">แต่ถ้าโดน Stop คุณเสียแค่ $100 (1%)</tspan><tspan x="512.0" dy="18.9">ความเสี่ยงคือเงินที่เสียเมื่อโดน Stop</tspan><tspan x="512.0" dy="18.9">ไม่ใช่เงินที่จ่ายไป</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="560" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Phase 9 on one page</tspan></text><line x1="480.0" y1="310.0" x2="170.0" y2="140.0" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="790.0" y2="140.0" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="150.0" y2="320.0" stroke="#ef4444" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="810.0" y2="320.0" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="250.0" y2="480.0" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><line x1="480.0" y1="310.0" x2="710.0" y2="480.0" stroke="#22c55e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/><circle cx="480.0" cy="310.0" r="74" fill="#111a2e" stroke="#e5ecf6" stroke-width="2"/><text x="480.0" y="306.0" font-size="20" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">PHASE 9</tspan></text><text x="480.0" y="330.0" font-size="14" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">Quant</tspan></text><rect x="40.0" y="98.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><text x="170.0" y="126.0" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">9.1 Statistics</tspan></text><text x="170.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0.0">Mean, σ, fat tails.</tspan><tspan x="170.0" dy="17.6">Small samples lie.</tspan></text><rect x="660.0" y="98.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="790.0" y="126.0" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">9.2 Probability &amp; EV</tspan></text><text x="790.0" y="150.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="790.0" dy="0.0">Σ p × outcome.</tspan><tspan x="790.0" dy="17.6">Luck averages out slowly.</tspan></text><rect x="20.0" y="278.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="150.0" y="306.0" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">9.3 Backtesting</tspan></text><text x="150.0" y="330.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="150.0" dy="0.0">No look-ahead, costs,</tspan><tspan x="150.0" dy="17.6">out-of-sample, walk-forward.</tspan></text><rect x="680.0" y="278.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="1.5"/><text x="810.0" y="306.0" font-size="16" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">9.4 Internals</tspan></text><text x="810.0" y="330.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="810.0" dy="0.0">$TICK · $ADD · $VOLD · VIX.</tspan><tspan x="810.0" dy="17.6">Breadth confirms price.</tspan></text><rect x="120.0" y="438.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><text x="250.0" y="466.0" font-size="16" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">9.5 Python strategy</tspan></text><text x="250.0" y="490.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="250.0" dy="0.0">Simple rules, honest test.</tspan><tspan x="250.0" dy="17.6">IS winner can lose OOS.</tspan></text><rect x="580.0" y="438.0" width="260.0" height="92.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="710.0" y="466.0" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">9.6 Metrics</tspan></text><text x="710.0" y="490.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="710.0" dy="0.0">Sharpe, Sortino, max DD,</tspan><tspan x="710.0" dy="17.6">profit factor, sample size.</tspan></text></svg>
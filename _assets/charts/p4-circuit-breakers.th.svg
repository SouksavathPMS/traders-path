th="360.0" height="60.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="570.0" y="421.0" font-size="14" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="570.0" dy="0.0">หยุดเงินจริง ทบทวนทั้งหมด ใช้บัญชีทดลอง</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="400" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">แผงหน้าปัดของทองคำ: ตัวขับเคลื่อนหลัก 4 ตัว</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ความสัมพันธ์ที่พบบ่อย ไม่ใช่กฎตายตัว บางช่วงก็ไม่เป็นไปตามนี้นานหลายเดือน (ดูหัวข้อ 3)</tspan></text><rect x="28.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="28.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#3b82f6" fill-opacity="1"/><text x="136.0" y="130.0" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">ดอกเบี้ยที่แท้จริง</tspan></text><text x="88.0" y="196.0" font-size="44" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="88.0" dy="0.0">↑</tspan></text><text x="184.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="184.0" dy="0.0">↓</tspan></text><text x="88.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="88.0" dy="0.0">ตัวขับ</tspan></text><text x="184.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="184.0" dy="0.0">ทอง</tspan></text><line x1="114.0" y1="182.0" x2="156.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="44.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="44.0" dy="0.0">ทองไม่จ่ายดอกเบี้ย เมื่อพันธบัตร</tspan><tspan x="44.0" dy="16.2">ให้ผลตอบแทนหลังเงินเฟ้อสูงขึ้น</tspan><tspan x="44.0" dy="16.2">การถือทองก็มีต้นทุนสูงขึ้น</tspan></text><rect x="258.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="258.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="366.0" y="130.0" font-size="16" fill="#14b8a6" text-anchor="middle" font-weight="700"><tspan x="366.0" dy="0.0">ดอลลาร์สหรัฐ</tspan></text><text x="318.0" y="196.0" font-size="44" fill="#14b8a6" text-anchor="middle" font-weight="800"><tspan x="318.0" dy="0.0">↑</tspan></text><text x="414.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="414.0" dy="0.0">↓</tspan></text><text x="318.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="318.0" dy="0.0">ตัวขับ</tspan></text><text x="414.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="414.0" dy="0.0">ทอง</tspan></text><line x1="344.0" y1="182.0" x2="386.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="274.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="274.0" dy="0.0">ทองตั้งราคาเป็นดอลลาร์ ดอลลาร์</tspan><tspan x="274.0" dy="16.2">แข็งทำให้ทองแพงขึ้นสำหรับ</tspan><tspan x="274.0" dy="16.2">คนที่ใช้สกุลอื่น</tspan></text><rect x="488.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="488.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="596.0" y="130.0" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">ความกลัวและวิกฤต</tspan></text><text x="548.0" y="196.0" font-size="44" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="548.0" dy="0.0">↑</tspan></text><text x="644.0" y="196.0" font-size="44" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="644.0" dy="0.0">↑</tspan></text><text x="548.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="548.0" dy="0.0">ตัวขับ</tspan></text><text x="644.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="644.0" dy="0.0">ทอง</tspan></text><line x1="574.0" y1="182.0" x2="616.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="504.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="504.0" dy="0.0">สงคราม ธนาคารล้ม ตลาดถล่ม</tspan><tspan x="504.0" dy="16.2">→ คนต้องการสินทรัพย์ที่ไม่มี</tspan><tspan x="504.0" dy="16.2">ผู้ออกที่จะล้มได้</tspan></text><rect x="718.0" y="96.0" width="216.0" height="250.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="718.0" y="96.0" width="216.0" height="5.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="826.0" y="130.0" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">ธนาคารกลางซื้อทอง</tspan></text><text x="778.0" y="196.0" font-size="44" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="778.0" dy="0.0">↑</tspan></text><text x="874.0" y="196.0" font-size="44" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="874.0" dy="0.0">↑</tspan></text><text x="778.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="778.0" dy="0.0">ตัวขับ</tspan></text><text x="874.0" y="222.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="874.0" dy="0.0">ทอง</tspan></text><line x1="804.0" y1="182.0" x2="846.0" y2="182.0" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#a8ea0bd)"/><text x="734.0" y="262.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="734.0" dy="0.0">ผู้ซื้อที่ซื้อสม่ำเสมอไม่สนราคา</tspan><tspan x="734.0" dy="16.2">เพื่อกระจายทุนสำรอง</tspan><tspan x="734.0" dy="16.2">ออกจากดอลลาร์</tspan></text><text x="28.0" y="378.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="28.0" dy="0.0">ควรดูด้วย: การคาดการณ์เงินเฟ้อ ความต้องการทองรูปพรรณในอินเดียและจีน เงินไหลเข้าออก ETF (เช่น GLD)</tspan></text></svg>
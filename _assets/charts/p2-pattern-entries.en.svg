<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Where you enter decides the R:R, not the pattern</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">The double top from the first figure: same pattern, same target 42.0 (illustrative prices).</tspan></text><line x1="758.0" y1="110.0" x2="758.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="758.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="758.0" dy="0.0">42</tspan></text><line x1="634.0" y1="110.0" x2="634.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="634.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="634.0" dy="0.0">44</tspan></text><line x1="510.0" y1="110.0" x2="510.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="510.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="510.0" dy="0.0">46</tspan></text><line x1="386.0" y1="110.0" x2="386.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="386.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="386.0" dy="0.0">48</tspan></text><line x1="262.0" y1="110.0" x2="262.0" y2="320.0" stroke="#1a2540" stroke-width="1" stroke-opacity="1" stroke-linecap="round"/><text x="262.0" y="340.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="262.0" dy="0.0">50</tspan></text><text x="40.0" y="150.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">Short the breakout close</tspan></text><text x="40.0" y="172.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">entry 45.8 · stop 50.4</tspan></text><text x="40.0" y="190.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">stop above the right top</tspan></text><rect x="237.2" y="138.0" width="285.2" height="28.0" rx="3" fill="#ef4444" fill-opacity="0.5"/><rect x="522.4" y="138.0" width="235.6" height="28.0" rx="3" fill="#22c55e" fill-opacity="0.3"/><text x="768.0" y="158.0" font-size="15" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="768.0" dy="0.0">0.83R</tspan></text><text x="40.0" y="250.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="40.0" dy="0.0">Short the pullback to the neckline</tspan></text><text x="40.0" y="272.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">entry 46.0 · stop 47.2</tspan></text><text x="40.0" y="290.0" font-size="11" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="40.0" dy="0.0">stop above the pullback high (46.8) + buffer</tspan></text><rect x="435.6" y="238.0" width="74.4" height="28.0" rx="3" fill="#ef4444" fill-opacity="0.5"/><rect x="510.0" y="238.0" width="248.0" height="28.0" rx="3" fill="#22c55e" fill-opacity="0.3"/><text x="768.0" y="258.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="768.0" dy="0.0">3.33R</tspan></text><text x="40.0" y="400.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="40.0" dy="0.0">Bulkowski reports a pullback to the neckline in about 64% of double tops, so the better entry is often available, but not always.</tspan></text></svg>
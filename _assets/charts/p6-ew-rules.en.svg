<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The three unbreakable rules</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Break one and the count is wrong. Re-label, don&#x27;t argue.</tspan></text><rect x="28.0" y="92.0" width="904.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="122.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">1 · Wave 2 never goes below the start of wave 1</tspan></text><line x1="514.0" y1="192.1" x2="696.0" y2="192.1" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="520.0,192.1 576.7,159.3 633.3,179.7 690.0,126.4" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="712.0" y="156.0" font-size="20" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="712.0" dy="0.0">✓</tspan></text><line x1="724.0" y1="192.1" x2="906.0" y2="192.1" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="730.0,192.1 786.7,159.3 843.3,197.1 900.0,152.7" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="922.0" y="156.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="922.0" dy="0.0">✗</tspan></text><text x="46.0" y="156.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">If it does, it was not wave 2: the &#x27;impulse&#x27; failed.</tspan></text><rect x="28.0" y="224.0" width="904.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="254.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">2 · Wave 3 is never the shortest of 1, 3, 5</tspan></text><polyline points="520.0,324.1 554.0,291.3 588.0,311.0 622.0,258.4 656.0,278.1 690.0,245.3" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="712.0" y="288.0" font-size="20" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="712.0" dy="0.0">✓</tspan></text><polyline points="730.0,324.1 764.0,291.3 798.0,311.0 832.0,286.4 866.0,301.1 900.0,255.1" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="922.0" y="288.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="922.0" dy="0.0">✗</tspan></text><text x="46.0" y="288.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">Measure in price. If 3 is shortest, relabel.</tspan></text><rect x="28.0" y="356.0" width="904.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="386.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">3 · Wave 4 never enters wave 1&#x27;s territory</tspan></text><line x1="514.0" y1="423.3" x2="696.0" y2="423.3" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="520.0,456.1 554.0,423.3 588.0,443.0 622.0,390.4 656.0,410.1 690.0,377.3" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="712.0" y="420.0" font-size="20" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="712.0" dy="0.0">✓</tspan></text><line x1="724.0" y1="423.3" x2="906.0" y2="423.3" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="1" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="730.0,456.1 764.0,423.3 798.0,443.0 832.0,390.4 866.0,428.2 900.0,383.9" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="922.0" y="420.0" font-size="20" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="922.0" dy="0.0">✗</tspan></text><text x="46.0" y="420.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">No overlap with wave 1&#x27;s high (except diagonals).</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Pinning into expiry, release after</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Large gamma at a strike can hold price near it into options expiration (OPEX). After expiry, that gamma is gone.</tspan></text><rect x="28.0" y="90.0" width="904.0" height="360.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="70.0" y1="220.0" x2="890.0" y2="220.0" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="6 4" stroke-linecap="round"/><text x="76.0" y="212.0" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="76.0" dy="0.0">big gamma strike 5,050</tspan></text><line x1="658.7" y1="130.0" x2="658.7" y2="400.0" stroke="#a855f7" stroke-width="1.5" stroke-opacity="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="664.7" y="148.0" font-size="13" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="664.7" dy="0.0">OPEX</tspan></text><rect x="490.5" y="130.0" width="168.2" height="270.0" rx="0" fill="#f59e0b" fill-opacity="0.07"/><polyline points="70.0,246.5 91.0,241.1 112.1,222.5 133.1,203.3 154.1,191.4 175.1,194.8 196.2,195.0 217.2,201.7 238.2,218.4 259.2,223.3 280.3,213.7 301.3,212.7 322.3,217.1 343.3,226.6 364.4,225.7 385.4,228.5 406.4,226.0 427.4,221.0 448.5,235.1 469.5,231.0 490.5,235.6 511.5,235.2 532.6,235.8 553.6,225.4 574.6,220.7 595.6,218.7 616.7,221.5 637.7,224.9 658.7,246.4 679.7,248.7 700.8,260.1 721.8,246.5 742.8,267.2 763.8,217.3 784.9,204.8 805.9,148.4 826.9,149.4 847.9,166.0 869.0,202.8 890.0,185.3" fill="none" stroke="
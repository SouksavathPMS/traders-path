<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">พินบาร์จริงไหม? ตรวจคุณภาพสองข้อ</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ข้อ 1: ไส้ล่าง ≥ 2 เท่าของตัวแท่ง  ข้อ 2: ปิดในหนึ่งในสามบนของกรอบ (≥ 67%)</tspan></text><line x1="170.0" y1="153.5" x2="170.0" y2="318.2" stroke="#22c55e" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><rect x="148.0" y="165.3" width="44.0" height="35.3" rx="4" fill="#22c55e" fill-opacity="1"/><text x="170.0" y="100.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">แท่ง A</tspan></text><text x="170.0" y="360.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="170.0" dy="0.0">O 50 · H 50.8 · L 48 · C 50.6</tspan></text><text x="170.0" y="386.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ไส้ ÷ ตัว = 2.0 ÷ 0.6 = 3.3 เท่า</tspan></text><text x="170.0" y="408.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ตำแหน่งปิด 93%</tspan></text><rect x="144.8" y="430.0" width="50.5" height="26.0" rx="13.0" fill="#22c55e" fill-opacity="1"/><text x="170.0" y="450.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="170.0" dy="0.0">ผ่าน</tspan></text><line x1="480.0" y1="147.6" x2="480.0" y2="259.4" stroke="#22c55e" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><rect x="458.0" y="153.5" width="44.0" height="47.1" rx="4" fill="#22c55e" fill-opacity="1"/><text x="480.0" y="100.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">แท่ง B</tspan></text><text x="480.0" y="360.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="480.0" dy="0.0">O 50 · H 50.9 · L 49 · C 50.8</tspan></text><text x="480.0" y="386.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ไส้ ÷ ตัว = 1.0 ÷ 0.8 = 1.3 เท่า</tspan></text><text x="480.0" y="408.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ตำแหน่งปิด 95%</tspan></text><rect x="442.6" y="430.0" width="74.8" height="26.0" rx="13.0" fill="#ef4444" fill-opacity="1"/><text x="480.0" y="450.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="480.0" dy="0.0">ไม่ผ่าน</tspan></text><line x1="790.0" y1="141.8" x2="790.0" y2="318.2" stroke="#ef4444" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><rect x="768.0" y="224.1" width="44.0" height="11.8" rx="4" fill="#ef4444" fill-opacity="1"/><text x="790.0" y="100.0" font-size="16" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">แท่ง C</tspan></text><text x="790.0" y="360.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="790.0" dy="0.0">O 49.6 · H 51 · L 48 · C 49.4</tspan></text><text x="790.0" y="386.0" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">ไส้ ÷ ตัว = 1.4 ÷ 0.2 = 7.0 เท่า</tspan></text><text x="790.0" y="408.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">ตำแหน่งปิด 47%</tspan></text><rect x="752.6" y="430.0" width="74.8" height="26.0" rx="13.0" fill="#ef4444" fill-opacity="1"/><text x="790.0" y="450.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600"><tspan x="790.0" dy="0.0">ไม่ผ่าน</tspan></text></svg>
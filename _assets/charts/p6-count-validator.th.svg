<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a22c55e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="aef4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs><rect width="960" height="500" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">ตัวตรวจการนับ: ตรวจกฎด้วยตัวเลข</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">ตัวอย่าง: 0 = 100, 1 = 110, 2 = 103.8, 3 = 120, 4 = 108.5 (แทนที่จะเป็น 113.8)</tspan></text><rect x="40.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="140.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">กฎ 1</tspan></text><text x="140.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="140.0" dy="0.0">จุดต่ำคลื่น 2 &gt; จุดเริ่มคลื่น 1?</tspan></text><text x="140.0" y="206.0" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="140.0" dy="0.0">103.8 &gt; 100 ✓</tspan></text><line x1="242.0" y1="170.0" x2="268.0" y2="170.0" stroke="#22c55e" stroke-width="2" marker-end="url(#a22c55e)"/><rect x="270.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="1.5"/><text x="370.0" y="140.0" font-size="17" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">กฎ 2</tspan></text><text x="370.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="370.0" dy="0.0">คลื่น 3 ไม่สั้นที่สุด?</tspan></text><text x="370.0" y="206.0" font-size="18" fill="#22c55e" text-anchor="middle" font-weight="800"><tspan x="370.0" dy="0.0">16.2 &gt; 10 ✓</tspan></text><line x1="472.0" y1="170.0" x2="498.0" y2="170.0" stroke="#22c55e" stroke-width="2" marker-end="url(#a22c55e)"/><rect x="500.0" y="110.0" width="200.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="1.5"/><text x="600.0" y="140.0" font-size="17" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">กฎ 3</tspan></text><text x="600.0" y="168.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="600.0" dy="0.0">จุดต่ำคลื่น 4 &gt; จุดสูงคลื่น 1?</tspan></text><text x="600.0" y="206.0" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="800"><tspan x="600.0" dy="0.0">108.5 &lt; 110 ✗</tspan></text><rect x="730.0" y="110.0" width="202.0" height="120.0" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/><text x="831.0" y="145.0" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="831.0" dy="0.0">การนับ ใช้ไม่ได้</tspan></text><text x="831.0" y="172.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="831.0" dy="0.0">ออก / ไม่เข้า</tspan><tspan x="831.0" dy="16.2">แล้วติดป้ายใหม่:</tspan></text><line x1="700.0" y1="170.0" x2="726.0" y2="170.0" stroke="#ef4444" stroke-width="2" marker-end="url(#aef4444)"/><rect x="40.0" y="260.0" width="892.0" height="210.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="60.0" y="292.0" font-size="16" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">ทางเลือกเมื่อกฎ 3 ใช้ไม่ได้</tspan></text><text x="60.0" y="330.0" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">A · 103.8 → 120 เป็นแค่คลื่นย่อย (i) ของคลื่น 3 ที่ใหญ่กว่า 108.5 คือ (ii) ต้อง: 108.5 ยืนเหนือ 103.8</tspan></text><text x="60.0" y="370.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">B · การขึ้นทั้งหมด 100 → 120 คือการปรับฐาน (A-B-C) ในขาลง ต้อง: มีจุดต่ำใหม่ตามมา</tspan></text><text x="60.0" y="410.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="600"><tspan x="60.0" dy="0.0">C · Leading diagonal (ลิ่ม) ที่อนุญาตให้ทับซ้อนได้ พบน้อย ต้องมีรูปลิ่ม</tspan></text><text x="60.0" y="450.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="60.0" dy="0.0">Long จาก &#x27;คลื่น 4&#x27; ที่ 113.8 พร้อม Stop ตามกฎ 3 ที่ 109.6 โดน Stop −1R ก่อนราคาลงถึง 108.5</tspan></text></svg>
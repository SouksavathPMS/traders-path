<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a8ea0bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0bd"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">จากการเรียนสู่การเทรดจริง: ผ่านทีละขั้น</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">แต่ละขั้นมีประตูผ่าน ไม่ผ่าน → อยู่ต่อหรือถอยกลับ เงินตามหลักฐาน</tspan></text><rect x="28.0" y="100.0" width="219.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#3b82f6" stroke-width="1.5"/><rect x="28.0" y="100.0" width="219.0" height="46.0" rx="12" fill="#3b82f6" fill-opacity="0.18"/><text x="138.0" y="129.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">1 · เรียน &amp; Backtest</tspan></text><text x="46.0" y="180.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="46.0" dy="0.0">Backtest แมนนวล 50+ เทรด</tspan><tspan x="46.0" dy="17.6">กฎที่เขียนไว้</tspan></text><rect x="40.0" y="330.0" width="195.0" height="84.0" rx="10" fill="#3b82f6" fill-opacity="0.12"/><text x="52.0" y="360.0" font-size="13" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="52.0" dy="0.0">ประตู: EV บวก</tspan><tspan x="52.0" dy="17.6">ใน 50+ เทรด</tspan></text><line x1="249.0" y1="265.0" x2="257.0" y2="265.0" stroke="#8ea0bd" stroke-width="2" marker-end="url(#a8ea0bd)"/><rect x="259.0" y="100.0" width="219.0" height="330.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#14b8a6" stroke-width="1.5"/><rect x="259.0" y="100.0" width="219.0" height="46.0" rx="12" fill="#14b8a
="#22c55e" fill-opacity="0.18"/><text x="831.0" y="129.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="831.0" dy="0.0">4 · ขนาดปกติ</tspan></text><text x="739.0" y="180.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="739.0" dy="0.0">เสี่ยง 0.5–1%</tspan><tspan x="739.0" dy="17.6">ทบทวนรายเดือน</tspan></text><rect x="733.0" y="330.0" width="195.0" height="84.0" rx="10" fill="#22c55e" fill-opacity="0.12"/><text x="745.0" y="360.0" font-size="13" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="745.0" dy="0.0">ประตู: 100+ เทรด</tspan><tspan x="745.0" dy="17.6">อยู่ในกฎ Drawdown</tspan></text><text x="48.0" y="458.0" font-size="13" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">ถอยกลับขั้นก่อนหน้าถ้า: Drawdown −10% ผิดกฎเบรกเกอร์ หรือ EV ติดลบใน 50 เทรด</tspan></text></svg>
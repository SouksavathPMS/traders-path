<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="af59e0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">How trades land on a footprint: bid × ask</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Best bid 100.00 / best ask 100.25. Two market orders, then the diagonal imbalance check.</tspan></text><rect x="28.0" y="90.0" width="440.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="46.0" y="120.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="46.0" dy="0.0">1 · Two single trades</tspan></text><text x="80.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="80.0" dy="0.0">Price    sells × buys</tspan></text><rect x="60.0" y="164.0" width="300.0" height="34.0" rx="6" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="80.0" y="186.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="80.0" dy="0.0">100.25</tspan></text><text x="210.0" y="186.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="210.0" dy="0.0">0</tspan></text><text x="232.0" y="186.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="232.0" dy="0.0">×</tspan></text><text x="254.0" y="186.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="254.0" dy="0.0">5</tspan></text><rect x="60.0" y="204.0" width="300.0" height="34.0" rx="6" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="80.0" y="226.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="80.0" dy="0.0">100.00</tspan></text><text x="210.0" y="226.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="210.0" dy="0.0">3</tspan></text><text x="232.0" y="226.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="232.0" dy="0.0">×</tspan></text><text x="254.0" y="226.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="254.0" dy="0.0">0</tspan></text><text x="48.0" y="290.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">A buys 5 with a MARKET order → fills at the</tspan><tspan x="48.0" dy="17.6">ask 100.25 → right column: 0 × 5</tspan><tspan x="48.0" dy="17.6">B sells 3 with a MARKET order → fills at the</tspan><tspan x="48.0" dy="17.6">bid 100.00 → left column: 3 × 0</tspan><tspan x="48.0" dy="17.6">Delta = buys − sells = 5 − 3 = +2</tspan></text><rect x="492.0" y="90.0" width="440.0" height="350.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="510.0" y="120.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">2 · Diagonal imbalance (≥ 3×)</tspan></text><text x="544.0" y="160.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="700"><tspan x="544.0" dy="0.0">Price    sells × buys</tspan></text><rect x="524.0" y="164.0" width="300.0" height="34.0" rx="6" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="544.0" y="186.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="544.0" dy="0.0">100.50</tspan></text><text x="674.0" y="186.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="674.0" dy="0.0">90</tspan></text><text x="696.0" y="186.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="696.0" dy="0.0">×</tspan></text><text x="718.0" y="186.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="718.0" dy="0.0">210</tspan></text><rect x="524.0" y="204.0" width="300.0" height="34.0" rx="6" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="544.0" y="226.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="544.0" dy="0.0">100.25</tspan></text><text x="674.0" y="226.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="674.0" dy="0.0">140</tspan></text><text x="696.0" y="226.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="696.0" dy="0.0">×</tspan></text><text x="718.0" y="226.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="718.0" dy="0.0">450</tspan></text><rect x="524.0" y="244.0" width="300.0" height="34.0" rx="6" fill="#0b1220" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="544.0" y="266.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="600"><tspan x="544.0" dy="0.0">100.00</tspan></text><text x="674.0" y="266.0" font-size="15" fill="#ef4444" text-anchor="end" font-weight="700"><tspan x="674.0" dy="0.0">120</tspan></text><text x="696.0" y="266.0" font-size="15" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="696.0" dy="0.0">×</tspan></text><text x="718.0" y="266.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="718.0" dy="0.0">160</tspan></text><line x1="735.0" y1="222.0" x2="670.0" y2="260.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#af59e0b)"/><text x="840.0" y="230.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">450 ÷ 120</tspan><tspan x="840.0" dy="18.9">= 3.75 ✓</tspan></text><text x="512.0" y="330.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="512.0" dy="0.0">Buyers at 100.25 vs sellers one tick LOWER</tspan><tspan x="512.0" dy="17.6">(100.00): 450 vs 120 → buy imbalance.</tspan><tspan x="512.0" dy="17.6">Straight across (450 vs 140) would be wrong:</tspan><tspan x="512.0" dy="17.6">those trades happened at different prices.</tspan></text></svg>
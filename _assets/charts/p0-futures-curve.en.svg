<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="430" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Futures curve: contango vs backwardation</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Each dot is the price of a contract that expires in a different month.</tspan></text><rect x="28.0" y="92.0" width="442.0" height="318.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="122.0" font-size="16" fill="#3b82f6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Contango (normal for gold)</tspan></text><text x="78.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="78.0" dy="0.0">Spot</tspan></text><text x="148.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="148.0" dy="0.0">Dec</tspan></text><text x="218.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="218.0" dy="0.0">Feb</tspan></text><text x="288.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="288.0" dy="0.0">Apr</tspan></text><text x="358.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="358.0" dy="0.0">Jun</tspan></text><text x="428.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="428.0" dy="0.0">Aug</tspan></text><polyline points="78.0,300.0 148.0,271.6 218.0,244.2 288.0,215.8 358.0,187.4 428.0,160.0" fill="none" stroke="#3b82f6" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78.0" cy="300.0" r="5" fill="#3b82f6"/><text x="78.0" y="286.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="78.0" dy="0.0">4,000</tspan></text><circle cx="148.0" cy="271.6" r="5" fill="#3b82f6"/><circle cx="218.0" cy="244.2" r="5" fill="#3b82f6"/><circle cx="288.0" cy="215.8" r="5" fill="#3b82f6"/><circle cx="358.0" cy="187.4" r="5" fill="#3b82f6"/><circle cx="428.0" cy="160.0" r="5" fill="#3b82f6"/><text x="428.0" y="146.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="428.0" dy="0.0">4,133</tspan></text><text x="48.0" y="360.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="48.0" dy="0.0">Later = more expensive.</tspan><tspan x="48.0" dy="17.6">The gap ≈ interest for holding</tspan><tspan x="48.0" dy="17.6">gold until that month.</tspan></text><rect x="490.0" y="92.0" width="442.0" height="318.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="510.0" y="122.0" font-size="16" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="510.0" dy="0.0">Backwardation</tspan></text><text x="540.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="540.0" dy="0.0">Spot</tspan></text><text x="610.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="610.0" dy="0.0">Dec</tspan></text><text x="680.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="680.0" dy="0.0">Feb</tspan></text><text x="750.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="750.0" dy="0.0">Apr</tspan></text><text x="820.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="820.0" dy="0.0">Jun</tspan></text><text x="890.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="middle" font-weight="400"><tspan x="890.0" dy="0.0">Aug</tspan></text><polyline points="540.0,160.0 610.0,196.2 680.0,232.4 750.0,261.4 820.0,283.1 890.0,300.0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="540.0" cy="160.0" r="5" fill="#f59e0b"/><text x="540.0" y="146.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">80</tspan></text><circle cx="610.0" cy="196.2" r="5" fill="#f59e0b"/><circle cx="680.0" cy="232.4" r="5" fill="#f59e0b"/><circle cx="750.0" cy="261.4" r="5" fill="#f59e0b"/><circle cx="820.0" cy="283.1" r="5" fill="#f59e0b"/><circle cx="890.0" cy="300.0" r="5" fill="#f59e0b"/><text x="890.0" y="286.0" font-size="12" fill="#e5ecf6" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">74.2</tspan></text><text x="510.0" y="360.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="510.0" dy="0.0">Later = cheaper. People want</tspan><tspan x="510.0" dy="17.6">it NOW (e.g. oil in a supply</tspan><tspan x="510.0" dy="17.6">shortage).</tspan></text></svg>
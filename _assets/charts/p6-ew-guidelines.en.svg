<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Guidelines: what usually happens (not always)</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Rules invalidate a count. Guidelines rank which count is more likely.</tspan></text><rect x="28.0" y="90.0" width="520.0" height="370.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><line x1="60.0" y1="345.3" x2="545.6" y2="123.7" stroke="#3b82f6" stroke-width="1.3" stroke-opacity="1" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="60.0" y1="431.0" x2="545.6" y2="209.3" stroke="#3b82f6" stroke-width="1.3" stroke-opacity="1" stroke-dasharray="5 4" stroke-linecap="round"/><polyline points="60.0,392.0 162.2,298.7 223.6,356.3 366.7,205.3 428.0,263.0 520.0,169.7" fill="none" stroke="#e5ecf6" stroke-width="2.6" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="162.2" cy="298.7" r="4" fill="#22c55e"/><text x="162.2" y="286.7" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="162.2" dy="0.0">1</tspan></text><circle cx="223.6" cy="356.3" r="4" fill="#ef4444"/><text x="223.6" y="380.3" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="223.6" dy="0.0">2</tspan></text><circle cx="366.7" cy="205.3" r="4" fill="#22c55e"/><text x="366.7" y="193.3" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="366.7" dy="0.0">3</tspan></text><circle cx="428.0" cy="263.0" r="4" fill="#ef4444"/><text x="428.0" y="287.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="428.0" dy="0.0">4</tspan></text><circle cx="520.0" cy="169.7" r="4" fill="#22c55e"/><text x="520.0" y="157.7" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">5</tspan></text><text x="70.0" y="440.0" font-size="12" fill="#3b82f6" text-anchor="start" font-weight="400"><tspan x="70.0" dy="0.0">Channel: line through 1-3, parallel through 2 → wave 5 target zone</tspan></text><rect x="564.0" y="90.0" width="368.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="564.0" y="90.0" width="5.0" height="66.0" rx="2" fill="#22c55e" fill-opacity="1"/><text x="584.0" y="116.0" font-size="15" fill="#22c55e" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Wave 3 ≈ 1.618 × wave 1</tspan></text><text x="584.0" y="140.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="584.0" dy="0.0">often the longest, strongest leg</tspan></text><rect x="564.0" y="166.0" width="368.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="564.0" y="166.0" width="5.0" height="66.0" rx="2" fill="#14b8a6" fill-opacity="1"/><text x="584.0" y="192.0" font-size="15" fill="#14b8a6" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Wave 2 ≈ 50–61.8% of 1</tspan></text><text x="584.0" y="216.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="584.0" dy="0.0">deep, sharp correction</tspan></text><rect x="564.0" y="242.0" width="368.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="564.0" y="242.0" width="5.0" height="66.0" rx="2" fill="#f59e0b" fill-opacity="1"/><text x="584.0" y="268.0" font-size="15" fill="#f59e0b" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Wave 4 ≈ 38.2% of 3</tspan></text><text x="584.0" y="292.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="584.0" dy="0.0">shallow, sideways correction</tspan></text><rect x="564.0" y="318.0" width="368.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="564.0" y="318.0" width="5.0" height="66.0" rx="2" fill="#a855f7" fill-opacity="1"/><text x="584.0" y="344.0" font-size="15" fill="#a855f7" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Alternation</tspan></text><text x="584.0" y="368.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="584.0" dy="0.0">if 2 is sharp, 4 is usually flat (and vice versa)</tspan></text><rect x="564.0" y="394.0" width="368.0" height="66.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="564.0" y="394.0" width="5.0" height="66.0" rx="2" fill="#ec4899" fill-opacity="1"/><text x="584.0" y="420.0" font-size="15" fill="#ec4899" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Wave 5 ≈ wave 1</tspan></text><text x="584.0" y="444.0" font-size="13" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="584.0" dy="0.0">when wave 3 extended; momentum diverges</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="440" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">อ่านราคาฟอเร็กซ์</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">EUR/USD 1.0850 หมายถึง: 1 ยูโรมีราคา 1.0850 ดอลลาร์สหรัฐ</tspan></text><text x="200.0" y="200.0" font-size="64" fill="#3b82f6" text-anchor="middle" font-weight="800"><tspan x="200.0" dy="0.0">EUR</tspan></text><text x="285.0" y="200.0" font-size="64" fill="#8ea0bd" text-anchor="middle" font-weight="300"><tspan x="285.0" dy="0.0">/</tspan></text><text x="370.0" y="200.0" font-size="64" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="370.0" dy="0.0">USD</tspan></text><text x="200.0" y="240.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="600"><tspan x="200.0" dy="0.0">สกุลเงินหลัก (Base)</tspan><tspan x="200.0" dy="17.6">(สิ่งที่คุณซื้อหรือขาย)</tspan></text><text x="370.0" y="240.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="600"><tspan x="370.0" dy="0.0">สกุลเงินอ้างอิง (Quote)</tspan><tspan x="370.0" dy="17.6">(สิ่งที่ใช้จ่าย)</tspan></text><text x="641.0" y="200.0" font-size="64" fill="#e5ecf6" text-anchor="end" font-weight="800"><tspan x="641.0" dy="0.0">1.08</tspan></text><text x="646.0" y="200.0" font-size="64" fill="#22c55e" text-anchor="start" font-weight="800"><tspan x="646.0" dy="0.0">5</tspan></text><text x="684.0" y="200.0" font-size="64" fill="#5b6b88" text-anchor="start" font-weight="800"><tspan x="684.0" dy="0.0">0</tspan></text><line x1="664.0" y1="214.0" x2="664.0" y2="262.0" stroke="#22c55e" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><text x="656.0" y="284.0" font-size="13" fill="#22c55e" text-anchor="end" font-weight="700"><tspan x="656.0" dy="0.0">ทศนิยมตำแหน่งที่ 4 = 1 PIP</tspan></text><line x1="702.0" y1="214.0" x2="702.0" y2="310.0" stroke="#5b6b88" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/><text x="712.0" y="330.0" font-size="12" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="712.0" dy="0.0">ตำแหน่งที่ 5 = Pipette (1/10 pip)</tspan></text><rect x="28.0" y="360.0" width="904.0" height="62.0" rx="10" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="386.0" font-size="14" fill="#22c55e" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">BUY EUR/USD = ซื้อยูโร จ่ายดอลลาร์ → กำไรถ้ายูโรแข็งค่าขึ้น</tspan></text><text x="48.0" y="408.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0.0">SELL EUR/USD = ขายยูโร รับดอลลาร์ → กำไรถ้ายูโรอ่อนค่าลง  (คู่เงิน JPY: 1 pip = 0.01)</tspan></text></svg>
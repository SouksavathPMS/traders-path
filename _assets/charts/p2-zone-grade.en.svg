<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><rect width="960" height="470" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">Grading a demand zone: a 6-point scorecard</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Example from the lesson: base 104.4–105.8, leg-out through 115.2 (BOS), first return.</tspan></text><rect x="28.0" y="100.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="127.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Departure</tspan></text><text x="260.0" y="127.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">big bodies, left fast</tspan></text><text x="600.0" y="128.0" font-size="20" fill="#22c55e" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✓</tspan></text><rect x="28.0" y="150.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="177.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Time in base</tspan></text><text x="260.0" y="177.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">3 candles</tspan></text><text x="600.0" y="178.0" font-size="20" fill="#22c55e" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✓</tspan></text><rect x="28.0" y="200.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="227.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Freshness</tspan></text><text x="260.0" y="227.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">1st return</tspan></text><text x="600.0" y="228.0" font-size="20" fill="#22c55e" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✓</tspan></text><rect x="28.0" y="250.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="277.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Structure</tspan></text><text x="260.0" y="277.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">leg-out broke 115.2 (BOS)</tspan></text><text x="600.0" y="278.0" font-size="20" fill="#22c55e" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✓</tspan></text><rect x="28.0" y="300.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">HTF trend</tspan></text><text x="260.0" y="327.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">daily trend still down</tspan></text><text x="600.0" y="328.0" font-size="20" fill="#ef4444" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✗</tspan></text><rect x="28.0" y="350.0" width="600.0" height="42.0" rx="8" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><text x="48.0" y="377.0" font-size="15" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="48.0" dy="0.0">Room</tspan></text><text x="260.0" y="377.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="260.0" dy="0.0">5.4R to 117.6</tspan></text><text x="600.0" y="378.0" font-size="20" fill="#22c55e" text-anchor="end" font-weight="800"><tspan x="600.0" dy="0.0">✓</tspan></text><rect x="660.0" y="100.0" width="272.0" height="292.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="1.5"/><text x="796.0" y="150.0" font-size="16" fill="#8ea0bd" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">Score</tspan></text><text x="796.0" y="220.0" font-size="48" fill="#f59e0b" text-anchor="middle" font-weight="800"><tspan x="796.0" dy="0.0">5 / 6</tspan></text><text x="796.0" y="270.0" font-size="13" fill="#e5ecf6" text-anchor="middle" font-weight="400"><tspan x="796.0" dy="0.0">Tradable, but against</tspan><tspan x="796.0" dy="17.6">the HTF trend:</tspan></text><text x="796.0" y="320.0" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">wait for an LTF CHoCH,</tspan><tspan x="796.0" dy="17.6">size normally</tspan></text><text x="28.0" y="430.0" font-size="13" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Rule: skip any zone that fails departure, freshness or trend unless another strong factor compensates.</tspan></text></svg>
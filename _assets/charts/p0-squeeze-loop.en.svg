<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Inter, 'Noto Sans Thai', Sarabun, Thonburi, 'Sukhumvit Set', 'Segoe UI', Roboto, sans-serif"><defs><marker id="a5b6b88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b88"/></marker></defs><rect width="960" height="480" rx="16" fill="#0b1220"/><text x="28.0" y="44.0" font-size="24" fill="#e5ecf6" text-anchor="start" font-weight="700"><tspan x="28.0" dy="0.0">The short squeeze loop</tspan></text><text x="28.0" y="72.0" font-size="15" fill="#8ea0bd" text-anchor="start" font-weight="400"><tspan x="28.0" dy="0.0">Rising price forces shorts to buy, and their buying pushes the price higher still.</tspan></text><rect x="360.0" y="100.0" width="240.0" height="80.0" rx="14" fill="#111a2e" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="480.0" y="134.0" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Price rises</tspan><tspan x="480.0" dy="18.9">(news, buyers)</tspan></text><rect x="600.0" y="220.0" width="240.0" height="80.0" rx="14" fill="#111a2e" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="720.0" y="254.0" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Shorts&#x27; losses grow;</tspan><tspan x="720.0" dy="18.9">stops and margin calls</tspan></text><rect x="360.0" y="340.0" width="240.0" height="80.0" rx="14" fill="#111a2e" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="480.0" y="374.0" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Shorts must BUY</tspan><tspan x="480.0" dy="18.9">to close</tspan></text><rect x="120.0" y="220.0" width="240.0" height="80.0" rx="14" fill="#111a2e" fill-opacity="1" stroke="#a855f7" stroke-width="2"/><text x="240.0" y="254.0" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Few shares to buy</tspan><tspan x="240.0" dy="18.9">(high short interest)</tspan></text><line x1="564.0" y1="182.0" x2="628.8" y2="214.4" stroke="#5b6b88" stroke-width="2.2" marker-end="url(#a5b6b88)"/><line x1="636.0" y1="302.0" x2="571.2" y2="334.4" stroke="#5b6b88" stroke-width="2.2" marker-end="url(#a5b6b88)"/><line x1="396.0" y1="338.0" x2="331.2" y2="305.6" stroke="#5b6b88" stroke-width="2.2" marker-end="url(#a5b6b88)"/><line x1="324.0" y1="218.0" x2="388.8" y2="185.6" stroke="#5b6b88" stroke-width="2.2" marker-end="url(#a5b6b88)"/><rect x="30.0" y="90.0" width="190.0" height="120.0" rx="12" fill="#111a2e" fill-opacity="1" stroke="#23314f" stroke-width="1.5"/><rect x="30.0" y="90.0" width="5.0" height="120.0" rx="2" fill="#ef4444" fill-opacity="1"/><text x="50.0" y="120.0" font-size="14" fill="#ef4444" text-anchor="start" font-weight="700"><tspan x="50.0" dy="0.0">GameStop, Jan 2021</tspan></text><text x="50.0" y="146.0" font-size="12" fill="#e5ecf6" text-anchor="start" font-weight="400"><tspan x="50.0" dy="0.0">about $17 → $483</tspan><tspan x="50.0" dy="16.2">intraday on 28 Jan</tspan><tspan x="50.0" dy="16.2">(pre-2022-split prices)</tspan><tspan x="50.0" dy="16.2">~140% of float short</tspan></text></svg>
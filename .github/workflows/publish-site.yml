# Trader's Path · build the website from the vault and publish it to GitHub Pages (C10, Oct 2026).
# Runs on every push to main, or by hand (Actions tab → "Publish site" → Run workflow).
# Steps: printable PDFs → build.py (sync + site) → safety check → upload site/ → deploy to Pages.
# Setup once: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Thai fonts (for the PDFs)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-thai-tlwg

      - name: Printable PDF per phase
        run: python _tools/make_pdfs.py

      - name: Build the website
        run: python _tools/build.py

      - name: Check that no raw Obsidian syntax leaked into the pages
        run: |
          if grep -rlF -e BLOCKTOKEN -e '![[' site --include='*.html'; then
            echo "Found unrendered blocks or embeds in the files above."; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
